<!doctype html>
<html lang="en">
<head>
<!--#head-->
<title>Check your email · Hentity</title>
</head>
<body class="no-tabbar">
<div class="auth">
  <div data-brand></div>
  <main class="auth__side">
    <div data-mobilebar data-back="/signup"></div>
    <div class="auth__form">
      <div class="icon-badge icon-badge--accent"><span data-icon="mail"></span></div>
      <h1 class="t-h2">Check your email</h1>
      <div class="stack gap-4">
        <p class="c-2">We sent a verification link to</p>
        <p class="t-body" style="font-weight:500" id="to">ada@ledgerline.app</p>
        <p class="c-2">Open it to finish creating your account. The link works for 48 hours.</p>
      </div>
      <div class="grid-2" style="gap:8px">
        <a class="btn btn--secondary" href="https://mail.google.com/mail/u/0/#search/from%3Ahentity" target="_blank" rel="noopener"><span data-icon="google"></span>Open Gmail</a>
        <a class="btn btn--secondary" href="https://outlook.live.com/mail/0/" target="_blank" rel="noopener"><span data-icon="mail"></span>Open Outlook</a>
      </div>
      <div class="alert alert--info" role="status">
        <span data-icon="info"></span>
        <div><p class="alert__title">Didn’t get it?</p><p class="alert__body" id="info-body">Check spam or promotions. You can request a new link in <span class="mono" data-left>0:45</span>.</p></div>
      </div>
      <div class="auth__row">
        <button class="link" type="button" id="resend" disabled style="color:var(--color-text-tertiary);font-weight:500">Resend email (<span data-left>0:45</span>)</button>
        <button class="link" type="button" id="change">Use a different email</button>
      </div>
      <form id="change-form" class="stack gap-12" hidden novalidate>
        <div class="field" id="f-email"><label class="field__label" for="email">New email</label><input class="input" id="email" type="email" autocomplete="email" required></div>
        <div class="row gap-8"><button class="btn btn--primary" type="submit">Send link</button><button class="btn btn--ghost" type="button" id="cancel">Cancel</button></div>
      </form>
      <a class="link" href="/signin" style="align-self:center">Already verified? Sign in</a>
    </div>
  </main>
</div>
<script src="/assets/auth.js"></script>
<script>
H.mount();
(async function () {
  const { qs, qsa, toast } = H;
  const pending = JSON.parse(sessionStorage.getItem('hentity.pending') || '{}');
  if (!pending.email) { location.replace('/signup'); return; }
  qs('#to').textContent = pending.email;
  const dom = pending.email.split('@')[1] || '';
  if (/outlook|hotmail|live\./.test(dom)) qs('#to').closest('.stack').insertAdjacentHTML('afterend', '');
  let left = 45, t;
  function tick() {
    const s = `0:${String(left).padStart(2, '0')}`; qsa('[data-left]').forEach(el => el.textContent = s);
    const r = qs('#resend');
    if (left <= 0) { clearInterval(t); r.disabled = false; r.style.color = ''; r.textContent = 'Resend email'; qs('#info-body').textContent = 'Check spam or promotions, or resend the link now.'; }
    left--;
  }
  function start() { left = 45; const r = qs('#resend'); r.disabled = true; r.style.color = 'var(--color-text-tertiary)'; r.innerHTML = 'Resend email (<span data-left>0:45</span>)'; qs('#info-body').innerHTML = 'Check spam or promotions. You can request a new link in <span class="mono" data-left>0:45</span>.'; clearInterval(t); tick(); t = setInterval(tick, 1000); }
  start();
  qs('#resend').addEventListener('click', async () => { try { await API.auth.resend(pending.email, 'signup'); toast('Verification email sent'); start(); } catch (e) { toast(/rate/i.test(e.message) ? 'Too many requests. Wait a minute.' : e.message, 'error'); } });
  qs('#change').addEventListener('click', () => { location.href = '/signup'; });
  // When they verify in another tab, this tab notices
  API.onAuth((ev, s) => { if (s) location.href = '/welcome?verified=1'; });
  setInterval(async () => { const { data } = await API.sb.auth.getSession(); if (data.session) location.href = '/welcome?verified=1'; }, 4000);
})();
</script>
</body>
</html>
