<!doctype html>
<html lang="en">
<head>
<!--#head-->
<title>Sign in · Hentity</title>
</head>
<body class="no-tabbar">
<div class="auth">
  <div data-brand></div>
  <main class="auth__side">
    <div data-mobilebar></div>
    <form class="auth__form" id="form" novalidate>
      <div class="auth__heading">
        <h1 class="t-h2">Welcome back</h1>
        <p class="c-2">Sign in to upvote, comment and launch your products.</p>
      </div>
      <div class="alert alert--error" id="err" role="alert" hidden>
        <span data-icon="alert-circle"></span>
        <div><p class="alert__title" id="err-title">Email or password is incorrect</p><p class="alert__body" id="err-body">Check both and try again. After 8 attempts sign-in pauses for 15 minutes.</p></div>
      </div>
      <a class="btn btn--secondary btn--block" href="#" id="google"><span data-icon="google"></span>Continue with Google</a>
      <div class="divider-label">or</div>
      <div class="field" id="f-email">
        <label class="field__label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
      </div>
      <div class="field" id="f-password">
        <label class="field__label" for="password">Password</label>
        <div class="input-group">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
          <button class="input-group__btn" type="button" data-reveal aria-label="Show password"></button>
        </div>
      </div>
      <div class="auth__row">
        <label class="check"><input type="checkbox" checked name="remember" id="remember"><span class="check__box"><span data-icon="check"></span></span>Keep me signed in</label>
        <a class="link" href="/forgot-password"><span class="hide-sm">Forgot password?</span><span class="show-sm">Forgot?</span></a>
      </div>
      <button class="btn btn--primary btn--block" type="submit">Sign in</button>
      <p class="auth__switch">New to Hentity? <a href="/signup">Create an account</a></p>
    </form>
  </main>
</div>
<script src="/assets/auth.js"></script>
<template id="mfa-tpl"><form class="auth__form" id="mfa-form" novalidate><div class="icon-badge"><span data-icon="shield"></span></div><div class="auth__heading"><h1 class="t-h2">Enter your code</h1><p class="c-2">Open your authenticator app and type the 6-digit code for Hentity.</p></div><div class="field" id="f-code"><label class="field__label" for="code">Code</label><input class="input mono" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="letter-spacing:.3em;font-size:20px"></div><button class="btn btn--primary btn--block" type="submit">Verify</button><button class="link" type="button" id="mfa-back" style="align-self:center">Use a different account</button></form></template>
<script>
H.mount();
(async function () {
  const { qs, toast } = H;
  const form = qs('#form'), err = qs('#err');
  await API.ready;
  if (API.uid && !H.params().get('force')) { const { data } = await API.sb.auth.mfa.getAuthenticatorAssuranceLevel(); if (!(data && data.nextLevel === 'aal2' && data.currentLevel !== 'aal2')) { location.replace(Auth.next()); return; } else showMfa(); }
  function fail([title, body]) { qs('#err-title').textContent = title; qs('#err-body').textContent = body; err.hidden = false; err.classList.remove('reveal'); void err.offsetWidth; err.classList.add('reveal'); qs('#f-email').classList.add('is-error'); qs('#f-password').classList.add('is-error'); }
  form.addEventListener('input', () => { err.hidden = true; qs('#f-email').classList.remove('is-error'); qs('#f-password').classList.remove('is-error'); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const email = form.email.value.trim().toLowerCase(), pw = form.password.value;
    if (!Auth.emailOk(email) || !pw) return fail(['Enter your email and password', 'Both fields are needed to sign in.']);
    const btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.innerHTML = H.icon('clock', 'spin') + 'Signing in';
    try {
      await API.auth.signIn(email, pw);
      const { data } = await API.sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if (data && data.nextLevel === 'aal2' && data.currentLevel !== 'aal2') { showMfa(); return; }
      done();
    } catch (ex) {
      if (/Email not confirmed/i.test(ex.message)) { sessionStorage.setItem('hentity.pending', JSON.stringify({ email })); location.href = '/check-email?unconfirmed=1'; return; }
      fail(Auth.friendly(ex.message));
    } finally { btn.disabled = false; btn.textContent = 'Sign in'; }
  });
  function done() { const p = API.profile; toast('Signed in as ' + (p ? p.name : 'you')); setTimeout(() => location.href = Auth.next(), 350); }
  function showMfa() {
    form.replaceWith(qs('#mfa-tpl').content.cloneNode(true)); H.mount();
    const mf = qs('#mfa-form'); qs('#code').focus();
    qs('#mfa-back').onclick = async () => { await API.auth.signOut(); location.reload(); };
    mf.addEventListener('submit', async e => {
      e.preventDefault();
      const { data: f } = await API.sb.auth.mfa.listFactors(); const factor = (f.totp || []).find(x => x.status === 'verified');
      const { error } = await API.sb.auth.mfa.challengeAndVerify({ factorId: factor.id, code: qs('#code').value.trim() });
      if (error) { qs('#f-code').classList.add('is-error'); toast('That code didn’t match. Use the newest one.', 'error'); return; }
      await API.refreshProfile(); done();
    });
  }
  qs('#google').addEventListener('click', async e => { e.preventDefault(); try { await API.auth.google(Auth.next()); } catch (ex) { fail(Auth.friendly(ex.message)); } });
})();
</script>
</body>
</html>
