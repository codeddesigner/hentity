<!doctype html>
<html lang="en">
<head>
<!--#head-->
<title>You · Hentity</title>
<meta name="robots" content="noindex">
<style>
.me{max-width:560px;margin:0 auto;padding:24px 16px 40px}
.me-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:20px 0 16px}
.me-stats b{display:block;font-size:20px;line-height:26px;font-weight:600}
.me-menu a,.me-menu label{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;font-size:14px;font-weight:500}
.me-menu a:hover{background:var(--color-bg-subtle)}
.me-menu .ic{width:18px;height:18px}
.me-menu .meta{margin-left:auto;font-size:13px;color:var(--color-text-tertiary);font-weight:400}
</style>
</head>
<body class="subtle">
<div data-header></div>
<main class="me">
  <h1 class="t-h2" style="margin-bottom:20px">You</h1>
  <section class="card card--pad">
    <div class="row gap-16"><span id="me-av" class="avatar avatar--72"></span><div><p class="t-h4" id="me-name"></p><p class="row gap-6 t-body-sm c-3">@<span id="me-handle"></span> <span id="me-city" class="row gap-6"></span></p></div></div>
    <div class="me-stats"><div><b id="f1" data-count-to="0">0</b><span class="t-caption c-3" style="font-weight:400">followers</span></div><div><b id="f2" data-count-to="0">0</b><span class="t-caption c-3" style="font-weight:400">following</span></div><div><b id="f3" data-count-to="0">0</b><span class="t-caption c-3" style="font-weight:400">products</span></div></div>
    <a class="btn btn--secondary btn--sm btn--block" id="pub" href="/"><span data-icon="arrow-up-right"></span>View public profile</a>
  </section>
  <nav class="card me-menu" style="margin-top:16px;padding:6px 0;overflow:hidden">
    <a href="/my-products"><span data-icon="rocket"></span>My products<span class="meta" id="mp-n"></span></a>
    <a href="/saved"><span data-icon="bookmark"></span>Saved<span class="meta" id="sv-n"></span></a>
    <a href="/notifications"><span data-icon="bell"></span>Notifications<span class="meta" id="unread"></span></a>
    <a href="/settings/profile"><span data-icon="settings"></span>Settings</a><a href="/admin" id="admin-link" hidden><span data-icon="shield"></span>Admin</a><a href="/news"><span data-icon="newspaper"></span>News</a><a href="/insights"><span data-icon="bar-chart"></span>Insights</a>
    <label><span data-icon="eye"></span>Dark mode<span class="toggle" style="margin-left:auto"><input type="checkbox" data-theme-toggle aria-label="Dark mode"><span class="toggle__track"></span></span></label>
    <a href="/guidelines"><span data-icon="info"></span>Help &amp; guidelines</a>
  </nav>
  <button class="btn btn--ghost" type="button" data-signout style="color:var(--color-error);margin-top:16px"><span data-icon="arrow-left"></span>Sign out</button>
</main>
<div data-tabbar></div>
<script>
H.mount({ tab: 'you' });
(async () => {
  await API.ready;
  if (!API.uid) { location.replace('/signin?next=/me'); return; }
  H.mount({ tab: 'you' });
  const u = H.user();
  H.qs('#me-av').outerHTML = H.avatar(u, 72); H.qs('#me-name').textContent = u.name; H.qs('#me-handle').textContent = u.username; H.qs('#me-city').innerHTML = H.flag(u.country || 'NG') + ' ' + H.esc(u.city || '');
  H.qs('#pub').href = '/makers/' + u.username;
  const c = await API.followCounts(u.id); H.qs('#f1').dataset.countTo = c.followers; H.qs('#f2').dataset.countTo = c.following;
  const mp = await API.myProducts(); H.qs('#f3').dataset.countTo = mp.length; H.qs('#mp-n').textContent = mp.length || ''; M.countUp();
  const b = await API.bookmarks('product'); H.qs('#sv-n').textContent = b.length || '';
  const n = await API.unreadCount(); H.qs('#unread').textContent = n ? n + ' new' : '';
  if (API.isAdmin) H.qs('#admin-link').hidden = false;
  H.qs('[data-theme-toggle]').checked = document.documentElement.dataset.theme === 'dark';
})();
</script>
</body>
</html>
