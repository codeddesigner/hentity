<!doctype html>
<html lang="en">
<head>
<!--#head-->
<title>This link has expired · Hentity</title>
</head>
<body class="no-tabbar">
<div class="auth">
  <div data-brand></div>
  <main class="auth__side">
    <div data-mobilebar data-back="/signin"></div>
    <form class="auth__form" id="form" novalidate>
      <div class="icon-badge"><span data-icon="clock"></span></div>
      <div class="auth__heading">
        <h1 class="t-h2">This link has expired</h1>
        <p class="c-2">Verification links last 48 hours and reset links 1 hour. Each link works once, and only the newest one is valid.</p>
      </div>
      <div class="alert alert--success" id="sent" role="status" hidden>
        <span data-icon="check"></span>
        <div><p class="alert__title">New link sent</p><p class="alert__body">Use the newest email — older links stop working.</p></div>
      </div>
      <div class="field" id="f-email">
        <label class="field__label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit">Send a new link</button>
      <p class="auth__switch">Need help? <a href="mailto:support@hentity.com">Contact support</a></p>
    </form>
  </main>
</div>
<script src="/assets/auth.js"></script>
<script>
H.mount();
(function () {
  const { qs } = H; const type = H.params().get('type') === 'recovery' ? 'recovery' : 'signup';
  const pending = JSON.parse(sessionStorage.getItem('hentity.pending') || sessionStorage.getItem('hentity.resetEmail') && JSON.stringify({ email: sessionStorage.getItem('hentity.resetEmail') }) || '{}');
  qs('#email').value = pending.email || '';
  qs('#form').addEventListener('submit', async e => {
    e.preventDefault(); const email = e.target.email.value.trim();
    const ok = Auth.emailOk(email); qs('#f-email').classList.toggle('is-error', !ok); if (!ok) return;
    try { if (type === 'recovery') await API.auth.forgot(email); else await API.auth.resend(email, 'signup'); qs('#sent').hidden = false; qs('#sent').classList.add('reveal'); H.toast('New link sent'); }
    catch (ex) { H.toast(/rate/i.test(ex.message) ? 'Too many requests. Wait a minute and try again.' : ex.message, 'error'); }
  });
})();
</script>
</body>
</html>
