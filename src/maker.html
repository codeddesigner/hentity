<!doctype html>
<html lang="en">
<head>
<!--#head-->
<title>Maker · Hentity</title>
<style>
.cover{height:180px;background:#000;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;width:760px;height:760px;border-radius:50%;background:#e8560f;right:-260px;top:-20px}
.mk{max-width:1248px;margin:0 auto;padding:0 24px}
.mk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.mk-avatar{margin-top:-52px;position:relative;z-index:1;border:4px solid var(--color-bg-canvas)}
.mk-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--color-text-secondary)}
.mk-links{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;font-weight:500;color:var(--color-text-secondary)}
.mk-links a{display:inline-flex;align-items:center;gap:6px}
.mk-links a:hover{color:var(--color-text-primary)}
.mk-stats{display:flex;gap:28px;flex-wrap:wrap;font-size:13px;color:var(--color-text-secondary)}
.mk-stats b{font-size:18px;font-weight:600;color:var(--color-text-primary);margin-right:6px;letter-spacing:-0.01em}
.mk-body{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:64px;padding:28px 0 96px}
.mk-tabs{margin:28px -24px 0;padding:0 24px}
.medal{width:28px;height:28px;border-radius:50%;flex:none}
@media (max-width:1024px){.mk-body{grid-template-columns:1fr;gap:24px}}
@media (max-width:768px){.mk-tabs{margin:24px -16px 0;padding:0 16px}.cover{height:140px}.cover::after{width:420px;height:420px;right:-160px}.mk{padding:0 16px}.mk h1{font-size:30px!important;line-height:36px!important}.mk-head .row.gap-8{width:100%}.mk-head .row.gap-8 .btn{flex:1}}
</style>
</head>
<body>
<div data-header></div>
<div class="cover" aria-hidden="true"></div>
<main class="mk" id="mk"></main>
<div data-tabbar></div>
<script src="/assets/data.js"></script>
<script>
H.mount({ active: 'Community', tab: 'Profile' });
(function () {
  const { qs, qsa, icon, flag, esc, store, toast } = H;
  const handle = location.pathname.split('/').filter(Boolean)[1] || 'ada';
  const me = H.user();
  const isMe = handle === me.username || handle === 'ada';
  const person = isMe ? me : Object.assign({ username: handle, headline: 'Maker', bio: '', country: (D.PEOPLE[handle] || {}).cc || 'NG', website: '', x: '', linkedin: '' }, D.PEOPLE[handle] || { name: handle });
  document.title = person.name + ' (@' + person.username + ') · Hentity';
  const prods = isMe ? ['ledgerline', 'ledgerline-for-accountants', 'momo-parser'].map(D.bySlug) : D.P.filter(p => p.cc === person.cc).slice(0, 2);
  const fol = store.get('following', {});
  const followers = 1204 + (fol[handle] ? 1 : 0);
  qs('#mk').innerHTML = `
  <div class="mk-head">
    <div class="stack gap-12">
      ${H.avatar(person, 104, 'mk-avatar')}
      <div class="row gap-12 wrap"><h1 style="font-size:40px;line-height:46px;font-weight:600;letter-spacing:-0.03em">${esc(person.name)}</h1><span class="badge badge--success badge--pill" style="background:var(--color-bg-muted);color:var(--color-text-secondary)">${icon('check', 'ic-12 c-success')}Verified maker</span></div>
      <div class="mk-meta"><span>@${esc(person.username)}</span><span>·</span><span class="row gap-8">${flag(person.country || 'NG')}${esc(person.city || 'Lagos')}, ${H.COUNTRY[person.country] || 'Nigeria'}</span><span>·</span><span>${esc(person.headline || 'Maker')} · joined Mar 2024</span></div>
      ${person.bio ? `<p style="max-width:640px">${esc(person.bio)}</p>` : ''}
      <div class="mk-links">${person.website ? `<a href="${esc(/^https?:/.test(person.website) ? person.website : 'https://' + person.website)}" target="_blank" rel="noopener">${icon('globe', 'ic-14')}${esc(person.website.replace(/^https?:\/\//, ''))}</a>` : ''}${person.linkedin ? `<a href="https://${esc(person.linkedin.replace(/^https?:\/\//, ''))}" target="_blank" rel="noopener">${icon('link', 'ic-14')}${esc(person.linkedin)}</a>` : ''}${person.x ? `<a href="https://x.com/${esc(person.x)}" target="_blank" rel="noopener">${icon('link', 'ic-14')}x.com/${esc(person.x)}</a>` : ''}</div>
      <div class="mk-stats"><span><b id="fcount">${D.fmt(followers)}</b>followers</span><span><b>184</b>following</span><span><b>${prods.length}</b>products</span><span><b>412</b>upvotes given</span></div>
    </div>
    <div class="row gap-8">
      <button class="btn btn--ghost" type="button" id="share">${icon('share')}Share</button>
      ${isMe ? `<a class="btn btn--primary" href="/settings/profile">Edit profile</a>` : `<button class="btn btn--primary" type="button" id="follow"></button>`}
    </div>
  </div>
  <div class="tabs mk-tabs" role="tablist" id="tabs">
    ${[['products', 'Products · ' + prods.length], ['launches', 'Launches · 4'], ['upvoted', 'Upvoted · 412'], ['collections', 'Collections · 2'], ['activity', 'Activity']].map(([k, l], i) => `<button class="tab" role="tab" aria-selected="${i === 0}" data-tab="${k}">${l}</button>`).join('')}
  </div>
  <div class="mk-body">
    <div class="feed" id="panel"></div>
    <aside class="stack gap-16">
      <section class="card card--pad"><h2 class="t-label" style="margin-bottom:14px">Achievements</h2><div class="stack gap-16">
        <div class="row gap-12"><span class="medal" style="background:var(--award-gold)"></span><div><p class="t-label">#1 Product of the Week</p><p class="t-caption c-3" style="font-weight:400">Ledgerline · Week 47, 2026</p></div></div>
        <div class="row gap-12"><span class="medal" style="background:var(--color-accent-default)"></span><div><p class="t-label">Responsive maker</p><p class="t-caption c-3" style="font-weight:400">Replied to 94% of comments</p></div></div></div></section>
      <section class="card card--pad"><h2 class="t-label" style="margin-bottom:14px">Company</h2><div class="row gap-12"><span class="plogo plogo--32">L</span><div><p class="t-label">Ledgerline Technologies Ltd</p><p class="t-caption c-3" style="font-weight:400">Founder · Pre-seed · 6 people</p></div></div></section>
    </aside>
  </div>`;
  function panel(k) {
    const el = qs('#panel');
    if (k === 'products') el.innerHTML = prods.map(p => D.row(Object.assign({}, p, { rails: '' }), 0, { noRank: true }).replace('<span class="prow__rank" aria-hidden="true"></span>', '')).join('');
    else if (k === 'upvoted') el.innerHTML = D.board().filter(p => !p.promoted).slice(1, 5).map(p => D.row(p, 0, { noRank: true }).replace('<span class="prow__rank" aria-hidden="true"></span>', '')).join('');
    else if (k === 'launches') el.innerHTML = `<div class="stack gap-12">${[['Ledgerline', 'Week 47, 2026', '#1 · 1,106 upvotes'], ['MoMo Parser', 'Week 38, 2026', '#9 · 233 upvotes'], ['Ledgerline beta', 'Week 12, 2026', '#4 · 640 upvotes'], ['Ledgerline API', 'Week 2, 2026', '#12 · 188 upvotes']].map(([n, w, r]) => `<div class="card row gap-12" style="padding:14px 16px"><span class="icon-tile">${icon('calendar')}</span><div class="grow"><p class="t-label">${n}</p><p class="t-caption c-3" style="font-weight:400">${w}</p></div><span class="mono t-body-sm">${r}</span></div>`).join('')}</div>`;
    else if (k === 'collections') el.innerHTML = `<div class="grid-2">${[['Tools Lagos traders use', '#16a34a', 12], ['Fintech infra to watch', '#2563eb', 9]].map(([n, c, k]) => `<a class="card" href="/directory" style="overflow:hidden"><i style="display:block;height:64px;background:${c}"></i><div style="padding:14px"><p class="t-label">${n}</p><p class="t-caption c-3" style="font-weight:400;margin-top:4px">${k} products</p></div></a>`).join('')}</div>`;
    else el.innerHTML = `<ul class="stack gap-16" style="list-style:none;margin:0;padding:0">${[['Replied to Kwame on Ledgerline', '5h ago'], ['Upvoted Ward Health', 'yesterday'], ['Followed Farmcast', '2 days ago'], ['Commented on Swahili Speech Kit', '3 days ago']].map(([t, m]) => `<li class="row gap-12"><span class="icon-tile">${icon('comment')}</span><div><p class="t-body-sm">${t}</p><p class="t-caption c-3" style="font-weight:400">${m}</p></div></li>`).join('')}</ul>`;
  }
  qsa('#tabs [role=tab]').forEach(t => t.addEventListener('click', () => { qsa('#tabs [role=tab]').forEach(o => o.setAttribute('aria-selected', String(o === t))); panel(t.dataset.tab); }));
  panel(location.hash === '#collections' ? (qs('[data-tab=collections]').click(), 'collections') : 'products');
  qs('#share').addEventListener('click', async () => { try { if (navigator.share) await navigator.share({ title: person.name + ' on Hentity', url: location.href }); else { await navigator.clipboard.writeText(location.href); toast('Profile link copied'); } } catch (e) {} });
  const f = qs('#follow');
  if (f) { const set = () => { f.innerHTML = fol[handle] ? 'Following' : icon('plus') + 'Follow'; f.className = 'btn ' + (fol[handle] ? 'btn--secondary' : 'btn--primary'); qs('#fcount').textContent = D.fmt(1204 + (fol[handle] ? 1 : 0)); }; set(); f.addEventListener('click', () => { if (!H.session()) { location.href = '/signin?next=' + location.pathname; return; } fol[handle] = !fol[handle]; store.set('following', fol); set(); }); }
})();
</script>
</body>
</html>
