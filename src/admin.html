<!doctype html>
<html lang="en">
<head>
<!--#head-->
<title>Admin | Hentity</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body class="no-tabbar">
<div class="adm" id="adm">
  <nav class="adm-nav" id="nav" aria-label="Admin"></nav>
  <main class="adm-main" id="main"><div class="skel" style="height:120px"></div></main>
</div>
<script src="/assets/data.js"></script>
<script src="/assets/beta.js"></script>
<script>
H.mount();
(async function () {
  const { qs, qsa, esc, icon, toast, avatar } = H;
  await API.ready;
  if (!API.uid) { location.replace('/signin?next=/admin' + location.hash); return; }
  if (!API.isAdmin) { qs('#adm').innerHTML = `<main class="empty" style="grid-column:1/-1;margin:20vh auto;max-width:420px;text-align:center"><div class="icon-badge" style="margin:0 auto 12px">${icon('shield')}</div><h1 class="t-h3">Admins only</h1><p class="t-body-sm c-2" style="margin-top:6px">You’re signed in as ${esc(API.profile ? API.profile.email || API.profile.username : '')}. Ask an admin to give you access.</p><a class="btn btn--secondary btn--sm" style="margin-top:16px" href="/">Back to Hentity</a></main>`; return; }
  const isFullAdmin = API.profile.role === 'admin';
  const A = API.admin;

  // ---------------------------------------------------------------- shell
  const SECTIONS = [
    ['Overview', [['dashboard', 'Dashboard', 'bar-chart'], ['review', 'Review queue', 'eye', 'review'], ['edits', 'Edit requests', 'edit', 'edits'], ['broadcast', 'Broadcast', 'bell'], ['spotlights', 'Spotlights', 'sparkles']]],
    ['Product', [['products', 'Products', 'package'], ['weeks', 'Launch weeks', 'calendar'], ['betas', 'Beta tests', 'flask'], ['companies', 'Companies', 'globe'], ['funding', 'Funding', 'star'], ['users', 'Users', 'users'], ['admins', 'Admins', 'shield']]],
    ['Radar', [['radar', 'Radar', 'compass', 'radar'], ['claims', 'Claims', 'shield', 'claims'], ['removals', 'Removal requests', 'trash', 'removals']]],
    ['Community', [['findroles', 'Find roles', 'users', 'findroles'], ['reports', 'Reports', 'flag', 'reports_open'], ['roadmap', 'Hentity roadmap', 'star'], ['comments', 'Comments', 'comment'], ['messages', 'Messages', 'chats'], ['channels', 'Channels', 'hash']]],
    ['News', [['articles', 'Articles', 'newspaper'], ['suggestions', 'Story suggestions', 'sparkles', 'suggestions'], ['newsletter', 'Newsletter', 'mail']]],
    ['System', [['emails', 'Emails', 'mail'], ['features', 'Features', 'eye'], ['settings', 'Site settings', 'settings'], ['audit', 'Audit log', 'log']]]
  ];
  // Mini-admins (role 'moderator') have every admin power except member data (users, messages, newsletter, email logs) and managing admins (enforced in the database too)
  const FULL_ONLY = ['users', 'messages', 'newsletter', 'emails', 'admins', 'spotlights'];   // member data and admin management stay with the super admin
  if (!isFullAdmin) SECTIONS.forEach(s => { s[1] = s[1].filter(x => !FULL_ONLY.includes(x[0])); });
  const ROLE = { admin: 'Super admin', moderator: 'Mini-admin', user: 'Member' };
  let stats = {};
  function nav(cur) {
    qs('#nav').innerHTML = `<a href="/" style="margin-bottom:12px">${H.logo ? '' : ''}<span class="row gap-8">${icon('arrow-left', 'ic-14')}Back to site</span></a>
      <p class="t-eyebrow c-3" style="padding:4px 10px 12px">Hentity admin</p>` + SECTIONS.map(([g, items]) => `<p class="t-caption c-3" style="padding:14px 10px 6px;font-weight:400">${g}</p>` + items.map(([k, l, ic, n]) => `<a href="#${k}"${k === cur ? ' aria-current="page"' : ''}>${icon(ic, 'ic-16')}${l}${n && stats[n] ? `<span class="n">${stats[n]}</span>` : ''}</a>`).join('')).join('')
      + `<div class="sep" style="margin:16px 10px"></div><p class="row gap-8 t-caption c-3" style="padding:0 10px;font-weight:400">${avatar(API.profile, 20)}${esc(API.profile.name)} · ${ROLE[API.profile.role] || esc(API.profile.role)}</p>`;
  }
  const head = (title, sub, actions) => `<header class="row between wrap gap-12" style="margin-bottom:24px"><div><h1 class="t-h2">${title}</h1>${sub ? `<p class="t-body-sm c-2" style="margin-top:4px">${sub}</p>` : ''}</div><div class="row gap-8 wrap">${actions || ''}</div></header>`;
  const search = (id, ph) => `<label class="clist__search" style="margin:0;width:260px;max-width:100%"><span>${icon('search', 'ic-14')}</span><input id="${id}" placeholder="${ph}" aria-label="${ph}"></label>`;
  const badge = (s) => { const m = { live: 'success', scheduled: 'accent', review: 'warning', changes: 'warning', draft: '', rejected: 'danger', archived: '', open: 'warning', resolved: 'success', dismissed: '', new: 'accent', used: 'success', published: 'success', admin: 'accent', moderator: 'warning', user: '' }; return `<span class="badge ${m[s] ? 'badge--' + m[s] : ''}">${esc({ moderator: 'Mini-admin', admin: 'Super admin' }[s] || s)}</span>`; };
  const when = t => t ? `<span title="${new Date(t).toLocaleString()}">${H.ago(t)}</span>` : '<span class="c-3">—</span>';
  const tbl = (cols, rows, empty) => rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<div class="empty card" style="padding:40px;text-align:center"><p class="t-h4">${empty || 'Nothing here'}</p></div>`;
  const csv = (name, rows) => { if (!rows.length) return toast('Nothing to export'); const keys = Object.keys(rows[0]); const body = [keys.join(','), ...rows.map(r => keys.map(k => JSON.stringify(r[k] == null ? '' : typeof r[k] === 'object' ? JSON.stringify(r[k]) : r[k])).join(','))].join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/csv' })); a.download = name + '-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); };
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms || 250); }; };

  // ---------------------------------------------------------------- drawer form
  // fields: [key, label, type, opts]   type: text|textarea|number|bool|select|checks|list|json|datetime|color|image|readonly|heading
  function drawer(title, fields, values, onSave, extra) {
    qsa('.drawer,.drawer-bg').forEach(x => x.remove());
    const bg = document.createElement('div'); bg.className = 'drawer-bg'; bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:89;animation:fadein .2s';
    const d = document.createElement('aside'); d.className = 'drawer'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', title);
    const v = values || {};
    const field = ([k, l, t, o]) => {
      const val = v[k];
      if (t === 'heading') return `<p class="t-label" style="margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--color-border-default)">${esc(l)}${o ? ` <span class="t-caption c-3" style="font-weight:400">${esc(o)}</span>` : ''}</p>`;
      if (t === 'checks') return `<div class="field" style="margin-bottom:14px"><label class="field__label">${l}</label><div class="row wrap gap-8">${o.map(x => { const [ov, ol] = Array.isArray(x) ? x : [x, x]; return `<label class="chip" style="cursor:pointer"><input type="checkbox" name="${k}" value="${esc(ov)}"${(val || []).includes(ov) ? ' checked' : ''} style="margin-right:6px">${esc(ol)}</label>`; }).join('')}</div></div>`;
      if (t === 'bool') return `<label class="check" style="margin:4px 0 14px"><input type="checkbox" name="${k}"${val ? ' checked' : ''}><span class="check__box">${icon('check')}</span>${l}</label>`;
      let inp;
      if (t === 'textarea' || t === 'list' || t === 'json') inp = `<textarea class="input" name="${k}" rows="${t === 'json' ? 6 : (o && o.rows) || 4}" style="${t === 'json' ? 'font-family:var(--font-mono);font-size:12px' : ''}">${esc(t === 'list' ? (val || []).join('\n') : t === 'json' ? JSON.stringify(val == null ? (o && o.empty) || {} : val, null, 2) : val || '')}</textarea>`;
      else if (t === 'select') inp = `<select class="input" name="${k}">${o.map(x => { const [ov, ol] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(ov)}"${String(val) === String(ov) ? ' selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
      else if (t === 'readonly') inp = `<p class="t-body-sm" style="padding:8px 0">${val == null || val === '' ? '<span class="c-3">—</span>' : esc(typeof val === 'object' ? JSON.stringify(val) : val)}</p>`;
      else if (t === 'image') inp = `<div class="row gap-8"><img data-prev="${k}" src="${esc(val || '')}" alt="" style="width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--color-border-default);flex:none${val ? '' : ';display:none'}"><input class="input grow" name="${k}" value="${esc(val || '')}" placeholder="https:// or upload"><label class="btn btn--secondary btn--sm" style="cursor:pointer">${icon('upload')}<input type="file" accept="image/*" class="sr-only" data-up="${k}"></label></div>`;
      else inp = `<input class="input" name="${k}" type="${t === 'number' ? 'number' : t === 'date' ? 'date' : t === 'datetime' ? 'datetime-local' : t === 'color' ? 'text' : 'text'}" value="${esc(t === 'datetime' && val ? new Date(new Date(val) - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16) : val == null ? '' : val)}">`;
      return `<div class="field" style="margin-bottom:14px"><label class="field__label">${l}${t === 'list' ? ' <span class="c-3" style="font-weight:400">· one per line</span>' : ''}</label>${inp}</div>`;
    };
    d.innerHTML = `<div class="drawer__head"><p class="t-h4">${esc(title)}</p><button class="nav__icon" type="button" data-x aria-label="Close">${icon('x')}</button></div>
      <form class="drawer__body" id="dform">${extra && extra.top || ''}${fields.map(field).join('')}${extra && extra.bottom || ''}</form>
      <div class="drawer__foot">${extra && extra.danger ? `<button class="btn btn--ghost btn--sm" type="button" data-danger style="color:var(--color-danger);margin-right:auto">${icon('trash')}${extra.danger.label}</button>` : ''}<button class="btn btn--ghost btn--sm" type="button" data-x>Cancel</button>${onSave ? `<button class="btn btn--primary btn--sm" type="button" data-save>${extra && extra.saveLabel || 'Save'}</button>` : ''}</div>`;
    document.body.append(bg, d);
    const close = () => { d.remove(); bg.remove(); };
    bg.onclick = close; d.querySelectorAll('[data-x]').forEach(b => b.onclick = close);
    document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } });
    d.querySelectorAll('[data-prev]').forEach(pv => { const i = d.querySelector(`[name="${pv.dataset.prev}"]`); i && i.addEventListener('change', () => { pv.src = i.value; pv.style.display = i.value ? '' : 'none'; }); });
    d.querySelectorAll('[data-up]').forEach(inp => inp.addEventListener('change', async () => { const f = inp.files[0]; if (!f) return; try { toast('Uploading…'); const url = await API.upload(f, 'admin'); d.querySelector(`[name="${inp.dataset.up}"]`).value = url; const pv = d.querySelector(`[data-prev="${inp.dataset.up}"]`); if (pv) { pv.src = url; pv.style.display = ''; } toast('Uploaded'); } catch (e) { H.fail(e); } }));
    const collect = () => { const f = qs('#dform'); const out = {}; for (const [k, , t] of fields) { if (t === 'readonly' || t === 'heading') continue; if (t === 'checks') { out[k] = [...f.querySelectorAll(`input[name="${k}"]:checked`)].map(i => i.value); continue; } const el = f.elements[k]; if (!el) continue; if (t === 'bool') out[k] = el.checked; else if (t === 'number') out[k] = el.value === '' ? null : +el.value; else if (t === 'list') out[k] = el.value.split('\n').map(s => s.trim()).filter(Boolean); else if (t === 'json') { try { out[k] = JSON.parse(el.value || 'null'); } catch (e) { throw new Error(l(k) + ' is not valid JSON'); } } else if (t === 'datetime') out[k] = el.value ? new Date(el.value).toISOString() : null; else out[k] = el.value === '' ? null : el.value; } return out; };
    const l = k => (fields.find(f => f[0] === k) || [])[1] || k;
    const sv = d.querySelector('[data-save]');
    sv && (sv.onclick = async () => { sv.disabled = true; try { await onSave(collect(), d); close(); } catch (e) { H.fail(e); } finally { sv.disabled = false; } });
    const dg = d.querySelector('[data-danger]'); dg && (dg.onclick = async () => { if (!confirm(extra.danger.confirm)) return; try { await extra.danger.run(); close(); } catch (e) { H.fail(e); } });
    return d;
  }

  // ---------------------------------------------------------------- views
  const V = {};
  V.dashboard = async () => {
    stats = await A.stats(); nav('dashboard');
    const spark = (arr) => { const days = [...Array(14)].map((_, i) => { const d = new Date(Date.now() - (13 - i) * 864e5).toISOString().slice(0, 10); return (arr.find(x => x.d === d) || { n: 0 }).n; }); const m = Math.max(1, ...days); return `<div class="spark">${days.map((n, i) => `<i style="--i:${i};height:${Math.max(4, n / m * 100)}%" title="${n}"></i>`).join('')}</div>`; };
    const k = (l, v, href, sub) => `<a class="card kpi-card lift" href="${href || '#dashboard'}" style="padding:18px"><p class="t-caption c-3" style="font-weight:400">${l}</p><p class="t-h2 mono" data-count-to="${v || 0}" style="margin-top:6px">0</p>${sub ? `<p class="t-caption c-2" style="font-weight:400;margin-top:4px">${sub}</p>` : ''}</a>`;
    const [cw, recentAudit] = await Promise.all([API.currentWeek(), A.audit().then(r => r.slice(0, 6))]);
    qs('#main').innerHTML = head('Dashboard', cw ? `Week ${cw.id} · ${new Date(cw.starts_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} – ${new Date(cw.ends_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}` : 'No active launch week', `<a class="btn btn--primary btn--sm" href="#review">${icon('eye')}Review ${stats.review || 0} waiting</a>`)
      + `<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">${k('Live now', stats.live, '#products/live')}${k('In review', stats.review, '#review')}${k('Scheduled', stats.scheduled, '#products/scheduled')}${k('All products', stats.products, '#products')}${k('Members', stats.users, '#users', `+${stats.users_week || 0} this week`)}${k('Open reports', stats.reports_open, '#reports')}${k('Upvotes · 7d', stats.upvotes_week)}${k('Comments · 7d', stats.comments_week, '#comments')}${k('Messages · 7d', stats.messages_week, '#messages')}${k('Subscribers', stats.subscribers, '#newsletter')}${k('New story tips', stats.suggestions, '#suggestions')}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px">
        <section class="card" style="padding:18px"><p class="t-label">Sign-ups · last 14 days</p><div style="margin-top:14px">${spark(stats.signups_by_day || [])}</div></section>
        <section class="card" style="padding:18px"><p class="t-label">Upvotes · last 14 days</p><div style="margin-top:14px">${spark(stats.votes_by_day || [])}</div></section>
      </div>
      <section class="card" style="padding:18px;margin-top:12px"><div class="row between"><p class="t-label">Recent admin activity</p><a class="link" href="#audit">Audit log</a></div><div class="stack" style="margin-top:8px">${recentAudit.map(a => `<p class="t-body-sm row gap-8" style="padding:8px 0;border-bottom:1px solid var(--color-border-default)"><span class="mono t-caption c-3" style="width:80px;font-weight:400">${H.ago(a.created_at)}</span><b>${esc(a.actor ? a.actor.name : 'system')}</b><span class="c-2">${esc(a.action)}</span><span class="c-3 truncate">${esc(a.target_type || '')} ${esc(a.meta && (a.meta.name || a.meta.title) || '')}</span></p>`).join('') || '<p class="t-caption c-3" style="padding:10px 0">Nothing yet.</p>'}</div></section>`;
    M.countUp(qs('#main'));
  };

  // ---- review queue
  let weeksCache = null;
  async function weekOptions() {
    const [w, c] = await Promise.all([A.weeks(), A.weekCounts()]); const now = Date.now();
    weeksCache = w.filter(x => new Date(x.ends_at) > now).map(x => { const taken = c.filter(r => r.week_id === x.id && r.status !== 'review').length; return Object.assign(x, { taken }); });
    return weeksCache.map(x => [x.id, `Week ${x.id} · ${new Date(x.starts_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} · ${x.taken}/${x.capacity} booked`]);
  }
  V.review = async (id) => {
    const list = await A.products({ status: 'review' }); nav('review');
    qs('#main').innerHTML = head('Review queue', `${list.length} waiting · oldest first. Approve to schedule, request changes, or reject.`)
      + tbl(['Product', 'Maker', 'Requested day', 'Submitted', ''], list.sort((a, b) => new Date(a.submitted_at) - new Date(b.submitted_at)).map(p => `<tr><td><span class="row gap-10" style="gap:10px">${H.plogo(p, 32)}<span><b>${esc(p.name)}</b><br><span class="c-2">${esc(p.tagline)}</span></span></span></td><td>${p.owner ? esc(p.owner.name) + '<br><span class="c-3">' + '@' + esc(p.owner.username) + '</span>' : '—'}</td><td>${p.launch_date ? new Date(p.launch_date + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) : p.week_id ? 'Week ' + p.week_id : '—'}</td><td>${when(p.submitted_at)}</td><td style="text-align:right"><button class="btn btn--primary btn--sm" data-open="${p.id}">Review</button></td></tr>`), 'Inbox zero. Nothing waiting for review.');
    qs('#main').onclick = e => { const b = e.target.closest('[data-open]'); if (b) openReview(list.find(p => p.id === b.dataset.open)); };
    if (id) { const p = list.find(x => x.id === id) || (await A.products({ term: '' })).find(x => x.id === id); if (p) openReview(p); }
  };
  // The Verified stamp needs a company registration number (maker-entered, or on the linked company)
  async function regOf(p) { const own = p.verify && typeof p.verify.company === 'string' ? p.verify.company.trim() : ''; if (own) return own; if (!p.company_id) return ''; const cs = await A.companies().catch(() => []); const c = cs.find(x => x.id === p.company_id); return c && c.registration ? c.registration.trim() : ''; }
  function stampField(d, reg, regInputName) {
    const box = d.querySelector('[name=verified]'), lab = box.closest('label');
    lab.insertAdjacentHTML('afterend', '<p class="t-caption" data-stamp-hint style="font-weight:400;margin:-8px 0 14px 30px"></p>');
    const hint = d.querySelector('[data-stamp-hint]');
    const sync = () => { const r = regInputName ? d.querySelector(`[name=${regInputName}]`).value.trim() : reg; box.disabled = !r && !box.checked; hint.className = 't-caption ' + (r ? 'c-3' : 'c-danger'); hint.textContent = r ? 'Registration on file: ' + r + '. Check it (e.g. CAC search) before issuing the stamp.' : 'Needs a company registration number first. Add it above, or ask the maker for it.'; };
    if (regInputName) d.querySelector(`[name=${regInputName}]`).addEventListener('input', sync);
    sync();
  }
  async function openReview(p) {
    location.hash = 'review/' + p.id;
    const [weeks, makers, notifyN, ownerFull, reg] = await Promise.all([weekOptions(), A.makers(p.id), A.notifyRequests(p.id), p.owner && isFullAdmin ? A.users(null, [p.owner.id]).catch(() => []) : [], regOf(p)]); if (ownerFull[0]) p.owner = ownerFull[0];
    const media = (p.media || []).map(m => m.url ? `<img src="${esc(m.url)}" alt="" style="height:72px;border-radius:8px;border:1px solid var(--color-border-default)">` : `<span style="display:inline-block;width:110px;height:72px;border-radius:8px;background:${esc(m.color || '#eee')}"></span>`).join('');
    const top = `<div class="row gap-12" style="margin-bottom:16px">${H.plogo(p, 56)}<div><p class="t-h3">${esc(p.name)}</p><p class="t-body-sm c-2">${esc(p.tagline)}</p><p class="t-caption c-3" style="font-weight:400;margin-top:4px">${badge(p.status)} · ${esc((p.categories || []).join(', '))} · ${esc(p.country)} · <a class="link" href="/products/${p.slug}" target="_blank">preview</a></p></div></div>
      ${media ? `<div class="row gap-8" style="overflow-x:auto;margin-bottom:16px">${media}</div>` : '<p class="alert alert--warning" style="margin-bottom:16px">No media uploaded.</p>'}
      <dl class="t-body-sm" style="display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:0 0 18px">
        <dt class="c-3">Website</dt><dd style="margin:0">${p.website ? `<a class="link" href="${esc(p.website)}" target="_blank" rel="noopener">${esc(p.website)}</a>` : '<span class="c-danger">missing</span>'}</dd>
        <dt class="c-3">Owner</dt><dd style="margin:0">${p.owner ? esc(p.owner.name) + ' · ' + esc(p.owner.email || '') : '—'}</dd>
        <dt class="c-3">Makers</dt><dd style="margin:0">${makers.map(m => esc(m.user ? m.user.name : '?') + (m.accepted === false ? ' (invited)' : '')).join(', ') || '—'}</dd>
        <dt class="c-3">Pay methods</dt><dd style="margin:0">${esc((p.pay_methods || []).join(', ') || '—')}</dd>
        <dt class="c-3">Stage</dt><dd style="margin:0">${esc(p.stage || '—')}</dd>
        <dt class="c-3">Company reg.</dt><dd style="margin:0">${reg ? `<span class="mono">${esc(reg)}</span>` : '<span class="c-3">Not provided (optional) · can’t be verified</span>'}</dd>
        <dt class="c-3">Founder link</dt><dd style="margin:0">${p.verify && p.verify.founder ? `<a class="link" href="${esc(/^https?:/.test(p.verify.founder) ? p.verify.founder : 'https://' + p.verify.founder)}" target="_blank" rel="noopener">${esc(p.verify.founder)}</a>` : '<span class="c-3">—</span>'}</dd>
        <dt class="c-3">Notify list</dt><dd style="margin:0">${notifyN || 0} people</dd>
      </dl>
      <p class="t-eyebrow c-3">Description</p><p class="t-body-sm" style="white-space:pre-wrap;margin:6px 0 16px">${esc(p.description || '—')}</p>
      <p class="t-eyebrow c-3">Maker intro comment</p><p class="t-body-sm" style="white-space:pre-wrap;margin:6px 0 20px">${esc(p.intro || '—')}</p>
      <div class="sep" style="margin:0 0 18px"></div>
      <div class="chips" data-single id="decision" style="margin-bottom:16px">${[['scheduled', 'Approve & schedule'], ['changes', 'Request changes'], ['rejected', 'Reject'], ['live', 'Go live now']].map(([k, l], i) => `<button class="chip" type="button" data-chip data-d="${k}" aria-pressed="${i === 0}">${icon('check')}${l}</button>`).join('')}</div>`;

        <td style="width:28px"><input type="checkbox" data-sel="${o.id}"${sel.has(o.id) ? ' checked' : ''} aria-label="Select ${esc(o.name)}"></td>
        <td style="min-width:220px;max-width:340px"><button class="link" type="button" data-o="${o.id}" style="text-align:left"><b>${esc(o.name)}</b></button><br><span class="c-3 t-caption" style="font-weight:400">${esc(o.org && o.org !== o.name ? o.org : '')}${o.apply_url || o.website ? ` <a class="link" href="${esc(o.apply_url || o.website)}" target="_blank" rel="noopener">${esc((o.apply_url || o.website).replace(/^https?:\/\/(www\.)?/, '').slice(0, 40))}</a>` : ''}</span></td>
        <td>${o.mode === 'grant' ? 'Grant' : 'Equity'} · ${esc((KIND.find(k => k[0] === o.kind) || [, o.kind])[1])}</td>
        <td>${esc(o.amount_text || '—')}</td>
        <td style="max-width:160px">${o.deadline ? `<span style="white-space:nowrap">${esc(o.deadline)}</span>` : `<span class="c-3">${esc((o.round_note || 'Rolling').split('·')[0])}</span>`}</td>
        <td style="white-space:nowrap" class="${!o.checked_at || o.checked_at < stale ? '' : 'c-3'}" style="${!o.checked_at || o.checked_at < stale ? 'color:#B42318' : ''}">${o.checked_at ? esc(o.checked_at) : 'Never'}</td>
        <td class="mono">${c.saved || 0} · ${c.applied || 0}</td>
        <td><span class="badge ${s[1]}">${s[0]}</span></td>
        <td style="text-align:right;white-space:nowrap"><button class="btn btn--ghost btn--sm" type="button" data-chk="${o.id}" title="Mark details checked today">${icon('check')}Checked</button> <button class="btn btn--ghost btn--sm" type="button" data-vis="${o.id}">${o.active ? 'Hide' : 'Show'}</button> <button class="btn btn--secondary btn--sm" type="button" data-o="${o.id}">Edit</button></td></tr>`; };
    const subs = await A.fsubList('pending').catch(() => []);
    const tabs = cur => `<div class="tabs" role="tablist" style="margin:-8px 0 20px"><a class="tab" role="tab" href="#funding" aria-selected="${cur === 'list'}">Listings</a><a class="tab" role="tab" href="#funding/suggestions" aria-selected="${cur === 'subs'}">Suggestions${subs.length ? ` <span class="badge badge--accent" style="margin-left:4px">${subs.length}</span>` : ''}</a></div>`;
    const FLD = { name: 'Name', org: 'Organisation', mode: 'Board', kind: 'Type', apply_url: 'Apply link', website: 'Website', amount_text: 'Amount', deadline: 'Deadline', round_note: 'Round note', countries: 'Countries', categories: 'Categories', stages: 'Stages', description: 'Description', source_url: 'Source', women_only: 'Women-founded only' };
    const val = (v, k) => k === 'mode' ? ({ grant: 'Grants', equity: 'Equity (investors)' }[v] || v) : Array.isArray(v) ? v.join(', ') : typeof v === 'boolean' ? (v ? 'Yes' : 'No') : String(v);
    const link = v => /^https?:\/\//.test(v) ? `<a class="link" href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace(/^https?:\/\/(www\.)?/, '').slice(0, 60))}</a>` : esc(v);
    // Turn a member's suggestion into drawer values
    const toVals = d => { const x = Object.assign({}, d); if (typeof x.countries === 'string') x.countries = x.countries.split(/[\s,]+/).filter(Boolean).map(c => c.toUpperCase().slice(0, 2)); if (!x.kind) x.kind = x.mode === 'equity' ? 'vc' : 'grant'; x.checked_at = today; if (!x.source_url && x.apply_url) x.source_url = x.apply_url; return x; };
    const renderSubs = async () => {
      const all = await A.fsubList('all').catch(() => []);
      const pend = all.filter(x => x.status === 'pending'), done = all.filter(x => x.status !== 'pending').slice(0, 30);
      const card = x => { const d = x.data || {}, o = x.opp;
        return `<article class="card" style="padding:18px;margin-bottom:12px" data-sub="${x.id}">
          <div class="row between gap-12 wrap"><div class="row gap-10">${avatar(x.by, 32)}<div><p class="t-label">${x.kind === 'new' ? `New ${d.mode === 'equity' ? 'investor' : 'grant'}: ${esc(d.name || '')}` : `Fix for ${esc(o ? o.name : 'a listing')}`}</p>
            <p class="t-caption c-3" style="font-weight:400">@${esc(x.by.username)}${x.by.is_verified ? ' · verified' : ''} · ${x.by.approved ? x.by.approved + ' approved before' : 'first suggestion'} · ${when(x.created_at)}</p></div></div>
            ${x.status === 'pending' ? `<div class="row gap-8 wrap">${x.kind === 'new' ? `<button class="btn btn--primary btn--sm" data-add="${x.id}">${icon('check')}Review and add</button><button class="btn btn--secondary btn--sm" data-dup="${x.id}">Already listed</button>` : `<button class="btn btn--primary btn--sm" data-fix="${x.id}">${icon('edit')}Open and apply</button>`}<button class="btn btn--ghost btn--sm" data-rej="${x.id}">Reject</button></div>`
              : `<span class="badge ${x.status === 'approved' ? 'badge--success' : ''}">${esc(x.status)}</span>`}</div>
          ${x.note ? `<p class="t-body-sm" style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--color-bg-subtle);white-space:pre-wrap">${esc(x.note)}</p>` : ''}
          ${Object.keys(d).length ? `<div style="margin-top:12px">${Object.keys(FLD).filter(k => d[k] != null).map(k => `<div class="row gap-12 t-body-sm" style="padding:6px 0;border-top:1px solid var(--color-border-default)"><span class="c-3" style="width:140px;flex:none">${FLD[k]}</span><span style="min-width:0;word-break:break-word">${o && o[k] != null && val(o[k]) !== val(d[k]) ? `<s class="c-3">${esc(val(o[k]) || '—')}</s> → ` : ''}<b style="font-weight:500">${link(val(d[k], k))}</b></span></div>`).join('')}</div>` : ''}
          ${x.admin_note ? `<p class="t-caption c-3" style="font-weight:400;margin-top:8px">Note to member: ${esc(x.admin_note)}</p>` : ''}</article>`; };
      qs('#main').innerHTML = head('Funding', 'Grants and investors members shared. Nothing goes live until you approve it. Check the details on the funder’s own site first.') + tabs('subs')
        + (pend.length ? pend.map(card).join('') : `<div class="empty card" style="padding:40px;text-align:center"><p class="t-body-sm c-2">No suggestions waiting.</p></div>`)
        + (done.length ? `<h2 class="t-h4" style="margin:28px 0 12px">Decided</h2>` + done.map(card).join('') : '');
      qs('#main').onclick = async e => {
        const b = e.target.closest('[data-add],[data-dup],[data-fix],[data-rej]'); if (!b) return;
        const id = b.dataset, x = all.find(s => s.id === (id.add || id.dup || id.fix || id.rej)); if (!x) return;
        const decide = async (st, opp, note, msg) => { await A.fsubDecide(x.id, st, opp, note); toast(msg); qsa('.drawer,.drawer-bg').forEach(n => n.remove()); renderSubs(); };
        try {
          if (id.add) edit(null, Object.assign(toVals(x.data), { active: true }), saved => decide('approved', saved && saved.id, '', `Added. @${x.by.username} has been told and credited.`));
          if (id.fix) { const o = rows.find(r => r.id === x.opp_id); if (!o) return toast('That listing is gone', 'error'); const pre = toVals(x.data); delete pre.source_url; edit(o, pre, () => decide('approved', o.id, '', `Saved. @${x.by.username} has been thanked.`)); }
          if (id.dup) { if (!(await H.confirm(`Mark ${x.data.name} as already listed?`, { body: `@${x.by.username} is told someone shared it first.`, ok: 'Already listed' }))) return; await decide('duplicate', null, '', 'Marked as a duplicate'); }
          if (id.rej) { const why = await H.ask('Why not? (sent to the member)', { placeholder: 'e.g. It isn’t open to African startups', optional: true, ok: 'Reject' }); if (why == null) return; await decide('rejected', null, why, 'Rejected'); }
        } catch (er) { H.fail(er); }
      };
    };
    const render = () => {
      const L = list(), shown = L.slice(0, F.n);
      qs('#main').innerHTML = head('Funding', `${rows.length} listings · ${count(o => o.mode === 'grant')} grants · ${count(o => o.mode === 'equity')} investors. Founders apply on each funder’s own site, so keep links, dates and amounts checked against the official page.`, `<button class="btn btn--primary btn--sm" id="add">${icon('plus')}New opportunity</button>`)
        + tabs('list') + `<div class="row wrap gap-8" style="margin-bottom:12px">
            <input class="input" id="fq" type="search" placeholder="Search name, organisation, link…" value="${esc(F.q)}" style="max-width:280px">
            <select class="input" data-f="mode" style="width:auto">${opt('mode', [['', 'Grants and equity'], ['grant', 'Grants'], ['equity', 'Equity']])}</select>
            <select class="input" data-f="kind" style="width:auto">${opt('kind', [['', 'Any type'], ...KIND])}</select>
            <select class="input" data-f="st" style="width:auto">${opt('st', [['', 'Any state'], ['open', `Open (${count(o => state(o) === 'open')})`], ['rolling', `Rolling (${count(o => state(o) === 'rolling')})`], ['closed', `Between rounds (${count(o => state(o) === 'closed')})`], ['expired', `Deadline passed (${count(o => state(o) === 'expired')})`], ['hidden', `Hidden (${count(o => state(o) === 'hidden')})`], ['stale', `Not checked in 60 days (${count(o => !o.checked_at || o.checked_at < stale)})`]])}</select>
            <select class="input" data-f="sort" style="width:auto">${opt('sort', [['name', 'Sort: name'], ['deadline', 'Sort: deadline'], ['checked', 'Sort: oldest check'], ['updated', 'Sort: recently edited'], ['saved', 'Sort: most saved']])}</select>
            <span class="t-caption c-3" style="font-weight:400;margin-left:auto">${L.length} match${L.length === 1 ? '' : 'es'}</span></div>
          <div id="bulk" class="row wrap gap-8" style="margin-bottom:12px;${sel.size ? '' : 'display:none'}"><b class="t-body-sm">${sel.size} selected</b>
            <button class="btn btn--secondary btn--sm" type="button" data-bulk="checked">${icon('check')}Mark checked today</button>
            <button class="btn btn--secondary btn--sm" type="button" data-bulk="hide">Hide</button>
            <button class="btn btn--secondary btn--sm" type="button" data-bulk="show">Show</button>
            <button class="btn btn--secondary btn--sm" type="button" data-bulk="close">Close round…</button>
            <button class="btn btn--ghost btn--sm" type="button" data-bulk="clear">Clear</button></div>`
        + tbl(['<input type="checkbox" id="selall" aria-label="Select all shown">', 'Opportunity', 'Type', 'Amount', 'Deadline', 'Checked', 'Saved · applied', 'State', ''], shown.map(row), 'Nothing matches')
        + (L.length > shown.length ? `<div style="text-align:center;margin-top:14px"><button class="btn btn--secondary btn--sm" type="button" id="more">Show more <span class="c-3">${L.length - shown.length} left</span></button></div>` : '');
      const fq = qs('#fq'); fq.oninput = () => { F.q = fq.value; F.n = 50; const pos = fq.selectionStart; render(); const n = qs('#fq'); n.focus(); n.setSelectionRange(pos, pos); };
      qs('#add').onclick = () => edit(null);
    };
    const FIELDS = [
      ['', 'Basics', 'heading'], ['name', 'Name', 'text'], ['org', 'Organisation (who runs it)', 'text'], ['mode', 'Board', 'select', [['grant', 'Grants (non-dilutive)'], ['equity', 'Equity (investors)']]], ['kind', 'Type', 'select', KIND],
      ['description', 'Description', 'textarea', { rows: 4 }], ['color', 'Logo colour (hex)', 'color'], ['logo_url', 'Logo', 'image'],
      ['', 'Links', 'heading', 'Founders leave Hentity through these'], ['apply_url', 'Apply link (their application page)', 'text'], ['website', 'Website', 'text'], ['source_url', 'Source (where you checked the details)', 'text'],
      ['', 'Money', 'heading'], ['amount_text', 'Amount (as shown, e.g. “Up to $50,000”)', 'text'], ['amount_note', 'Amount note (e.g. “Non-dilutive · 12 weeks”)', 'text'], ['amount_usd', 'Amount in USD (used by the Amount filter)', 'number'], ['slots_text', 'Slots (e.g. “20 grants”)', 'text'],
      ['', 'Dates', 'heading', 'Leave the deadline empty for rolling or between rounds'], ['deadline', 'Deadline', 'date'], ['deadline_note', 'Deadline time (e.g. “23:59 WAT”)', 'text'], ['decision_by', 'Results due', 'date'], ['round_note', 'Round note when there’s no deadline (e.g. “2026 round closed 8 Sep · opens yearly in July”)', 'text'],
      ['', 'Who can apply', 'heading', 'Used for “meets X of Y” and Best match'], ['categories', 'Categories (none ticked = any)', 'checks', CATS], ['stages', 'Stages (none ticked = any)', 'checks', STAGES], ['countries', 'Country codes, e.g. NG, KE (empty = all of Africa)', 'list'], ['region_label', 'Region label (e.g. “West Africa”)', 'text'],
      ['women_only', 'Women-founded or mixed teams only', 'bool'], ['needs_incorporation', 'Must be incorporated', 'bool'], ['needs_live', 'Product must be live with users', 'bool'],
      ['judging', 'How it’s judged · [{"label":"Impact","pct":40}]', 'json', { empty: [] }],
      ['', 'Status', 'heading'], ['checked_at', 'Details checked on', 'date'], ['active', 'Show to founders', 'bool']];
    const TEXT = ['org', 'website', 'apply_url', 'amount_text', 'amount_note', 'region_label', 'slots_text', 'round_note', 'description', 'source_url', 'deadline_note', 'color'];
    // pre: values suggested by a member (prefilled); after: runs once saved (approves the suggestion)
    const edit = (o, pre, after) => drawer(o ? o.name : 'New opportunity', FIELDS, Object.assign({}, o || { mode: 'grant', kind: 'grant', active: true, judging: [], categories: [], stages: [], checked_at: today, color: '#111111' }, pre || {}), async (v, d) => {
      if (!v.name || v.name.trim().length < 2) throw new Error('Add a name');
      if (!v.apply_url && !v.website) throw new Error('Add the link where founders apply');
      for (const k of ['apply_url', 'website', 'source_url']) if (v[k] && !/^https?:\/\//i.test(v[k])) throw new Error(`${k === 'apply_url' ? 'Apply link' : k === 'website' ? 'Website' : 'Source'} must start with https://`);
      if (v.deadline && v.round_note && v.deadline >= today) v.round_note = '';   // an open date replaces the closed-round note
      if (['vc', 'micro_vc', 'angel'].includes(v.kind) && v.mode === 'grant') throw new Error('Investors belong on the Equity board');
      TEXT.forEach(k => { if (v[k] == null) v[k] = ''; });
      if (!v.color) v.color = '#111111';
      v.countries = (v.countries || []).map(x => x.toUpperCase().slice(0, 2)); v.judging = v.judging || [];
      const saved = await A.saveFundingOpp(o && o.id, v);
      if (o) { Object.assign(o, saved || v); } else if (saved) rows.unshift(saved);
      if (after) { await after(saved || o); return; }
      toast(o ? 'Saved' : 'Added');
      render();
    }, { top: o ? `<p class="t-caption c-3" style="font-weight:400;margin-bottom:6px">Last edited ${o.updated_at ? esc(new Date(o.updated_at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })) : '—'} · ${(cnt[o.id] || {}).saved || 0} saved · ${(cnt[o.id] || {}).applied || 0} applied · <a class="link" href="/funding/${o.id}" target="_blank">View as founder</a></p>` : '',
      danger: o ? { label: 'Delete', confirm: `Delete ${o.name}? Founders who saved it lose it from their tracker. Hiding keeps their history.`, run: async () => { await A.deleteFundingOpp(o.id); rows.splice(rows.indexOf(o), 1); toast('Deleted'); render(); } } : null });
    const patch = async (ids, p, msg) => { try { await Promise.all(ids.map(id => A.saveFundingOpp(id, p))); ids.forEach(id => Object.assign(rows.find(r => r.id === id), p)); toast(msg); render(); } catch (e) { H.fail(e); } };
    qs('#main').onclick = async e => {
      const t = e.target;
      if (t.closest('#more')) { F.n += 50; render(); return; }
      const b = t.closest('[data-o]'); if (b) { edit(rows.find(x => x.id === b.dataset.o)); return; }
      const c = t.closest('[data-chk]'); if (c) { patch([c.dataset.chk], { checked_at: today }, 'Marked checked today'); return; }
      const v = t.closest('[data-vis]'); if (v) { const o = rows.find(x => x.id === v.dataset.vis); patch([o.id], { active: !o.active }, o.active ? 'Hidden from founders' : 'Showing to founders'); return; }
      const bk = t.closest('[data-bulk]'); if (bk) {
        const ids = [...sel], k = bk.dataset.bulk;
        if (k === 'clear') { sel.clear(); render(); return; }
        if (k === 'checked') await patch(ids, { checked_at: today }, `${ids.length} marked checked`);
        if (k === 'hide') await patch(ids, { active: false }, `${ids.length} hidden`);
        if (k === 'show') await patch(ids, { active: true }, `${ids.length} showing`);
        if (k === 'close') { const note = prompt('Round note to show (the deadline will be cleared):', `${today.slice(0, 4)} round closed · check their site for the next one`); if (note == null) return; await patch(ids, { deadline: null, round_note: note }, `${ids.length} moved to between rounds`); }
        sel.clear(); render(); return;
      }
    };
    qs('#main').onchange = e => {
      const f = e.target.dataset.f; if (f) { F[f] = e.target.value; F.n = 50; render(); return; }
      if (e.target.id === 'selall') { list().slice(0, F.n).forEach(o => e.target.checked ? sel.add(o.id) : sel.delete(o.id)); render(); return; }
      const s = e.target.dataset.sel; if (s) { e.target.checked ? sel.add(s) : sel.delete(s); const bar = qs('#bulk'); bar.style.display = sel.size ? '' : 'none'; bar.querySelector('b').textContent = sel.size + ' selected'; }
    };
    if (arg === 'suggestions') { await renderSubs(); return; }
    render();
    if (arg) { const o = rows.find(x => x.id === arg); if (o) edit(o); else if (arg === 'new') edit(null); }
  };

  // ---------------------------------------------------------------- router
  async function route() {
    const [k, arg] = (location.hash.slice(1) || 'dashboard').split('/');
    if (!V[k] || (!isFullAdmin && FULL_ONLY.includes(k))) { location.hash = 'dashboard'; return; }
    if (k === 'review' && arg && qs('.drawer:not(.is-closing)')) return; // drawer already open
    qsa('.drawer,.drawer-bg').forEach(x => x.remove());
    qs('#main').innerHTML = '<div class="skel" style="height:40px;width:240px;margin-bottom:24px"></div><div class="skel" style="height:320px"></div>';
    try { await V[k](arg); qs('#main').classList.remove('reveal'); void qs('#main').offsetWidth; qs('#main').classList.add('reveal'); } catch (e) { H.fail(e); qs('#main').innerHTML = `<div class="alert alert--error">${icon('alert-circle')}<div><p class="alert__title">Couldn’t load ${esc(k)}</p><p class="alert__body">${esc(e.message)}</p></div></div>`; }
    document.title = (SECTIONS.flatMap(s => s[1]).find(s => s[0] === k) || [, 'Admin'])[1] + ' | Admin | Hentity';
  }
  window.addEventListener('hashchange', route);
  try { stats = await A.stats(); } catch (e) {}
  nav((location.hash.slice(1) || 'dashboard').split('/')[0]);
  route();
  // Live: new submissions and reports bump the counters
  API.live('adm-p', 'products', null, async ({ new: n, old }) => { if (n && n.status === 'review' && (!old || old.status !== 'review')) { toast(`New submission: ${n.name}`); stats = await A.stats(); nav((location.hash.slice(1) || 'dashboard').split('/')[0]); } });
})();
</script>
</body>
