<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<script src="/assets/app.js"></script>
<title>Choose a new password · Hentity</title>
</head>
<body class="no-tabbar">
<div class="auth">
  <div data-brand></div>
  <main class="auth__side">
    <div data-mobilebar data-back="/signin"></div>
    <form class="auth__form" id="form" novalidate>
      <div class="icon-badge"><span data-icon="lock"></span></div>
      <div class="auth__heading">
        <h1 class="t-h2">Choose a new password</h1>
        <p class="c-2">For <span id="who">ada@ledgerline.app</span>. You’ll be signed out on other devices.</p>
      </div>
      <div class="field">
        <label class="field__label" for="pw">New password</label>
        <div class="input-group"><input class="input" id="pw" type="password" autocomplete="new-password" required><button class="input-group__btn" type="button" data-reveal aria-label="Show password"></button></div>
      </div>
      <div class="field">
        <label class="field__label" for="pw2">Confirm password</label>
        <div class="input-group"><input class="input" id="pw2" type="password" autocomplete="new-password" required><button class="input-group__btn" type="button" data-reveal aria-label="Show password"></button></div>
      </div>
      <ul class="reqs" aria-live="polite" style="list-style:none;margin:0">
        <li class="req" data-req="len"><span data-icon="check"></span>At least 10 characters</li>
        <li class="req" data-req="recent"><span data-icon="check"></span>Not one of your recent passwords</li>
        <li class="req" data-req="match"><span data-icon="check"></span>Passwords match</li>
      </ul>
      <button class="btn btn--primary btn--block" type="submit" id="submit" disabled>Update password</button>
    </form>
  </main>
</div>
<script src="/assets/auth.js"></script>
<script>
H.mount();
(function () {
  const { qs, qsa, store } = H; const form = qs('#form');
  const email = store.get('resetEmail', 'ada@ledgerline.app'); qs('#who').textContent = email;
  const recent = ['hentity2026', 'password123', 'ledgerline1'];
  function check() {
    const a = qs('#pw').value, b = qs('#pw2').value;
    const r = { len: a.length >= 10, recent: a.length > 0 && !recent.includes(a), match: a.length > 0 && a === b };
    qsa('[data-req]').forEach(el => el.classList.toggle('is-met', r[el.dataset.req]));
    qs('#submit').disabled = !(r.len && r.recent && r.match);
  }
  form.addEventListener('input', check);
  form.addEventListener('submit', e => {
    e.preventDefault(); if (qs('#submit').disabled) return;
    const accts = Auth.accounts(); const key = email.toLowerCase();
    accts[key] = Object.assign({ name: 'Ada Okafor', username: 'ada' }, accts[key] || {}, { password: qs('#pw').value });
    store.set('accounts', accts); Auth.startSession(key);
    H.toast('Password updated'); setTimeout(() => location.href = '/', 600);
  });
})();
</script>
</body>
</html>
