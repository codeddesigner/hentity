/* Boot guard: hide the plain server-rendered copy while the app starts, report scripts that fail to load or run,
   and if the app never starts, reload once and then fall back to the readable server copy. */

  function log(m, s) { if (n++ > 3) return; try { fetch('https://sislzikhjapilksictxd.supabase.co/rest/v1/client_errors', { method: 'POST', keepalive: true, headers: { apikey: 'sb_publishable_49iWYS0Wr9kVY_PfDQphww_jj9dRaBz', 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ path: location.pathname.slice(0, 300), msg: String(m).slice(0, 600), src: String(s || '').slice(0, 400), ua: navigator.userAgent.slice(0, 300) }) }).catch(function () {}); } catch (e) {} }
  window.addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) log('failed to load', t.src || t.href); else if (e.message) log(e.message, (e.filename || '') + ':' + (e.lineno || '')); }, true);
  // A page that fails while loading its data shows the readable server copy instead of a blank screen
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason || {}; log('unhandled: ' + (r.message || r), (r.stack || '').split('\n')[1] || ''); if (!(window.performance && performance.getEntriesByName('hentity:content').length)) d.classList.remove('js-boot'); });
  function check() { if (window.H && window.API) return; d.classList.remove('js-boot'); log('app did not start: H=' + !!window.H + ' API=' + !!window.API + ' supabase=' + !!window.supabase, '');
    try { if (!sessionStorage.getItem('h-reload')) { sessionStorage.setItem('h-reload', '1'); location.reload(); } } catch (e) {} }
  window.addEventListener('load', function () { setTimeout(check, 1500); });
  setTimeout(function () { if (d.classList.contains('js-boot') && document.querySelector('[data-ssr]')) log('content not shown after 5s', 'ready=' + !!(window.performance && performance.getEntriesByName('hentity:ready').length)); d.classList.remove('js-boot'); check(); }, 5000);
})();

<style>
.fr{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.fr h1{font-size:44px;line-height:50px;font-weight:600;letter-spacing:-.03em;margin:16px 0 14px}
.fr .blk{padding:24px}.fr .blk h2{font-size:20px;line-height:26px;font-weight:600;margin-bottom:10px}
.fr .blk>p{font-size:15px;line-height:24px;color:var(--color-text-secondary);white-space:pre-line}
.fr-panel{position:sticky;top:20px;padding:24px}
.fr-sees{padding:14px;border-radius:12px;background:var(--color-bg-subtle);margin-top:16px}
.fr-panel .t-h3{font-size:20px;line-height:26px}
.fr-bar,.fr-bg,.fr-grab,.fr-x{display:none}
@media (max-width:1024px){.fr{grid-template-columns:minmax(0,1fr)}.fr-panel{position:static}}
@media (max-width:768px){
  .fr-panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:91;max-height:88dvh;overflow:auto;border-radius:20px 20px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -8px 32px rgba(0,0,0,.12)}
  .fr-panel.is-open{transform:none}
  .fr-grab{display:block;width:36px;height:4px;border-radius:2px;background:var(--color-border-strong);margin:0 auto 14px}
  .fr-x{display:grid!important;position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;place-items:center;color:var(--color-text-secondary)}
  .fr-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90}
  .fr-bg.is-open{display:block}
  .fr-bar{display:flex;position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:60;padding:10px 16px;background:var(--color-bg-canvas);border-top:1px solid var(--color-border-default);gap:10px;align-items:center}

<meta property="og:title" content="Open role | Find | Hentity">
<meta property="og:description" content="An open role at an African startup on Hentity Find. Say you&#x27;re interested; names reveal only when you both say yes.">
<meta property="og:url" content="https://hentity.com/find-role">
<meta property="og:type" content="website">
<meta property="og:image" content="https://hentity.com/og.png?v=5f906702f6">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<meta name="twitter:title" content="Open role | Find | Hentity">
<meta name="twitter:description" content="An open role at an African startup on Hentity Find. Say you&#x27;re interested; names reveal only when you both say yes.">
<meta name="twitter:image" content="https://hentity.com/og.png?v=5f906702f6">
</head>
<body>
<div data-header></div>
<main id="main"><div class="fd"><div class="skel" style="height:420px;border-radius:16px"></div></div></main>
<div data-tabbar></div>
<script src="/assets/find.js?v=d10823b698"></script>
<script>
H.mount({ active: 'find', tab: 'chats' });
(async function () {
  const { qs, esc, icon, toast } = H;
  const root = qs('#main');
  const id = location.pathname.split('/').filter(Boolean)[2];
  await API.ready;
  const r = id ? await API.findRole(id).catch(() => null) : null;
  if (!r) { root.innerHTML = `<div class="fd" style="text-align:center;padding-top:96px"><h1 class="t-h2">This role isn’t available</h1><p class="c-2" style="margin:8px 0 20px">It may be closed, invite-only, or the link is wrong.</p><a class="btn btn--secondary" href="/find">Back to Find</a></div>`; H.contentShown(); return; }
  document.title = `${r.title} | Find | Hentity`;
  const s = r.startup || {}, k = F.KIND[r.kind] || F.KIND.cofounder, pName = r.stealth ? 'The founder' : (r.poster.name || '').split(' ')[0];
  const me = r.me, job = r.kind !== 'cofounder';
  const tags = [F.catPill(r.category), F.pill(esc(F.pay(r)), 'k-pay'), r.vesting ? F.pill(esc(r.vesting)) : '', F.pill(k[0], k[1]), r.kind === 'cofounder' ? F.pill(F.COMMIT[r.commitment]) : r.duration ? F.pill(esc(r.duration)) : '', r.city ? F.pill(icon('pin', 'ic-12') + esc([r.city, F.WORK[r.working]].join(' · '))) : ''].filter(Boolean).join('');
  const blk = (t, body) => body ? `<section class="card blk">${t ? `<h2>${t}</h2>` : ''}<p>${esc(body)}</p></section>` : '';
  root.innerHTML = `<div class="fd">
    <a class="row gap-6 t-body-sm c-2" href="/find" style="margin-bottom:18px">${icon('arrow-left', 'ic-14')}Open roles</a>
    <div class="fr"><div class="stack gap-16">
      <section class="card blk"><div class="row between gap-12" style="align-items:flex-start"><div class="row gap-12" style="min-width:0">${F.startupMark(r, 48)}<div style="min-width:0"><p class="row gap-6 t-body-sm" style="font-weight:500">${esc(s.name)}${s.verified && !r.stealth ? H.verified('ic-14') : ''}</p><p class="t-caption c-3" style="font-weight:400">${esc([s.line, r.stage].filter(Boolean).join(' · ') || (r.stealth ? 'Startup name hidden until you both say yes' : ''))}</p></div></div>${s.slug ? `<a class="t-body-sm" style="font-weight:500" href="/products/${esc(s.slug)}">View product</a>` : ''}</div>
        <h1>${esc(r.title)}</h1><div class="fpills">${tags}</div>
        ${(r.skills || []).length ? `<div class="fskills">${r.skills.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}</section>
      ${blk(job ? 'What you’ll do' : 'What you’ll own', r.owns)}
      ${r.traction ? blk('Where we are', r.traction) : r.traction_hidden ? `<section class="card blk"><h2>Where we are</h2><p class="row gap-8">${icon('lock', 'ic-14')}Traction details are shared when you both say yes.</p></section>` : ''}
      ${blk(job ? 'You’ll do well if' : 'Who we’re looking for', r.looking_for)}
      ${(r.team || []).length ? `<section class="card blk"><h2>The founders</h2><div class="f2" style="margin-top:8px">${r.team.map(m => `<a class="row gap-12" href="/makers/${esc(m.username)}">${F.mini(m.name, m.avatar_url)}<span><span class="t-body-sm" style="font-weight:500;display:block">${esc(m.name)}</span><span class="t-caption c-3" style="font-weight:400">${esc([m.role, m.headline].filter(Boolean).join(' · '))}</span></span></a>`).join('')}</div></section>` : ''}
    </div>
    <aside class="card fr-panel" id="panel" aria-label="${job ? 'Apply' : 'Say you’re interested'}"></aside></div></div>`;
  // Mobile: the panel is a sheet over the role, opened from a bar at the bottom (Figma 26.16)
  const bg = document.createElement('div'); bg.className = 'fr-bg'; document.body.append(bg);
  const bar = document.createElement('div'); bar.className = 'fr-bar'; document.body.append(bar);
  const sheet = open => { qs('#panel').classList.toggle('is-open', open); bg.classList.toggle('is-open', open); document.body.style.overflow = open && matchMedia('(max-width:768px)').matches ? 'hidden' : ''; };
  bg.onclick = () => sheet(false);
  qs('#panel').addEventListener('click', e => { if (e.target.closest('[data-close-sheet]')) sheet(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') sheet(false); });
  bar.addEventListener('click', e => { if (e.target.closest('[data-sheet]')) sheet(true); });
  panel(); H.contentShown();

  function panel() {
    const box = qs('#panel'), grab = `<span class="fr-grab" aria-hidden="true"></span><button class="fr-x" type="button" data-close-sheet aria-label="Close">${icon('x', 'ic-18')}</button>`;
    const verb = job ? 'Apply' : 'Say you’re interested';
    bar.innerHTML = `<div class="grow" style="min-width:0"><p class="t-body-sm truncate" style="font-weight:500">${esc(r.title)}</p><p class="t-caption c-3 truncate" style="font-weight:400">${esc([s.name, k[0], r.city].filter(Boolean).join(' · '))}</p></div><button class="btn btn--accent" type="button" data-sheet>${r.mine ? 'Your role' : r.my_interest ? (r.my_interest.status === 'accepted' ? 'Matched' : 'Sent') : verb}</button>`;
    if (r.mine && ['review', 'rejected', 'draft'].includes(r.status)) {
      box.innerHTML = grab + (r.status === 'review' ? `<span class="fpill">${icon('clock', 'ic-12')}In review</span><h2 class="t-h3" style="margin-top:10px">Waiting for approval</h2><p class="t-body-sm c-2" style="margin:8px 0 16px">Hentity checks roles from startups without a verified product before they go on the board, usually within a day. We’ll notify you.</p>`
        : r.status === 'rejected' ? `<span class="fpill" style="color:var(--color-danger)">Not approved</span><h2 class="t-h3" style="margin-top:10px">Needs changes</h2><p class="t-body-sm c-2" style="margin:8px 0 16px" id="rnote">Edit the role and send it again.</p>`
        : `<span class="fpill">Draft</span><h2 class="t-h3" style="margin-top:10px">Not posted yet</h2><p class="t-body-sm c-2" style="margin:8px 0 16px">Only you can see this.</p>`) + `<a class="btn btn--primary btn--block" href="/find/post?edit=${r.id}">Edit role</a>`;
      if (r.status === 'rejected') API.myFindRole(r.id).then(x => { if (x && x.review_note) qs('#rnote').textContent = x.review_note; }).catch(() => {});
      return;
    }
    if (r.mine) { box.innerHTML = grab + `<h2 class="t-h3">Your role</h2><p class="t-body-sm c-2" style="margin:8px 0 16px">${r.interest_count} ${job ? 'applied' : 'interested'} so far. Answer them in My matches.</p><div class="stack gap-8"><a class="btn btn--primary btn--block" href="/find/matches">My matches</a><a class="btn btn--secondary btn--block" href="/find/post?edit=${r.id}">Edit role</a></div>`; return; }
    if (r.my_interest) {
      const mi = r.my_interest, done = mi.status === 'accepted';
      box.innerHTML = grab + `<h2 class="t-h3">${done ? 'It’s a match' : mi.mine ? (job ? 'Application sent' : 'Interest sent') : `${esc(pName)} invited you`}</h2><p class="t-body-sm c-2" style="margin:8px 0 16px">${done ? 'You both said yes.' : mi.mine ? `${esc(pName)} ${job ? 'has your application' : 'gets your intro'}. If they say yes too, you’ll both see each other and a chat opens.` : 'Answer in My matches.'}</p>${r.match_id ? `<a class="btn btn--primary btn--block" href="/find/m/${r.match_id}">Open match</a>` : `<div class="stack gap-8"><a class="btn btn--secondary btn--block" href="/find/matches">My matches</a>${mi.mine && mi.status === 'pending' && mi.id ? `<button class="btn btn--ghost btn--block" type="button" id="wd">Withdraw</button>` : ''}</div>`}`;
      const wd = qs('#wd'); wd && (wd.onclick = async () => { if (!confirm(job ? 'Withdraw your application?' : 'Withdraw your interest?')) return; try { await API.findWithdraw(mi.id); r.my_interest = null; r.interest_count = Math.max(0, r.interest_count - 1); toast('Withdrawn'); panel(); } catch (e) { H.fail(e); } });
      return;
    }
    if (!API.uid) { box.innerHTML = grab + `<h2 class="t-h3">${verb}</h2><p class="t-body-sm c-2" style="margin:8px 0 16px">Sign in to ${job ? 'apply' : 'send a short intro'}. ${job ? `This role asks for ${{ cv: 'your CV', linkedin: 'your LinkedIn profile', both: 'your CV and LinkedIn profile', either: 'your CV or LinkedIn profile' }[r.apply_with || 'either']}.` : 'Your name stays hidden until you both say yes.'}</p><a class="btn btn--accent btn--block" href="/signin?next=${encodeURIComponent(location.pathname)}">Sign in</a>`; return; }
    const qsHtml = (r.questions || []).map((qq, i) => `<label class="field"><span class="field__label">${esc(qq)}</span><input class="input" name="a${i}" maxlength="400"></label>`).join('');
    const warn = r.verified_only && !(API.profile && API.profile.is_verified) ? `<p class="alert alert--warning" style="padding:10px 12px">This role only takes replies from verified members.</p>` : '';
    const foot = `<p class="t-caption c-3" style="font-weight:400;text-align:center">${r.interest_count ? `${r.interest_count} ${r.interest_count === 1 ? 'person' : 'people'} ${job ? 'applied' : 'interested'} · ` : ''}${r.intros_left} of 5 intros left this week</p>`;
    if (job) {
      const need = r.apply_with || 'either', sends = { cv: 'your CV', linkedin: 'your LinkedIn', both: 'your CV and LinkedIn', either: 'your CV and LinkedIn' }[need];
      const pre = !!((need !== 'linkedin' && r.my_cv) || (need !== 'cv' && r.my_linkedin));
      const pub = r.visibility === 'public';
      box.innerHTML = grab + `<div class="row gap-12" style="margin-bottom:16px">${F.startupMark(r, 36)}<div style="min-width:0"><h2 class="t-h3">Apply for ${esc(r.title)}</h2><p class="t-caption c-3" style="font-weight:400">${esc([s.name, k[0], r.city].filter(Boolean).join(' · '))}</p></div></div>
        <form id="fi" class="stack gap-14">${pre ? `<p class="fprefill">${icon('sparkles', 'ic-14')}Filled from your Find profile. Check and send.</p>` : ''}
        ${need !== 'linkedin' ? `<div class="field"><span class="field__label">CV${need === 'either' ? ' <span class="c-3" style="font-weight:400">(or LinkedIn)</span>' : ''}</span><div id="cvbox"></div></div>` : ''}
        ${need !== 'cv' ? `<div class="field"><label class="field__label" for="li">LinkedIn profile${need === 'either' ? ' <span class="c-3" style="font-weight:400">(or CV)</span>' : ''}</label>${F.liField('li', r.my_linkedin)}</div>` : ''}
        <label class="field"><span class="field__label">Short note <span class="c-3" style="font-weight:400">(optional)</span></span><textarea class="input" name="intro" rows="3" maxlength="800" placeholder="What you’ve done that fits this role"></textarea></label>
        ${qsHtml}
        <p class="fnote-box">${icon('lock', 'ic-14')}<span>${pub ? `${esc(s.name || 'This startup')} posted this role publicly, so ${sends} ${need === 'cv' || need === 'linkedin' ? 'goes' : 'go'} with the application.` : `This role is in stealth, so ${sends} ${need === 'cv' || need === 'linkedin' ? 'is' : 'are'} only shared once you both say yes.`} You can withdraw any time.</span></p>
        ${warn}<button class="btn btn--accent btn--lg btn--block" type="submit">${icon('send')}Send application</button>${foot}</form>`;
      const cvp = qs('#cvbox') ? F.cvPicker(qs('#cvbox'), { cv: r.my_cv, profileCv: r.my_cv, sub: 'from your profile', allowOther: true }) : { get: () => null }; qs('#li') && F.bindLi(box, 'li');
      qs('#fi').onsubmit = async e => {
        e.preventDefault(); const fd = new FormData(e.target), b = e.target.querySelector('[type=submit]'), li = qs('#li') ? qs('#li').value.trim() : '';
        if (!F.liOk(li)) return toast('Use a LinkedIn profile link, like linkedin.com/in/your-name', 'error');
        if (['cv', 'both'].includes(need) && !cvp.get()) return toast('This role asks for your CV', 'error');
        if (['linkedin', 'both'].includes(need) && !li) return toast('This role asks for your LinkedIn profile', 'error');
        if (need === 'either' && !cvp.get() && !li) return toast('Add your CV or LinkedIn profile', 'error');
        b.disabled = true;
        try { const x = await API.findExpress(r.id, String(fd.get('intro') || ''), (r.questions || []).map((_, i) => String(fd.get('a' + i) || '')), cvp.get(), li); r.my_interest = { id: x.id, status: 'pending', mine: true }; r.interest_count++; r.intros_left = x.intros_left; toast('Application sent. We’ll tell you when they answer.'); panel(); }
        catch (err) { H.fail(err); b.disabled = false; }
      };
      return;
    }
    const sees = me ? `<div class="row gap-10" style="margin-top:8px">${me.stealth ? `<span class="flock" style="width:32px;height:32px">${icon('lock', 'ic-14')}</span>` : F.mini(me.name, me.avatar_url)}<div><p class="t-body-sm" style="font-weight:500">${esc(me.stealth ? [me.what, me.experience].filter(Boolean).join(' · ') || 'Your skills' : me.name)}</p><p class="t-caption c-3" style="font-weight:400">${esc([me.city, me.stealth ? 'stealth' : ''].filter(Boolean).join(' · '))}</p></div></div><p class="t-caption c-3" style="font-weight:400;margin-top:8px">${me.stealth ? 'Your name, photo and employer stay hidden until you both say yes.' : 'Your profile is visible. Switch to stealth in Privacy settings.'}</p>`
      : `<p class="t-caption c-2" style="font-weight:400;margin-top:6px">Your name and photo, plus your intro. <a class="link link--accent" href="/find/open">Set up a stealth profile</a> to show only your skills.</p>`;
    box.innerHTML = grab + `<h2 class="t-h3">Say you’re interested</h2><p class="t-body-sm c-2" style="margin:8px 0 16px">${esc(pName)} gets a short intro. If they say yes too, you’ll both see each other and a chat opens.</p>
      <form id="fi" class="stack gap-14"><label class="field"><span class="field__label">Your intro</span><textarea class="input" name="intro" rows="4" maxlength="800" required placeholder="What you’ve built, why this role, when you could start"></textarea></label>
      ${qsHtml}
      <div class="fr-sees"><p class="row gap-6 t-body-sm" style="font-weight:500">${icon('eye', 'ic-14')}What ${esc(pName)} sees now</p>${sees}</div>
      ${warn}<button class="btn btn--accent btn--lg btn--block" type="submit">Send interest</button>${foot}</form>`;
    qs('#fi').onsubmit = async e => {
      e.preventDefault(); const fd = new FormData(e.target), b = e.target.querySelector('[type=submit]'); b.disabled = true;
      try { const x = await API.findExpress(r.id, String(fd.get('intro') || ''), (r.questions || []).map((_, i) => String(fd.get('a' + i) || ''))); r.my_interest = { id: x.id, status: 'pending', mine: true }; r.interest_count++; r.intros_left = x.intros_left; toast('Sent. We’ll tell you when they answer.'); panel(); }
      catch (err) { H.fail(err); b.disabled = false; }
    };
  }
})();
</script>
