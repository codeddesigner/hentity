   and if the app never starts, reload once and then fall back to the readable server copy. */
(function () {

  function log(m, s) { if (/view transition|_vercel\/insights/i.test(String(m) + ' ' + String(s || ''))) return; if (n++ > 3) return; try { fetch('https://sislzikhjapilksictxd.supabase.co/rest/v1/client_errors', { method: 'POST', keepalive: true, headers: { apikey: 'sb_publishable_49iWYS0Wr9kVY_PfDQphww_jj9dRaBz', 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ path: location.pathname.slice(0, 300), msg: String(m).slice(0, 600), src: String(s || '').slice(0, 400), ua: navigator.userAgent.slice(0, 300) }) }).catch(function () {}); } catch (e) {} }
  window.addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) log('failed to load', t.src || t.href); else if (e.message) log(e.message, (e.filename || '') + ':' + (e.lineno || '')); }, true);
  // A page that fails while loading its data shows the readable server copy instead of a blank screen
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason || {}; if (/view transition/i.test(r.message || r)) return; log('unhandled: ' + (r.message || r), (r.stack || '').split('\n')[1] || ''); if (!(window.performance && performance.getEntriesByName('hentity:content').length)) d.classList.remove('js-boot'); });
  // Only judge once every script has loaded: on a slow connection they may still be downloading
  function check() { if (window.H && window.API) return; if (document.readyState !== 'complete') return; d.classList.remove('js-boot'); log('app did not start: H=' + !!window.H + ' API=' + !!window.API + ' supabase=' + !!window.supabase, '');
    try { if (!sessionStorage.getItem('h-reload')) { sessionStorage.setItem('h-reload', '1'); location.reload(); } } catch (e) {} }
  window.addEventListener('load', function () { setTimeout(check, 1500); });
  // On a slow connection, show the readable server copy after 3s rather than a blank page
  setTimeout(function () { if (d.classList.contains('js-boot') && document.querySelector('[data-ssr]')) log('content not shown after 3s', 'ready=' + !!(window.performance && performance.getEntriesByName('hentity:ready').length)); d.classList.remove('js-boot'); }, 3000);

<title>Resources for African founders | Hentity</title>
<meta name="description" content="Tools and guides other African founders use, and how to use them: pitch decks, registering your business, payments, hiring, legal basics and more.">

<style>
/* Resources (Figma 274:850 home, 275:312 category) */
.rs{max-width:1100px;margin:0 auto;padding:32px 40px 80px;box-sizing:content-box}
.rs h1{font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.025em}
.rs-sub{font-size:14px;line-height:20px;color:var(--color-text-secondary);margin-top:6px}
.rs-search{position:relative;display:block;margin-top:20px}
.rs-search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--color-text-tertiary);pointer-events:none}
.rs-search input{padding-left:36px;font-size:13px;border-color:var(--color-border-default);height:40px}
.rs-h2{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.01em;margin:24px 0 16px}
.rs-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rs-cat{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--color-border-default);border-radius:14px;background:var(--color-bg-canvas);transition:border-color .15s}
.rs-cat:hover{border-color:var(--color-text-primary)}
.rs-cat .ib,.rs-dh .ib{width:36px;height:36px;border-radius:10px;background:var(--color-bg-subtle);display:grid;place-items:center;flex:none;color:var(--color-text-primary)}
.rs-cat .ib .ic{width:18px;height:18px}
.rs-cat b{display:block;font-size:13px;line-height:16px;font-weight:500}
.rs-cat p{font-size:12px;line-height:16px;font-weight:500;color:var(--color-text-tertiary);margin-top:4px}
.rs-cat small{display:block;font-size:12px;line-height:16px;font-weight:500;color:var(--color-text-secondary);margin-top:4px}
.rs-cat>.ic{width:16px;height:16px;color:var(--color-text-tertiary);flex:none}
.rs-grid{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:16px;align-items:start;margin-top:16px}
.rs-card{border:1px solid var(--color-border-default);border-radius:14px;background:var(--color-bg-canvas);padding:16px}
.rs-card .t{font-size:13px;line-height:16px;font-weight:500}
.rs-card .d{font-size:13px;line-height:18px;color:var(--color-text-secondary);margin:10px 0 12px}
.rs-pop a{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--color-border-default)}
.rs-pop a:first-of-type{margin-top:8px}
.rs-pop .m{width:28px;height:28px;border-radius:8px;background:var(--color-bg-subtle);display:grid;place-items:center;font-size:12px;font-weight:500;color:var(--color-text-secondary);flex:none}
.rs-pop b{display:block;font-size:13px;line-height:16px;font-weight:500}
.rs-pop small{display:block;font-size:12px;line-height:16px;font-weight:500;color:var(--color-text-tertiary)}
.rs-pop a>.ic{margin-left:auto;width:14px;height:14px;color:var(--color-text-tertiary);flex:none}
/* category */
.rs-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:500;color:var(--color-text-secondary)}
.rs-back:hover{color:var(--color-text-primary)}
.rs-dh{display:flex;align-items:center;gap:14px;margin-top:16px}
.rs-dh .ib{width:44px;height:44px;border:1px solid var(--color-border-default);background:var(--color-bg-canvas)}
.rs-dh .ib .ic{width:20px;height:20px}
.rs-dh p{font-size:12px;line-height:16px;font-weight:500;color:var(--color-text-tertiary);margin-top:4px}
.rs-dgrid{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:24px;align-items:start;margin-top:24px}
.rs-step{margin-bottom:24px}
.rs-step__h{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.rs-step__n{width:20px;height:20px;border-radius:50%;background:var(--color-text-primary);color:var(--color-bg-canvas);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;margin-top:2px}
.rs-step__h b{display:block;font-size:15px;line-height:20px;font-weight:600}
.rs-step__h small{display:block;font-size:12px;line-height:16px;font-weight:500;color:var(--color-text-tertiary);margin-top:2px}
.rs-item{border:1px solid var(--color-border-default);border-radius:14px;background:var(--color-bg-canvas);padding:16px;margin-top:8px}
.rs-item__top{display:flex;gap:12px;align-items:flex-start}
.rs-item .m{width:32px;height:32px;border-radius:8px;background:var(--color-bg-subtle);display:grid;place-items:center;font-size:12px;font-weight:500;color:var(--color-text-secondary);flex:none}
.rs-item .m.is-h{background:#0a0a0a;color:#fff}
.rs-item .n{display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;font-weight:500}
.rs-item .price{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:6px;background:var(--color-bg-muted);font-size:11px;font-weight:500;color:var(--color-text-secondary)}
.rs-item .u{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:500;color:var(--color-accent-default);margin-top:4px}
.rs-item .u .ic{width:12px;height:12px}
.rs-item .dd{font-size:13px;line-height:18px;color:var(--color-text-secondary);margin-top:6px}
.rs-item details{margin-top:12px}
.rs-item summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;font-size:12px;line-height:16px;font-weight:500;padding:2px 0}
.rs-item summary::-webkit-details-marker{display:none}
.rs-item summary .ic{width:14px;height:14px;color:var(--color-text-tertiary);transition:transform .2s}
.rs-item details[open] summary .ic{transform:rotate(180deg)}
.rs-item details[open]{background:var(--color-bg-subtle);border-radius:10px;padding:10px 12px;margin:12px -4px 0}
.rs-item ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.rs-item li{display:flex;gap:10px;font-size:12px;line-height:16px;font-weight:500;color:var(--color-text-primary);counter-increment:s}
.rs-item li::before{content:counter(s);width:16px;flex:none;text-align:center;color:var(--color-text-secondary)}
.rs-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:20px}
.rs-prog label{display:flex;align-items:center;gap:10px;font-size:12px;line-height:16px;font-weight:500;padding:5px 0;cursor:pointer}
.rs-prog input{width:16px;height:16px;accent-color:#0a0a0a;flex:none;margin:0}
.rs-tip{border-radius:14px;background:var(--color-bg-subtle);padding:16px}
.rs-tip b{display:block;font-size:13px;line-height:16px;font-weight:500}
.rs-tip p{font-size:12px;line-height:16px;font-weight:500;color:var(--color-text-secondary);margin-top:6px}
.rs-empty{padding:32px 16px;text-align:center;color:var(--color-text-secondary);font-size:13px}
@media (max-width:1180px){.rs{padding:24px 32px 64px}}
@media (max-width:960px){.rs-cats{grid-template-columns:repeat(2,minmax(0,1fr))}.rs-grid,.rs-dgrid{grid-template-columns:minmax(0,1fr)}.rs-side{position:static}}
@media (max-width:768px){.rs{padding:16px 16px 32px}.rs h1{font-size:26px;line-height:32px}.rs-cats{grid-template-columns:minmax(0,1fr)}}
</style>

<meta property="og:description" content="Tools and guides other African founders use, and how to use them: pitch decks, registering your business, payments, hiring, legal basics and more.">

<meta name="twitter:title" content="Resources for African founders | Hentity">
<meta name="twitter:description" content="Tools and guides other African founders use, and how to use them: pitch decks, registering your business, payments, hiring, legal basics and more.">

</head>
<body>
<div data-header></div>
<main class="rs" id="main"></main>
<div data-tabbar></div>
<script>
H.mount({ active: 'resources', tab: 'you' });
(function () {
  const { qs, esc, icon, toast } = H;
  const R = window.RESOURCES, root = qs('#main');
  const all = R.cats.flatMap(c => c.steps.flatMap(s => s.items.map(i => Object.assign({ cat: c }, i))));
  const count = c => c.steps.reduce((n, s) => n + s.items.length, 0);
  const host = i => i.host || (/^https?:/.test(i.url) ? i.url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '') : 'On Hentity');
  const ext = i => /^https?:/.test(i.url);
  const mark = i => ext(i) ? `<span class="m">${esc(i.n[0])}</span>` : `<span class="m is-h">${icon('plus', 'ic-14')}</span>`;
  const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const slug = location.pathname.split('/')[2] || '';
  const cat = R.cats.find(c => c.slug === slug);

  async function suggest() {
    if (!API.uid) { location.href = '/signin?next=' + encodeURIComponent(location.pathname); return; }
    const url = await H.ask('Suggest a resource', { placeholder: 'https://…', ok: 'Next' }); if (!url) return;
    if (!/^https?:\/\//.test(url)) { toast('Paste a full link starting with https://', 'error'); return; }
    const note = (await H.ask('How did you use it?', { placeholder: 'One line is enough', multiline: true, optional: true, ok: 'Send' })) || '';
    try { await API.suggestStory(url, 'Resource' + (cat ? ' (' + cat.title + ')' : '') + ': ' + note); toast('Thanks, the Hentity team will check it'); } catch (e) { H.fail(e); }
  }
  const suggestCard = (t, d) => `<section class="rs-card"><p class="t">${t}</p>${d ? `<p class="d">${d}</p>` : '<div style="height:10px"></div>'}<button class="btn btn--secondary btn--sm" type="button" data-suggest>Suggest a resource</button></section>`;

  function home() {
    document.title = 'Resources for African founders | Hentity';
    const pop = [R.cats[0].steps[0].items[0], R.cats[1].steps[0].items[0], R.cats[2].steps[0].items[0], R.cats[4].steps[0].items[0]].map((i, k) => Object.assign({ cat: [R.cats[0], R.cats[1], R.cats[2], R.cats[4]][k] }, i));
    root.innerHTML = `<h1>Resources</h1><p class="rs-sub">Tools and guides other founders use, and how to use them.</p>
      <label class="rs-search">${icon('search')}<input class="input" id="rq" type="search" placeholder="Search resources, e.g. &quot;pitch deck template&quot; or &quot;CAC&quot;" aria-label="Search resources" autocomplete="off"></label>
      <div id="rbody"></div>`;
    const paint = q => {
      const body = qs('#rbody');
      if (q) {
        const t = q.toLowerCase(); const hits = all.filter(i => (i.n + ' ' + i.d + ' ' + host(i) + ' ' + i.cat.title + ' ' + i.cat.sub).toLowerCase().includes(t));
        body.innerHTML = `<h2 class="rs-h2">${hits.length} result${hits.length === 1 ? '' : 's'}</h2>${hits.length ? `<section class="rs-card rs-pop" style="padding-top:8px">${hits.map(row).join('')}</section>` : `<div class="rs-card rs-empty">Nothing yet for “${esc(q)}”. <button class="link" type="button" data-suggest style="color:var(--color-accent-default);font-weight:500">Suggest a resource</button></div>`}`;
        return;
      }
      body.innerHTML = `<h2 class="rs-h2">What are you trying to do?</h2>
        <div class="rs-cats">${R.cats.map(c => `<a class="rs-cat" href="/resources/${c.slug}"><span class="ib">${icon(c.icon)}</span><span class="grow" style="min-width:0"><b>${esc(c.title)}</b><p>${esc(c.sub)}</p><small>${count(c)} resource${count(c) === 1 ? '' : 's'}</small></span>${icon('arrow-right')}</a>`).join('')}</div>
        <div class="rs-grid"><section class="rs-card rs-pop"><p class="t">Popular this week</p>${pop.map(row).join('')}</section>
        ${suggestCard('Know a good resource?', 'Suggest it with a line on how you used it. The Hentity team checks every link before it goes up.')}</div>`;
    };
    const row = i => `<a href="${esc(i.url)}"${ext(i) ? ' target="_blank" rel="noopener"' : ''}><span class="m">${esc(i.n[0])}</span><span style="min-width:0"><b>${esc(i.n)}</b><small class="truncate">${esc(host(i))} · ${esc(i.cat.title)}</small></span>${icon(ext(i) ? 'arrow-up-right' : 'arrow-right')}</a>`;
    paint('');
    let tm; qs('#rq').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => paint(e.target.value.trim()), 120); });
  }

  function detail(c) {
    document.title = c.title + ' | Resources | Hentity';
    const key = 'hentity.res.' + c.slug; const done = store.get(key);
    let k = 0;
    root.innerHTML = `<a class="rs-back" href="/resources">${icon('arrow-left', 'ic-14')}Resources</a>
      <div class="rs-dh"><span class="ib">${icon(c.icon)}</span><div><h1>${esc(c.title)}</h1><p>${count(c)} resources in ${c.steps.length} step${c.steps.length === 1 ? '' : 's'} · links checked ${esc(R.checked)}</p></div></div>
      <div class="rs-dgrid"><div>${c.steps.map((s, si) => `<section class="rs-step"><div class="rs-step__h"><span class="rs-step__n">${si + 1}</span><span><b>${esc(s.t)}</b><small>${esc(s.d)}</small></span></div>
        ${s.items.map(i => { const open = k++ === 0 || (si === 1 && s.items[0] === i); return `<article class="rs-item"><div class="rs-item__top">${mark(i)}<div class="grow" style="min-width:0"><p class="n">${esc(i.n)}<span class="price">${esc(i.price)}</span></p>
          ${ext(i) ? `<a class="u" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(host(i))}${icon('arrow-up-right')}</a>` : `<p class="u">${esc(i.host || 'On Hentity')}</p>`}<p class="dd">${esc(i.d)}</p></div>
          <a class="btn btn--secondary btn--sm" href="${esc(i.url)}"${ext(i) ? ' target="_blank" rel="noopener"' : ''}>${icon(ext(i) ? 'arrow-up-right' : 'arrow-right', 'ic-14')}${ext(i) ? 'Visit site' : 'Open'}</a></div>
          <details${open ? ' open' : ''}><summary>How to use it${icon('chevron-down')}</summary><ol>${i.how.map(h => `<li>${esc(h)}</li>`).join('')}</ol></details></article>`; }).join('')}</section>`).join('')}</div>
      <aside class="rs-side"><section class="rs-card rs-prog"><p class="t" style="margin-bottom:6px">Your progress</p>${c.progress.map((p, i) => `<label><input type="checkbox" data-p="${i}"${done.includes(i) ? ' checked' : ''}>${esc(p)}</label>`).join('')}</section>
        <section class="rs-tip"><b>${esc(c.tip.t)}</b><p>${esc(c.tip.d)}</p></section>
        ${suggestCard('Used something better?')}</aside></div>`;
    root.addEventListener('change', e => { const b = e.target.closest('[data-p]'); if (!b) return; const v = new Set(store.get(key)); b.checked ? v.add(+b.dataset.p) : v.delete(+b.dataset.p); store.set(key, [...v]); });
  }

  root.addEventListener('click', e => { if (e.target.closest('[data-suggest]')) suggest(); });
  if (slug && !cat) { root.innerHTML = `<a class="rs-back" href="/resources">${icon('arrow-left', 'ic-14')}Resources</a><div class="rs-card rs-empty" style="margin-top:16px">That guide moved. <a href="/resources" style="color:var(--color-accent-default)">See all resources</a></div>`; }
  else cat ? detail(cat) : home();
  H.contentShown && H.contentShown();
})();
</script>
</body>
