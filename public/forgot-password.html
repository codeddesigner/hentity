<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<script src="/assets/app.js"></script>
<title>Reset your password · Hentity</title>
</head>
<body class="no-tabbar">
<div class="auth">
  <div data-brand></div>
  <main class="auth__side">
    <div data-mobilebar data-back="/signin"></div>
    <form class="auth__form" id="form" novalidate>
      <a class="back-link" href="/signin"><span data-icon="arrow-left"></span>Back to sign in</a>
      <div class="auth__heading">
        <h1 class="t-h2">Reset your password</h1>
        <p class="c-2">Enter the email on your account. If it exists, we’ll send a reset link that works for 1 hour.</p>
      </div>
      <div class="alert alert--success" id="sent" role="status" hidden>
        <span data-icon="check"></span>
        <div><p class="alert__title">Check your inbox</p><p class="alert__body">If <span id="sent-to"></span> has an account, a reset link is on its way. It works for 1 hour.</p></div>
      </div>
      <div class="field" id="f-email">
        <label class="field__label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
        <p class="field__hint is-error" id="hint" hidden>Enter a valid email address.</p>
      </div>
      <button class="btn btn--primary btn--block" type="submit" id="submit">Send reset link</button>
      <p class="auth__switch">Signed up with Google? <a href="/signin">Continue with Google</a></p>
    </form>
  </main>
</div>
<script src="/assets/auth.js"></script>
<script>
H.mount();
(function () {
  const { qs } = H; const form = qs('#form');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const email = form.email.value.trim();
    if (!Auth.emailOk(email)) { qs('#f-email').classList.add('is-error'); qs('#hint').hidden = false; return; }
    qs('#f-email').classList.remove('is-error'); qs('#hint').hidden = true;
    qs('#sent-to').textContent = email; qs('#sent').hidden = false;
    H.store.set('resetEmail', email);
    const b = qs('#submit'); b.textContent = 'Resend link'; b.className = 'btn btn--secondary btn--block';
    if (!qs('#demo')) { const a = document.createElement('a'); a.id = 'demo'; a.className = 'link'; a.style.textAlign = 'center'; a.href = '/reset-password'; a.textContent = 'Open the reset link (demo)'; b.after(a); }
  });
})();
</script>
</body>
</html>
