/* Data room (Figma 302:3757 setup · 304:3901 room · 228:3074 lock & share · 229:3260 analytics) */
.dr{max-width:1100px;margin:0 auto;padding:28px 40px 80px;box-sizing:content-box}

.dr-tag--y{background:#FFF3D1;color:#8A5A00}.dr-tag--b{background:#E3F0FF;color:#1E5FA8}.dr-tag--g{background:#E3F9EE;color:#127A45}

<meta name="twitter:title" content="Data room | Hentity">

</head>
<body>
<div data-header></div>
<main class="dr" id="main"><div class="skel" style="height:420px;border-radius:16px"></div></main>
<div data-tabbar></div>
<script>
H.mount({ active: 'dataroom', tab: 'you' });
(async function () {
  const { qs, qsa, esc, icon, toast } = H;
  const root = qs('#main');
  const seg = location.pathname.split('/').filter(Boolean);   // ['data-room', 'setup'] | ['data-room', 'files', id]
  await API.ready;
  if (!API.uid) { location.href = '/signin?next=' + encodeURIComponent(location.pathname); return; }
  let D;
  async function load() { D = await API.drRoom(); D.files = D.files || []; D.links = D.links || []; }
  try { await load(); } catch (e) { H.fail(e); root.innerHTML = `<div class="dr-empty">Couldn’t open your data room. ${esc(e.message || '')}</div>`; H.contentShown(); return; }
  if (!D.room || seg[1] === 'setup') setup(); else if (seg[1] === 'files' && seg[2]) filePage(seg[2]); else if (seg[1] === 'analytics') roomAnalytics(); else room();
  H.contentShown();

  // ================================================================ setup: pick a stage (Figma 302:3757)
  function setup() {
    document.title = 'Set up your data room | Hentity';
    const P = (D.room && D.room.product) || D.products[0] || null;
    const guess = D.room ? D.room.stage : (P && /seed|series a/i.test(P.stage || '') ? (/series/i.test(P.stage) ? 'growth' : 'seed') : P ? 'seed' : 'ff');
    let pick = guess;
    const card = s => { const S = DR.STAGES[s]; return `<label class="dr-sc${s === pick ? ' is-on' : ''}" data-s="${s}"><input type="radio" name="st" value="${s}"${s === pick ? ' checked' : ''}><span class="rdo"></span>
      <span class="dr-tag ${S.tagCls}">${S.tag}</span><h3>${S.name}</h3><p class="who">${S.who}</p><p class="rd"><b>${S.round}</b>typical round</p><hr>
      <p class="n">${DR.stageCount(s)} items in your data room</p><ul>${S.bullets.map((b, i) => `<li>${icon(s === 'growth' && i === 0 ? 'plus' : 'check')}${esc(b)}</li>`).join('')}</ul>
      ${s === guess && P ? `<span class="sugg">${icon('sparkles', 'ic-12')}Suggested for ${esc(P.name)}</span>` : ''}</label>`; };
    const cell = v => v === 'R' ? '<span class="dr-req">Required</span>' : v === 'O' ? '<span class="dr-req dr-opt">Optional</span>' : '<span class="c-3">—</span>';
    root.innerHTML = `<nav class="dr-crumbs"><a href="/data-room">Data room</a><span>/</span><b>Set up</b></nav>
      <div class="dr-head"><div><h1>What round are you raising?</h1><p>Your data room changes with your stage. Pick one and we’ll set up the folders and checklist investors at that stage expect. You can switch any time.</p></div></div>
      ${P ? `<div class="dr-sug">${H.plogo(P, 32)}<span>${esc(P.name)} is listed${P.stage ? ' as ' + esc(P.stage) : ''} on Hentity, so we suggest ${esc(DR.STAGES[guess].name)}.</span></div>` : ''}
      <div class="dr-stages" id="stages">${['ff', 'seed', 'growth'].map(card).join('')}</div>
      <div class="dr-acts">${D.room ? `<a class="btn btn--secondary" href="/data-room">Cancel</a>` : ''}<button class="btn btn--primary" id="go">${icon('arrow-right', 'ic-16')}<span id="go-l"></span></button></div>
      <section class="dr-cmp"><div class="dr-cmp__h"><h2>What goes in each room</h2><span class="t-caption c-3" style="font-weight:400">Files you add stay when you switch</span></div>
        <table><thead><tr><th>Document</th><th>Friends & family</th><th>Pre-seed & seed</th><th>Growth</th></tr></thead><tbody>${DR.ITEMS.map(i => `<tr><td>${esc(i[1])}</td><td>${cell(i[4])}</td><td>${cell(i[5])}</td><td>${cell(i[6])}</td></tr>`).join('')}</tbody></table></section>`;
    const label = () => { qs('#go-l').textContent = D.room ? `Switch to ${DR.STAGES[pick].short}` : `Set up my ${{ ff: 'friends & family', seed: 'seed', growth: 'growth' }[pick]} data room`; };
    label();
    qs('#stages').addEventListener('change', e => { pick = e.target.value; qsa('.dr-sc').forEach(c => c.classList.toggle('is-on', c.dataset.s === pick)); label(); });
    qs('#go').onclick = async () => { const b = qs('#go'); b.disabled = true; try { await API.drSetup(pick, P && P.id, P ? P.name : (API.profile && API.profile.name) || ''); location.href = '/data-room'; } catch (e) { H.fail(e); b.disabled = false; } };
  }

  // ================================================================ the room (Figma 304:3901)
  function room() {
    const R = D.room, S = DR.STAGES[R.stage], items = DR.itemsFor(R.stage);
    const byItem = {}; D.files.forEach(f => { if (f.item) byItem[f.item] = f; });
    const extra = D.files.filter(f => !f.item || !items.some(i => i.key === f.item));
    const req = items.filter(i => i.need === 'R'), ready = req.filter(i => byItem[i.key]).length;
    const company = R.name || (R.product && R.product.name) || '';
    document.title = `${S.title} | Hentity`;
    const folders = DR.FOLDERS.map(([k, n]) => { const it = items.filter(i => i.folder === k), ex = extra.filter(f => (f.folder || 'other') === k); return { k, n, it, ex }; }).filter(x => x.it.length || x.ex.length);
    const row = i => { const f = byItem[i.key];
      return f ? `<div class="dr-row is-file" data-open="${f.id}"><span class="dr-ic${i.key === 'deck' ? ' dr-ic--accent' : ''}">${icon('file-text')}</span><div class="t"><p>${esc(i.name)}${f.version > 1 ? ` · v${f.version}` : ''}<span class="dr-st dr-st--ok">${icon('check')}Added</span></p><p>${esc(f.name)}${f.pages ? ` · ${f.pages} page${f.pages === 1 ? '' : 's'}` : ''}${f.views ? ` · ${f.views} viewer${f.views === 1 ? '' : 's'}` : ''}</p></div><span class="m">Updated ${DR.day(f.updated_at)}</span></div>`
        : `<div class="dr-row"><span class="dr-ic">${icon('upload')}</span><div class="t"><p>${esc(i.name)}${i.need === 'R' ? `<span class="dr-st dr-st--miss">${icon('alert-circle')}Missing</span>` : '<span class="dr-st dr-st--opt">Optional</span>'}</p><p>${esc(i.hint)}</p></div>
          ${['onepager', 'model', 'burn', 'usefunds', 'founders', 'agreement', 'safes', 'cap'].includes(i.key) ? `<a class="dr-tpl hide-sm" href="/resources/${['founders', 'agreement', 'safes'].includes(i.key) ? 'legal' : i.key === 'onepager' ? 'pitch-deck' : 'raise-money'}">${icon('file-text')}Use template</a>` : ''}
          <button class="btn btn--secondary btn--sm" data-up="${i.key}" data-folder="${i.folder}">${icon('upload', 'ic-14')}Upload</button></div>`; };
    const xrow = f => `<div class="dr-row is-file" data-open="${f.id}"><span class="dr-ic">${icon(DR.kind(f) === 'image' ? 'image' : DR.kind(f) === 'video' ? 'video' : 'file-text')}</span><div class="t"><p>${esc(f.name)}</p><p>${DR.kindLabel(f)} · ${DR.kb(f.size)}${f.views ? ` · ${f.views} viewer${f.views === 1 ? '' : 's'}` : ''}</p></div><span class="m">${DR.day(f.updated_at)}</span></div>`;
    const next = R.stage === 'growth' ? null : R.stage === 'seed' ? 'growth' : 'seed';
    const live = D.links.filter(l => !l.revoked_at && (!l.expires_at || new Date(l.expires_at) > new Date()));
    root.innerHTML = `<nav class="dr-crumbs"><span>Data room</span>${company ? `<span>/</span><b>${esc(company)}</b>` : ''}</nav>
      <div class="dr-head"><div><h1>${S.title}<span class="dr-stage">${esc(S.short)}${icon('chevron-down')}<select id="stg" aria-label="Stage">${['ff', 'seed', 'growth'].map(s => `<option value="${s}"${s === R.stage ? ' selected' : ''}>${DR.STAGES[s].short}</option>`).join('')}</select></span></h1><p>${S.lead}</p></div>
        <div class="row gap-8"><a class="btn btn--secondary btn--sm" href="/data-room/analytics">${icon('bar-chart', 'ic-14')}Analytics</a><label class="btn btn--secondary btn--sm" style="cursor:pointer">${icon('upload', 'ic-14')}Upload<input type="file" class="sr-only" id="up-any" multiple></label><button class="btn btn--primary btn--sm" id="share-room">${icon('link', 'ic-14')}Share with an investor</button></div></div>
      <div class="dr-ready"><b>${ready}/${req.length}</b><span>required ready</span><span class="dr-bars">${req.map((_, i) => `<i${i < ready ? ' class="on"' : ''}></i>`).join('')}</span><span class="r">${D.files.length} file${D.files.length === 1 ? '' : 's'} · ${live.length} active link${live.length === 1 ? '' : 's'}</span></div>
      <div class="dr-grid"><nav class="dr-nav"><a href="#all" aria-current="true">${icon('folder')}All files<span>${D.files.length}</span></a>${folders.map(x => `<a href="#f-${x.k}">${icon('folder')}${esc(x.n)}<span>${x.it.filter(i => byItem[i.key]).length + x.ex.length}/${x.it.length + x.ex.length}</span></a>`).join('')}</nav>
        <div>${folders.map(x => `<section class="dr-sec" id="f-${x.k}"><div class="dr-sec__h">${esc(x.n)}<span>${x.it.filter(i => byItem[i.key]).length + x.ex.length}/${x.it.length + x.ex.length}</span></div>${x.it.map(row).join('')}${x.ex.map(xrow).join('')}</section>`).join('')}
          <label class="dr-drop" id="drop">${icon('upload', 'ic-18')}<br>Drop any other file here, or <span class="c-accent" style="font-weight:500;cursor:pointer">choose a file</span><br><span class="t-caption c-3" style="font-weight:400">PDF, images, video, spreadsheets · up to 50 MB · only you can see it until you share a link</span><input type="file" class="sr-only" id="up-drop" multiple></label></div>
        <aside class="dr-side">
          <section class="dr-card"><p class="t">Shared with</p>${D.links.length ? `<div class="dr-share">${D.links.slice(0, 5).map(l => `<a href="#links"><b>${esc(l.label)}</b><small>${l.revoked_at ? 'Revoked' : l.last_view ? 'Viewed ' + H.ago(l.last_view) : 'Not opened yet'}</small></a>`).join('')}</div>` : '<p class="d">No links yet. Share the whole room, or open a file to share just that one.</p>'}
            <button class="btn btn--secondary btn--sm btn--block" style="margin-top:12px" id="share-room2">${icon('link', 'ic-14')}Create a share link</button>
            <a class="link link--accent t-caption" href="/data-room/analytics" style="display:inline-block;margin-top:10px">See who’s viewing →</a></section>
          ${next ? `<section class="dr-card"><span class="dr-tag ${DR.STAGES[next].tagCls}">${DR.STAGES[next].name} room</span><p class="d" style="margin-top:10px">When you raise ${next === 'growth' ? 'a Series A' : 'from angels and seed funds'}, your room grows to ${DR.stageCount(next)} items: ${esc(DR.STAGES[next].bullets.slice(next === 'growth' ? 1 : 0, 3).map((b, i) => i ? b.charAt(0).toLowerCase() + b.slice(1) : b.charAt(0).toLowerCase() + b.slice(1)).join(', ').replace('kPIs', 'KPIs'))}.</p><a class="link link--accent t-caption" href="/data-room/setup" style="display:inline-block;margin-top:10px">Preview ${DR.STAGES[next].short.toLowerCase()} room →</a></section>` : ''}
          <section class="dr-card dr-card--soft"><p class="t">Templates are in Resources</p><p class="d">Financial model, one-pager, SAFE and founder agreement templates, with how to use them.</p><a class="link link--accent t-caption" href="/resources/raise-money" style="display:inline-block;margin-top:8px">Open Resources →</a></section>
        </aside></div>
      <section class="dr-links" id="links"><div class="dr-links__h"><h2>Share links</h2><button class="btn btn--secondary btn--sm" id="share-room3">${icon('plus', 'ic-14')}New link</button></div>${linksHtml(D.links)}</section>`;
    qs('#stg').onchange = async e => { try { await API.drSetup(e.target.value, R.product_id, R.name); location.reload(); } catch (er) { H.fail(er); } };
    qsa('#share-room,#share-room2,#share-room3').forEach(b => b.onclick = () => linkSheet(null, null));
    root.onclick = e => {
      const o = e.target.closest('[data-open]'); if (o && !e.target.closest('button,a,label')) { location.href = '/data-room/files/' + o.dataset.open; return; }
      const u = e.target.closest('[data-up]'); if (u) pickAndUpload(u.dataset.up, u.dataset.folder);
      linkActions(e);
    };
    qs('#up-any').onchange = e => uploadMany([...e.target.files], '', 'other');
    qs('#up-drop').onchange = e => uploadMany([...e.target.files], '', 'other');
    const drop = qs('#drop');
    ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('is-over'); }));
    ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('is-over'); }));
    drop.addEventListener('drop', e => uploadMany([...e.dataTransfer.files], '', 'other'));
  }

  function pickAndUpload(item, folder) {
    const i = document.createElement('input'); i.type = 'file'; if (item === 'deck') i.accept = '.pdf,application/pdf';
    i.onchange = () => i.files[0] && uploadMany([i.files[0]], item, folder); i.click();
  }
  async function uploadMany(files, item, folder) {
    if (!files.length) return;
    for (const f of files) {
      if (f.size > 50 * 1024 * 1024) { toast(`${f.name} is over 50 MB`, 'error'); continue; }
      if (item === 'deck' && !/pdf/i.test(f.type) && !/\.pdf$/i.test(f.name)) { toast('Upload the deck as a PDF so investors can read it in the browser', 'error'); continue; }
      toast(`Uploading ${f.name}…`);
      try { const pages = /pdf/i.test(f.type) || /\.pdf$/i.test(f.name) ? await DR.pdfPages(f) : null; await API.drUpload(D.room.id, f, item, folder, pages); }
      catch (e) { H.fail(e); return; }
    }
    toast(files.length > 1 ? 'Files added' : 'File added'); await load(); seg[1] === 'files' ? filePage(seg[2]) : room();
  }

  // ---- links list + actions (shared by the room and the file page)
  function linksHtml(links, fid) {
    const L = fid ? links.filter(l => !l.file_ids || l.file_ids.includes(fid)) : links;
    if (!L.length) return `<p class="dr-empty" style="border-top:1px solid var(--color-border-default)">No links yet. One link per investor or event, so you know who’s looking.</p>`;
    return L.map(l => { const off = l.revoked_at || (l.expires_at && new Date(l.expires_at) < new Date());
      const scope = !l.file_ids ? 'Whole room' : !l.file_ids.length ? 'No files left: edit to add some' : l.file_ids.length === 1 ? (D.files.find(f => f.id === l.file_ids[0]) || {}).name || '1 file' : l.file_ids.length + ' files';
      return `<div class="dr-ln${off ? ' is-off' : ''}">${icon('link')}<div style="min-width:0"><b>${esc(l.label)}</b><small>${esc(scope)} · ${{ anyone: 'Anyone with the link', email: 'Verified email', list: 'Only people you added' }[l.mode]} · ${esc(DR.linkUrl(l).replace(/^https?:\/\//, ''))}</small></div>
        <span class="v">${l.viewers || 0} viewer${l.viewers === 1 ? '' : 's'}</span><span class="dr-st ${off ? 'dr-st--opt' : 'dr-st--ok'}">${l.revoked_at ? 'Revoked' : off ? 'Expired' : 'Active'}</span>
        <span class="row gap-4">${off ? (l.revoked_at ? `<button class="btn btn--ghost btn--sm" data-unrevoke="${l.id}">Turn back on</button>` : '') : `<button class="nav__icon" data-copy="${esc(DR.linkUrl(l))}" aria-label="Copy link" title="Copy link">${icon('copy', 'ic-16')}</button><button class="nav__icon" data-edit-link="${l.id}" aria-label="Edit link" title="Edit">${icon('edit', 'ic-16')}</button><button class="nav__icon" data-revoke="${l.id}" aria-label="Revoke link" title="Revoke">${icon('x', 'ic-16')}</button>`}</span></div>`; }).join('');
  }
  async function linkActions(e) {
    const c = e.target.closest('[data-copy]'), r = e.target.closest('[data-revoke]'), u = e.target.closest('[data-unrevoke]'), ed = e.target.closest('[data-edit-link]');
    try {
      if (c) await copyLink(c.dataset.copy);
      if (r) { if (!(await H.confirm('Revoke this link?', { body: 'Anyone who has it loses access straight away, including people viewing right now.', ok: 'Revoke', danger: true }))) return; await API.drRevoke(r.dataset.revoke, true); toast('Link revoked'); await load(); refresh(); }
      if (u) { await API.drRevoke(u.dataset.unrevoke, false); toast('Link is back on'); await load(); refresh(); }
      if (ed) linkSheet(D.links.find(l => l.id === ed.dataset.editLink), null);
    } catch (er) { H.fail(er); }
  }
  const refresh = () => seg[1] === 'files' ? filePage(seg[2]) : room();
  // Clipboard can be blocked (older Safari, in-app browsers): then show the link so it can be copied by hand
  async function copyLink(u) { try { await navigator.clipboard.writeText(u); toast('Link copied'); return true; } catch (e) { readySheet(u, 'Copy this link'); return false; } }
  function readySheet(u, title) {
    const el = document.createElement('div'); el.className = 'scrim';
    el.innerHTML = `<div class="modal stack gap-14" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="max-width:480px">
      <h2 class="t-h3">${esc(title)}</h2><p class="t-body-sm c-2">Send it to the investor. Only this link opens your files, and you can turn it off any time.</p>
      <input class="input" readonly value="${esc(u)}" style="font-family:var(--font-mono);font-size:13px">
      <div class="row gap-8" style="justify-content:flex-end"><button class="btn btn--ghost" type="button" data-x>Done</button><button class="btn btn--primary" type="button" data-c>${icon('copy', 'ic-14')}Copy link</button></div></div>`;
    document.body.append(el);
    const inp = el.querySelector('input'), close = () => { el.remove(); document.removeEventListener('keydown', k); }, k = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', k); inp.focus(); inp.select();
    el.addEventListener('click', async e => { if (e.target === el || e.target.closest('[data-x]')) close();
      if (e.target.closest('[data-c]')) { try { await navigator.clipboard.writeText(u); toast('Link copied'); close(); } catch (er) { inp.select(); toast('Press Ctrl+C (or ⌘C) to copy'); } } });
  }

  // ---- create / edit a link (whole room, or chosen files)
  function linkSheet(link, fid) {
    const l = Object.assign({ label: '', file_ids: fid ? [fid] : null, mode: 'email', allow: [], download: false, watermark: true, track: true, expires_at: null }, link || {});
    const el = document.createElement('div'); el.className = 'scrim';
    const exp = l.expires_at ? 'keep' : '';
    el.innerHTML = `<form class="modal stack gap-14" role="dialog" aria-modal="true" aria-label="Share link" style="max-width:520px;max-height:90vh;overflow:auto">
      <h2 class="t-h3">${link ? 'Edit link' : fid ? 'Share this file' : 'Share your data room'}</h2>
      <label class="field"><span class="field__label">Who it’s for</span><input class="input" name="label" value="${esc(l.label)}" placeholder="e.g. Baobab Ventures, or Demo Day Nairobi" maxlength="80" required></label>
      <div class="field"><span class="field__label">What they see</span><div class="chips" data-single id="scope"><button type="button" class="chip" data-v="all" aria-pressed="${!l.file_ids}">${icon('check')}Whole room</button><button type="button" class="chip" data-v="some" aria-pressed="${!!l.file_ids}">${icon('check')}Chosen files</button></div>
        <div id="files" class="stack gap-6" style="margin-top:8px;max-height:180px;overflow:auto${l.file_ids ? '' : ';display:none'}">${D.files.map(f => `<label class="row gap-8 t-body-sm"><input type="checkbox" value="${f.id}"${(l.file_ids || []).includes(f.id) ? ' checked' : ''}>${esc(f.item ? DR.itemName(f.item) + ' · ' + f.name : f.name)}</label>`).join('') || '<p class="t-caption c-3">No files yet.</p>'}</div></div>
      <div class="field"><span class="field__label">Who can open it</span>
        ${[['anyone', 'globe', 'Anyone with the link', 'No sign-in. You see views but not who.'], ['email', 'mail', 'Verified email', 'They confirm their email with a code first, so you see exactly who opened it.'], ['list', 'users', 'Only people I add', 'Only these emails or @domains, after a code.']].map(([v, ic, t, d]) => `<label class="dr-radio${l.mode === v ? ' is-on' : ''}"><input type="radio" name="mode" value="${v}"${l.mode === v ? ' checked' : ''}><span class="o"></span><span><b>${icon(ic)}${t}</b><small>${d}</small></span></label>`).join('')}
        <textarea class="input" name="allow" rows="2" placeholder="ama@baobab.vc, @savannahangels.africa" style="margin-top:8px${l.mode === 'list' ? '' : ';display:none'}">${esc((l.allow || []).join(', '))}</textarea></div>
      <div>${[['download', 'Allow download', 'Off: view in the browser only'], ['watermark', 'Watermark every page', 'Shows the viewer’s email and the date'], ['track', 'Track views and time per page', 'Viewers are told first. Off: this link shows no analytics']].map(([k, t, d]) => `<label class="dr-tg"><span><b>${t}</b><small>${d}</small></span><span class="toggle"><input type="checkbox" name="${k}"${l[k] ? ' checked' : ''}><span class="toggle__track"></span></span></label>`).join('')}</div>
      <label class="field"><span class="field__label">Link expires</span><select class="input" name="exp">${exp ? `<option value="keep" selected>${DR.day(l.expires_at)} (current)</option>` : ''}<option value=""${exp ? '' : ' selected'}>Never</option><option value="7">In 7 days</option><option value="30">In 30 days</option><option value="90">In 90 days</option></select></label>
      <div class="row gap-8" style="justify-content:flex-end"><button class="btn btn--ghost" type="button" data-x>Cancel</button><button class="btn btn--primary" type="submit">${link ? 'Save' : 'Create link'}</button></div></form>`;
    document.body.appendChild(el);
    const f = el.querySelector('form');

  function chart(pg, top, sess) {
    const W = 1000, H0 = 250, L = 40, R = 40, T = 24, B = 32, n = pg.length, bw = Math.min(44, (W - L - R) / n * .62), gap = (W - L - R) / n;
    const max = Math.max(10, ...pg.map(p => p.avg)), y = v => T + (H0 - T - B) * (1 - v / max), yr = v => T + (H0 - T - B) * (1 - v);
    const ticks = [0, .5, 1].map(t => Math.round(max * t));
    return `<svg viewBox="0 0 ${W} ${H0}" role="img" aria-label="Average seconds per page">
      ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#EBEBEB"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#A3A3A3">${t}s</text>`).join('')}
      ${pg.map((p, i) => { const x = L + gap * i + (gap - bw) / 2, h = Math.max(p.avg ? 2 : 0, (H0 - T - B) * p.avg / max); return `<rect x="${x}" y="${y(p.avg)}" width="${bw}" height="${h}" rx="4" fill="${top.includes(p.page) && p.avg ? '#FF8F57' : '#DCDCDC'}"><title>Page ${p.page}: ${DR.secs(p.avg)} average</title></rect>
        ${p.avg ? `<text x="${x + bw / 2}" y="${y(p.avg) - 6}" text-anchor="middle" font-size="11" fill="#0A0A0A">${Math.round(p.avg)}s</text>` : ''}<text x="${x + bw / 2}" y="${H0 - B + 18}" text-anchor="middle" font-size="12" fill="#0A0A0A" font-weight="500">${p.page}</text>`; }).join('')}
      <polyline fill="none" stroke="#7B61FF" stroke-width="2" points="${pg.map((p, i) => `${L + gap * i + gap / 2},${yr(p.reach / sess)}`).join(' ')}"/>
      ${pg.map((p, i) => `<circle cx="${L + gap * i + gap / 2}" cy="${yr(p.reach / sess)}" r="3" fill="#fff" stroke="#7B61FF" stroke-width="1.5"><title>${Math.round(p.reach / sess * 100)}% still reading</title></circle>`).join('')}
      <text x="${W - R + 6}" y="${yr(1) + 4}" font-size="11" fill="#7B61FF">100%</text><text x="${W - R + 6}" y="${yr(0) + 4}" font-size="11" fill="#7B61FF">0</text></svg>`;
  }
})();
</script>
</body>
</html>
