<title>My products · Hentity</title>
<style>
.mp{max-width:1200px;margin:0 auto;padding:40px 32px 96px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}
.stat{padding:20px}
.stat b{display:block;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-0.02em;margin:8px 0 6px}
.ptable{width:100%;border-collapse:collapse}
.ptable th{font-family:var(--font-mono);font-weight:400;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--color-text-tertiary);text-align:left;padding:14px 20px;border-bottom:1px solid var(--color-border-default)}
.ptable td{padding:14px 20px;border-bottom:1px solid var(--color-border-default);vertical-align:middle;font-size:13px}
.ptable tr:last-child td{border-bottom:0}
.ptable .pname{display:flex;align-items:center;gap:12px;min-width:0}
.ptable .pname .grow p:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.progress{height:6px;border-radius:999px;background:var(--color-bg-muted);overflow:hidden}
.progress i{display:block;height:100%;background:var(--color-accent-default);transition:width .3s}
.prep .check{display:flex;margin:0;font-size:13px}
@media (max-width:1100px){.mp{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:768px){.mp{padding:16px 16px 32px}.ptable thead{display:none}.ptable tr{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 16px;border-bottom:1px solid var(--color-border-default)}.ptable td{padding:0;border:0}.ptable td[data-l="launch"],.ptable td[data-l="votes"]{display:none}.ptable td.actions{grid-column:1/-1}.stat{padding:16px}.stat b{font-size:22px}}
</style>
<meta name="description" content="Discover the best new products built by African makers. A fresh launch board every Monday.">
<meta name="robots" content="noindex, follow">
<meta property="og:title" content="My products · Hentity">
<meta property="og:description" content="Discover the best new products built by African makers. A fresh launch board every Monday.">
<meta property="og:url" content="https://hentity.com/my-products">
<meta property="og:type" content="website">
<meta property="og:image" content="https://hentity.com/og.png?v=326c527973">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<meta name="twitter:title" content="My products · Hentity">

</head>
<body class="subtle">
<div data-header></div>
<div class="mp">
  <main>
    <div class="row between wrap gap-16"><div><h1 class="t-h2">My products</h1><p class="t-body-sm c-2" style="margin-top:4px">Week 46 · board resets Monday 06:00 WAT</p></div><a class="btn btn--accent btn--lg" href="/submit?new=1"><span data-icon="plus"></span>Submit a product</a></div>
    <div class="stats">
      <div class="card stat lift"><span class="t-body-sm c-2">Upvotes on live launches</span><b id="s-votes" data-count-to="0">0</b><span class="t-caption c-success" style="font-weight:400">counts update live</span></div>
      <div class="card stat lift"><span class="t-body-sm c-2">Board position</span><b id="s-rank">—</b><span class="t-caption c-success" style="font-weight:400" id="s-rank-sub"></span></div>
      <div class="card stat lift"><span class="t-body-sm c-2">Comments</span><b id="s-comments" data-count-to="0">0</b><a class="t-caption c-accent" style="font-weight:400" href="/notifications">see replies</a></div>
      <div class="card stat lift"><span class="t-body-sm c-2">Product followers</span><b id="s-followers" data-count-to="0">0</b><span class="t-caption c-success" style="font-weight:400">across your products</span></div>
    </div>
    <div class="card" style="overflow:hidden"><table class="ptable"><thead><tr><th>Product</th><th>Status</th><th>Launch</th><th>Upvotes</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="rows"></tbody></table></div>
  </main>
  <aside class="stack gap-16">
    <section class="card card--pad prep" id="prep-card" hidden>
      <div class="row gap-12" style="margin-bottom:14px"><span id="prep-logo"></span><div style="min-width:0"><p class="t-label">Launch prep</p><p class="t-caption c-3" style="font-weight:400" id="prep-sub"></p></div></div>
      <div class="progress" style="margin-bottom:16px" role="progressbar" aria-label="Launch prep" aria-valuemin="0" aria-valuemax="5" id="prog"><i></i></div>
      <div class="stack gap-12" id="prep"></div>
    </section>
    <section class="card card--pad" id="makers-card" hidden>
      <h2 class="t-label" style="margin-bottom:14px">Co-makers</h2>
      <div class="stack gap-12" id="makers"></div>
      <form id="invite" class="stack gap-8" hidden style="margin-top:14px" novalidate><input class="input" placeholder="Search by name or @username" aria-label="Find a co-maker" id="inv-email" autocomplete="off"><div id="inv-res" class="stack"></div><div class="row gap-8"><button class="btn btn--ghost btn--sm" type="button" id="inv-cancel">Cancel</button></div></form>
      <button class="btn btn--secondary btn--sm btn--block" type="button" id="inv-btn" style="margin-top:14px"><span data-icon="plus"></span>Invite a co-maker</button>
    </section>
  </aside>
</div>
<div data-tabbar></div>
<script src="/assets/data.js?v=8cfb3dc8d0"></script>
<script>
H.mount({ active: 'my-products', tab: 'you' });
(async function () {
  const { qs, qsa, icon, esc, store, toast, verified, plogo, avatar } = H;
  await API.ready;
  if (!API.uid) { location.replace('/signin?next=/my-products'); return; }
  const cur = await API.currentWeek();
  if (cur && qs('#week-sub')) qs('#week-sub').textContent = `Week ${cur.id} · board resets Monday 06:00 WAT`;
  let rows = [];
  const S = { live: 'Live', scheduled: 'Scheduled', changes: 'Changes requested', review: 'In review', draft: 'Draft', rejected: 'Not approved' };
  const A = {
    live: r => `<a class="btn btn--secondary btn--sm" href="/launch-week?p=${r.slug}">View launch</a><a class="btn btn--ghost btn--sm" href="/products/${r.slug}">Page</a>`,
    scheduled: r => `<a class="btn btn--secondary btn--sm" href="/scheduled?p=${r.slug}">Prepare</a><a class="btn btn--ghost btn--sm" href="/scheduled?p=${r.slug}#resched">Reschedule</a>`,
    changes: r => `<a class="btn btn--accent btn--sm" href="/changes-requested?p=${r.slug}">Fix &amp; resubmit</a>`,
    review: r => `<a class="btn btn--secondary btn--sm" href="/under-review?p=${r.slug}">View status</a>`,
    draft: r => `<a class="btn btn--secondary btn--sm" href="/submit?id=${r.id}">Continue</a><button class="btn btn--ghost btn--sm" type="button" data-del="${r.id}">Delete</button>`,
    rejected: r => `<a class="btn btn--ghost btn--sm" href="/submit?id=${r.id}">View</a>`
  };
  const st = r => r.effective_status || r.status;
  function render() {
    const live = rows.filter(r => st(r) === 'live');
    const votes = live.reduce((a, r) => a + r.upvote_count, 0), comments = rows.reduce((a, r) => a + r.comment_count, 0), followers = rows.reduce((a, r) => a + r.follower_count, 0);
    qs('#s-votes').dataset.countTo = votes; qs('#s-comments').dataset.countTo = comments; qs('#s-followers').dataset.countTo = followers;
    M.countUp(qs('.stats'));
    qs('#rows').innerHTML = rows.length ? rows.map(r => `<tr><td><div class="pname">${plogo(r, 32)}<div class="grow"><p class="t-label row gap-6" style="font-size:14px">${['live', 'scheduled'].includes(st(r)) ? `<a href="/products/${r.slug}">${esc(r.name)}</a>` : esc(r.name || 'Untitled product')}${r.verified ? verified('verified--sm') : ''}</p><p class="t-caption c-3" style="font-weight:400">${esc(r.tagline || 'Last edited ' + H.ago(r.created_at))}</p></div></div></td>
      <td data-l="status"><span class="status status--${st(r) === 'rejected' ? 'draft' : st(r)}">${S[st(r)] || st(r)}</span></td><td data-l="launch" class="c-2">${r.week_id ? `Week ${r.week_id} · ${new Date(r.week_starts_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}` : 'Not booked'}</td><td data-l="votes" class="t-count">${st(r) === 'live' || r.upvote_count ? D.fmt(r.upvote_count) : '–'}</td>
      <td class="actions"><div class="row gap-4" style="justify-content:flex-end">${(A[st(r)] || A.draft)(r)}</div></td></tr>`).join('')
      : `<tr><td colspan="5" style="text-align:center;padding:48px 20px"><p class="t-h4">No products yet</p><p class="t-body-sm c-2" style="margin:6px 0 16px">Start a launch draft. It saves as you go.</p><a class="btn btn--accent btn--sm" href="/submit?new=1">${icon('plus')}Submit a product</a></td></tr>`;
    M.stagger(qs('#rows'));
    const next = rows.find(r => st(r) === 'scheduled') || rows.find(r => st(r) === 'live');
    renderPrep(next); renderMakers(next);
  }
  async function computeRank() {
    const live = rows.find(r => st(r) === 'live'); if (!live) { qs('#s-rank').textContent = '—'; qs('#s-rank-sub').textContent = 'no live launch'; return; }
    const b = await API.board({ week: live.week_id }); const rk = b.filter(x => !x.promoted).findIndex(x => x.id === live.id) + 1;
    qs('#s-rank').textContent = '#' + rk; qs('#s-rank-sub').textContent = `of ${b.length} this week`;
  }
  function renderPrep(p) {
    const card = qs('#prep-card'); if (!p) { card.hidden = true; return; } card.hidden = false;
    const key = 'prep.' + p.id; const prep = store.get(key, [((p.media || []).length >= 4), (p.intro || '').length > 40, true, false, false]);
    const items = ['Gallery: 4 images + demo video', 'First comment drafted', 'Co-maker added', 'WhatsApp reminder to your community', 'Launch-day badge on your site'];
    qs('#prep-logo').outerHTML = plogo(p, 40).replace('class="plogo', 'id="prep-logo" class="plogo');
    const days = Math.max(0, Math.ceil((new Date(p.week_starts_at) - Date.now()) / 864e5));
    qs('#prep').innerHTML = items.map((t, i) => `<label class="check"><input type="checkbox" data-i="${i}" ${prep[i] ? 'checked' : ''}><span class="check__box">${icon('check')}</span>${t}</label>`).join('');
    const upd = () => { const n = prep.filter(Boolean).length; qs('#prog i').style.width = (n / 5 * 100) + '%'; qs('#prep-sub').textContent = `${p.name} · ${n === 5 ? 'ready for launch day' : st(p) === 'live' ? 'live now' : days + ' days to go'}`; };
    upd(); qs('#prep').onchange = e => { prep[+e.target.dataset.i] = e.target.checked; store.set(key, prep); upd(); };
  }
  let makerProduct = null;
  async function renderMakers(p) {
    makerProduct = p; const card = qs('#makers-card'); if (!p) { card.hidden = true; return; } card.hidden = false;
    const ms = await API.makers(p.id);
    qs('#makers').innerHTML = `<div class="row gap-12">${avatar(H.user(), 40)}<div><p class="t-label">${esc(H.user().name)}</p><p class="t-caption c-3" style="font-weight:400">Owner</p></div></div>` + ms.filter(m => m.user.id !== API.uid).map(m => `<div class="row gap-12">${avatar(m.user, 40)}<div class="grow"><p class="t-label">${esc(m.user.name)}</p><p class="t-caption c-3" style="font-weight:400">${esc(m.role)}${m.accepted ? '' : ' · invited'}</p></div><button class="nav__icon" data-rm="${m.user.id}" aria-label="Remove ${esc(m.user.name)}">${icon('x', 'ic-14')}</button></div>`).join('');
  }
  qs('#makers').addEventListener('click', async e => { const b = e.target.closest('[data-rm]'); if (!b || !confirm('Remove this co-maker?')) return; try { await API.removeMaker(makerProduct.id, b.dataset.rm); renderMakers(makerProduct); toast('Co-maker removed'); } catch (err) { H.fail(err); } });
  qs('#rows').addEventListener('click', async e => { const d = e.target.closest('[data-del]'); if (!d) return; if (!confirm('Delete this draft? This can’t be undone.')) return; try { await API.deleteProduct(d.dataset.del); rows = rows.filter(r => r.id !== d.dataset.del); render(); toast('Draft deleted'); } catch (err) { H.fail(err); } });
  qs('#inv-btn').addEventListener('click', () => { qs('#invite').hidden = false; qs('#inv-btn').hidden = true; qs('#inv-email').focus(); });
  qs('#inv-cancel').addEventListener('click', () => { qs('#invite').hidden = true; qs('#inv-btn').hidden = false; });
  qs('#inv-email').addEventListener('input', async e => { const t = e.target.value.trim().replace(/^@/, '').replace(/[%,()]/g, ''); const box = qs('#inv-res'); if (t.length < 2) { box.innerHTML = ''; return; } const r = await API.searchProfiles(t); box.innerHTML = r.filter(x => x.id !== API.uid).map(x => `<button type="button" class="cmdk__opt" style="width:100%" data-uid="${x.id}" data-name="${esc(x.name)}">${avatar(x, 28)}<span class="grow" style="text-align:left">${esc(x.name)} <span class="c-3">@${esc(x.username)}</span></span></button>`).join('') || '<p class="t-caption c-3" style="padding:6px">No makers found. They need a Hentity account first.</p>'; });
  qs('#inv-res').addEventListener('click', async e => { const b = e.target.closest('[data-uid]'); if (!b || !makerProduct) return; try { await API.addMaker(makerProduct.id, b.dataset.uid, 'Maker'); qs('#invite').reset(); qs('#inv-res').innerHTML = ''; qs('#invite').hidden = true; qs('#inv-btn').hidden = false; renderMakers(makerProduct); toast('Invited ' + b.dataset.name); } catch (err) { H.fail(err); } });
  qs('#invite').addEventListener('submit', e => e.preventDefault());
  try { rows = await API.myProducts(); render(); computeRank(); } catch (e) { H.fail(e); }
})();
</script>
</body>
</html>
