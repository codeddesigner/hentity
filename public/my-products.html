<script>
H.mount({ active: 'my-products', tab: 'you' });
(async function () {
  const { qs, qsa, icon, esc, store, toast, verified, plogo, avatar } = H;
  await API.ready;
  if (!API.uid) { location.replace('/signin?next=/my-products'); return; }
  const cur = await API.currentWeek();
  if (cur && qs('#week-sub')) qs('#week-sub').textContent = `Week ${cur.id} · board resets Monday 06:00 WAT`;
  let rows = [];
  const S = { live: 'Live', scheduled: 'Scheduled', changes: 'Changes requested', review: 'In review', draft: 'Draft', rejected: 'Not approved' };
  // One main action per row; the rest live in a "More" menu so the row never overflows the card
  const more = (r, items) => `<button class="nav__icon mp-more" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More for ${esc(r.name)}" data-more='${esc(JSON.stringify(items))}'>${icon('more', 'ic-18')}</button>`;
  document.addEventListener('click', e => {
    const b = e.target.closest('.mp-more'); if (!b) return;
    e.stopPropagation();
    const open = b.getAttribute('aria-expanded') === 'true';
    document.querySelectorAll('[data-menu]').forEach(m => m.remove()); qsa('.mp-more').forEach(x => x.setAttribute('aria-expanded', 'false'));
    if (open) return;
    const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu'); m.dataset.menu = ''; m.style.width = '200px';
    m.innerHTML = JSON.parse(b.dataset.more).map(([ic, t, h]) => `<a class="menu__item" role="menuitem" href="${h}">${icon(ic, 'ic-16')}${t}</a>`).join('');
    m.addEventListener('click', ev => {   // "Team" opens that product in the Team card on this page
      const a = ev.target.closest('a[href^="#team="]'); if (!a) return;
      ev.preventDefault(); m.remove(); b.setAttribute('aria-expanded', 'false');
      const id = a.getAttribute('href').slice(6), sel = qs('#mk-pick');
      sel.value = id; renderMakers(rows.find(r => r.id === id));
      const card = qs('#makers-card'); card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.animate([{ boxShadow: '0 0 0 3px var(--color-accent-default)' }, { boxShadow: '0 0 0 0 transparent' }], { duration: 1400 });
    });
    document.body.appendChild(m);
    const rc = b.getBoundingClientRect(), mh = m.offsetHeight, below = rc.bottom + 6 + mh < innerHeight;
    m.style.top = (scrollY + (below ? rc.bottom + 6 : rc.top - 6 - mh)) + 'px';
    m.style.left = Math.max(8, scrollX + rc.right - 200) + 'px';
    b.setAttribute('aria-expanded', 'true');
    const items = [...m.querySelectorAll('.menu__item')]; items[0] && items[0].focus();
    m.addEventListener('keydown', ev => {
      const i = items.indexOf(document.activeElement);
      if (ev.key === 'ArrowDown') { ev.preventDefault(); items[(i + 1) % items.length].focus(); }
      else if (ev.key === 'ArrowUp') { ev.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      else if (ev.key === 'Escape') { m.remove(); b.setAttribute('aria-expanded', 'false'); b.focus(); }
    });
  });
  const A = {
    live: r => `<a class="btn btn--secondary btn--sm" href="/launch-week?p=${r.slug}">View launch</a>${more(r, [['bar-chart', 'Analytics', `/products/${r.slug}/analytics`], ['edit', 'Edit page', `/products/${r.slug}/edit`], ['users', 'Team', `#team=${r.id}`], ['star', 'Badges', `/studio/${r.slug}/badges`]])}`,
    scheduled: r => `<a class="btn btn--secondary btn--sm" href="/scheduled?p=${r.slug}">Prepare</a>${more(r, [['bar-chart', 'Analytics', `/products/${r.slug}/analytics`], ['edit', 'Edit page', `/products/${r.slug}/edit`], ['calendar', 'Reschedule', `/scheduled?p=${r.slug}#resched`], ['users', 'Team', `#team=${r.id}`], ['star', 'Badges', `/studio/${r.slug}/badges`]])}`,
    changes: r => `<a class="btn btn--accent btn--sm" href="/changes-requested?p=${r.slug}">Fix &amp; resubmit</a>`,
    review: r => `<a class="btn btn--secondary btn--sm" href="/under-review?p=${r.slug}">View status</a>`,
    draft: r => `<a class="btn btn--secondary btn--sm" href="/submit?id=${r.id}">Continue</a><button class="btn btn--ghost btn--sm" type="button" data-del="${r.id}">Delete</button>`,
    rejected: r => `<a class="btn btn--ghost btn--sm" href="/submit?id=${r.id}">View</a>`
  };
  const st = r => r.effective_status || r.status;
  function render() {
    const live = rows.filter(r => st(r) === 'live');
    const votes = live.reduce((a, r) => a + r.upvote_count, 0), comments = rows.reduce((a, r) => a + r.comment_count, 0), followers = rows.reduce((a, r) => a + r.follower_count, 0);
    qs('#s-votes').dataset.countTo = votes; qs('#s-comments').dataset.countTo = comments; qs('#s-followers').dataset.countTo = followers;
    M.countUp(qs('.stats'));
    qs('#rows').innerHTML = rows.length ? rows.map(r => `<tr><td><div class="pname">${plogo(r, 32)}<div class="grow"><p class="t-label row gap-6" style="font-size:14px">${['live', 'scheduled'].includes(st(r)) ? `<a href="/products/${r.slug}">${esc(r.name)}</a>` : esc(r.name || 'Untitled product')}${r.verified ? verified('verified--sm') : ''}</p><p class="t-caption c-3" style="font-weight:400">${esc(r.tagline || 'Last edited ' + H.ago(r.created_at))}</p></div></div></td>
      <td data-l="status"><span class="status status--${st(r) === 'rejected' ? 'draft' : st(r)}">${S[st(r)] || st(r)}</span></td><td data-l="launch" class="c-2">${r.launch_date ? new Date(r.launch_date + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) : r.week_id ? `Week ${r.week_id}` : 'Not booked'}</td><td data-l="votes" class="t-count">${st(r) === 'live' || r.upvote_count ? D.fmt(r.upvote_count) : '–'}</td>
      <td class="actions"><div class="row gap-4" style="justify-content:flex-end;flex-wrap:nowrap">${(A[st(r)] || A.draft)(r)}</div></td></tr>`).join('')
      : `<tr><td colspan="5" style="text-align:center;padding:48px 20px"><p class="t-h4">No products yet</p><p class="t-body-sm c-2" style="margin:6px 0 16px">Start a launch draft. It saves as you go.</p><a class="btn btn--accent btn--sm" href="/submit?new=1">${icon('plus')}Submit a product</a></td></tr>`;
    M.stagger(qs('#rows'));
    const next = rows.find(r => st(r) === 'scheduled') || rows.find(r => st(r) === 'live');
    renderPrep(next);
    // Team: any of your products, live or not (?team=<id> picks one)
    const teamable = rows.filter(r => !['archived', 'rejected'].includes(st(r)));
    const want = new URLSearchParams(location.search).get('team');
    const pickP = teamable.find(r => r.id === want) || (makerProduct && teamable.find(r => r.id === makerProduct.id)) || next || teamable[0];
    qs('#mk-pick-wrap').hidden = teamable.length < 2;
    qs('#mk-pick').innerHTML = teamable.map(r => `<option value="${r.id}"${pickP && r.id === pickP.id ? ' selected' : ''}>${esc(r.name)}</option>`).join('');
    renderMakers(pickP);
  }
  async function computeRank() {
    const live = rows.find(r => st(r) === 'live'); if (!live) { qs('#s-rank').textContent = '—'; qs('#s-rank-sub').textContent = 'no live launch'; return; }
    const b = await API.board({ week: live.week_id }); const rk = b.filter(x => !x.promoted).findIndex(x => x.id === live.id) + 1;
    qs('#s-rank').textContent = '#' + rk; qs('#s-rank-sub').textContent = `of ${b.length} this week`;
  }
  function renderPrep(p) {
    const card = qs('#prep-card'); if (!p) { card.hidden = true; return; } card.hidden = false;
    const key = 'prep.' + p.id; const prep = store.get(key, [((p.media || []).length >= 4), (p.intro || '').length > 40, true, false, false]);
    const items = ['Gallery: 4 images + demo video', 'First comment drafted', 'Co-maker added', 'WhatsApp reminder to your community', 'Launch-day badge on your site'];
    qs('#prep-logo').outerHTML = plogo(p, 40).replace('class="plogo', 'id="prep-logo" class="plogo');
    const days = Math.max(0, Math.ceil(((p.launch_date ? new Date(p.launch_date + 'T05:00:00Z') : new Date(p.week_starts_at)) - Date.now()) / 864e5));
    qs('#prep').innerHTML = items.map((t, i) => `<label class="check"><input type="checkbox" data-i="${i}" ${prep[i] ? 'checked' : ''}><span class="check__box">${icon('check')}</span>${t}</label>`).join('');
    const upd = () => { const n = prep.filter(Boolean).length; qs('#prog i').style.width = (n / 5 * 100) + '%'; qs('#prep-sub').textContent = `${p.name} · ${n === 5 ? 'ready for launch day' : st(p) === 'live' ? 'live now' : days + ' days to go'}`; };
    upd(); qs('#prep').onchange = e => { prep[+e.target.dataset.i] = e.target.checked; store.set(key, prep); upd(); };
  }
  let makerProduct = null;
  async function renderMakers(p) {
    makerProduct = p; const card = qs('#makers-card'); if (!p) { card.hidden = true; return; } card.hidden = false;
    const ms = await API.makers(p.id);
    qs('#makers').innerHTML = `<div class="row gap-12">${avatar(H.user(), 40)}<div><p class="t-label">${esc(H.user().name)}</p><p class="t-caption c-3" style="font-weight:400">Owner</p></div></div>` + ms.filter(m => m.user.id !== API.uid).map(m => `<div class="row gap-12">${avatar(m.user, 40)}<div class="grow"><p class="t-label">${esc(m.user.name)}</p><p class="t-caption c-3" style="font-weight:400">${esc(m.role)}${m.accepted ? '' : m.requested ? ' · asked to join' : ' · invited, not accepted yet'}</p></div><button class="nav__icon" data-rm="${m.user.id}" aria-label="Remove ${esc(m.user.name)}">${icon('x', 'ic-14')}</button></div>`).join('');
  }

  qs('#rows').addEventListener('click', async e => { const d = e.target.closest('[data-del]'); if (!d) return; if (!(await H.confirm('Delete this draft?', { body: 'This can’t be undone.', ok: 'Delete', danger: true }))) return; try { await API.deleteProduct(d.dataset.del); rows = rows.filter(r => r.id !== d.dataset.del); render(); toast('Draft deleted'); } catch (err) { H.fail(err); } });
  qs('#mk-pick').addEventListener('change', e => renderMakers(rows.find(r => r.id === e.target.value)));
  qs('#inv-btn').addEventListener('click', () => { qs('#invite').hidden = false; qs('#inv-btn').hidden = true; qs('#inv-email').focus(); });
  qs('#inv-cancel').addEventListener('click', () => { qs('#invite').hidden = true; qs('#inv-btn').hidden = false; });
  qs('#inv-email').addEventListener('input', async e => { const t = e.target.value.trim().replace(/^@/, '').replace(/[%,()]/g, ''); const box = qs('#inv-res'); if (t.length < 2) { box.innerHTML = ''; return; } const r = await API.searchProfiles(t); box.innerHTML = r.filter(x => x.id !== API.uid).map(x => `<button type="button" class="cmdk__opt" style="width:100%" data-uid="${x.id}" data-name="${esc(x.name)}">${avatar(x, 28)}<span class="grow" style="text-align:left">${esc(x.name)} <span class="c-3">@${esc(x.username)}</span></span></button>`).join('') || '<p class="t-caption c-3" style="padding:6px">No makers found. They need a Hentity account first.</p>'; });
  qs('#inv-res').addEventListener('click', async e => { const b = e.target.closest('[data-uid]'); if (!b || !makerProduct) return; try { const role = await pickInviteRole(); if (!role) return; await API.addMaker(makerProduct.id, b.dataset.uid, role); qs('#invite').reset(); qs('#inv-res').innerHTML = ''; qs('#invite').hidden = true; qs('#inv-btn').hidden = false; renderMakers(makerProduct); toast('Invited ' + b.dataset.name); } catch (err) { H.fail(err); } });
  qs('#invite').addEventListener('submit', e => e.preventDefault());
  function pickInviteRole() {
    return new Promise(res => {
      const el = document.createElement('div'); el.className = 'scrim';
      el.innerHTML = `<form class="modal stack gap-14" role="dialog" aria-modal="true" aria-label="Their role" style="max-width:400px"><h2 class="t-h3">Their role on ${esc(makerProduct.name)}</h2><p class="t-body-sm c-2">They get a notification and show on the product page once they accept.</p>
        <div class="chips" data-single>${['Co-founder', 'Team member', 'Advisor'].map((r, i) => `<button class="chip" type="button" data-r="${r}" aria-pressed="${i === 0}">${icon('check')}${r}</button>`).join('')}</div>
        <div class="row gap-8" style="justify-content:flex-end"><button class="btn btn--ghost" type="button" data-x>Cancel</button><button class="btn btn--primary" type="submit">Send invite</button></div></form>`;
      document.body.append(el);
      const done = v => { el.remove(); document.removeEventListener('keydown', k); res(v); }, k = e => { if (e.key === 'Escape') done(null); };
      document.addEventListener('keydown', k);
      el.addEventListener('click', e => { const c = e.target.closest('[data-r]'); if (c) el.querySelectorAll('[data-r]').forEach(x => x.setAttribute('aria-pressed', x === c)); if (e.target === el || e.target.closest('[data-x]')) done(null); });
      el.querySelector('form').onsubmit = e => { e.preventDefault(); done(el.querySelector('[data-r][aria-pressed="true"]').dataset.r); };
    });
  }
  try { rows = await API.myProducts(); render(); computeRank(); } catch (e) { H.fail(e); }
  // Team requests to approve, and invites to accept
  async function teamPending() {
    const box = qs('#team-pending'); const T = await API.teamPending().catch(() => null); if (!T) return;
    const rowH = (left, title, sub, acts) => `<div class="row gap-12 mp-trow" style="padding:12px 0;border-top:1px solid var(--color-border-default);align-items:center">${left}<div style="min-width:180px;flex:1"><p class="t-label">${title}</p><p class="t-caption c-3" style="font-weight:400">${sub}</p></div><div class="row gap-8 mp-acts">${acts}</div></div>`;
    const items = [...T.requests.map(r => rowH(avatar(r.user, 40), `${esc(r.user.name || r.user.username)} wants to join ${esc(r.product.name)}`, `As ${esc(r.role || 'a maker')} · @${esc(r.user.username)}${r.user.headline ? ' · ' + esc(r.user.headline) : ''} · ${H.ago(r.created_at)}`,
        `<a class="btn btn--ghost btn--sm" href="/makers/${esc(r.user.username)}" target="_blank">Profile</a><button class="btn btn--primary btn--sm" data-tr="${r.product.id}:${r.user.id}:1">${icon('check', 'ic-14')}Approve</button><button class="btn btn--ghost btn--sm" data-tr="${r.product.id}:${r.user.id}:0">Decline</button>`)),
      ...T.invites.map(r => rowH(plogo(r.product, 40), `${esc(r.by ? r.by.name : 'A founder')} invited you to join ${esc(r.product.name)}`, `As ${esc(r.role || 'a maker')} · ${H.ago(r.created_at)}`,
        `<button class="btn btn--primary btn--sm" data-tr="${r.product.id}:${API.uid}:1">${icon('check', 'ic-14')}Accept</button><button class="btn btn--ghost btn--sm" data-tr="${r.product.id}:${API.uid}:0">Decline</button>`))];
    box.hidden = !items.length; if (!items.length) return;
    box.innerHTML = `<p class="t-h4 row gap-8">${icon('users', 'ic-18')}Team</p><p class="t-body-sm c-2" style="margin:4px 0 4px">People who work on your products, and invites to you. Once they’re on the team they show on the product page and can help run it.</p>${items.join('')}`;
    const want = new URLSearchParams(location.search).get('team'); if (want) box.scrollIntoView({ block: 'center' });
  }
  qs('#team-pending').addEventListener('click', async e => {
    const b = e.target.closest('[data-tr]'); if (!b) return; const [pid, uid, ok] = b.dataset.tr.split(':');
    if (ok === '0' && !(await H.confirm(uid === API.uid ? 'Decline this invite?' : 'Decline this request?', { ok: 'Decline' }))) return;
    b.disabled = true;
    try { await API.teamRespond(pid, uid, ok === '1'); toast(ok === '1' ? (uid === API.uid ? 'You’re on the team' : 'Added to the team') : 'Declined'); teamPending(); myTeams(); } catch (er) { H.fail(er); b.disabled = false; }
  });
  // Products you're on as a co-founder or teammate (someone else owns the listing)
  async function myTeams() {
    const box = qs('#my-teams'); const L = (await API.teamProducts().catch(() => [])).filter(x => x.product);
    box.hidden = !L.length; if (!L.length) return;
    box.innerHTML = `<p class="t-h4">Teams you’re on</p><p class="t-body-sm c-2" style="margin-top:4px">Products listed by a co-founder. You show on their page and can help run it.</p>` + L.map(x => `<a class="row gap-12" style="padding:12px 0;border-top:1px solid var(--color-border-default);align-items:center" href="/products/${esc(x.product.slug)}">${plogo(x.product, 36)}<span style="min-width:0;flex:1"><b class="t-label" style="display:block">${esc(x.product.name)}</b><span class="t-caption c-3" style="font-weight:400">${esc(x.role || 'Maker')}${x.product.tagline ? ' · ' + esc(x.product.tagline) : ''}</span></span>${icon('arrow-right', 'ic-16')}</a>`).join('');
  }
  teamPending(); myTeams();
  // Beta tests for these products
  (async () => {
    const box = qs('#my-betas'); if (!rows.length) return;
    const betas = await API.betasOfProducts(rows.map(r => r.id)).catch(() => []);
    box.hidden = false;
    const ph = b => { const k = { open: 'live', full: 'scheduled', picking: 'review', testing: 'review', closed: 'draft', draft: 'draft' }[B.phase(b).k]; return `<span class="status status--${k}">${esc(B.phase(b).label)}</span>`; };
    box.innerHTML = `<div class="row between wrap gap-12"><div><p class="t-h4 row gap-8">${icon('flask', 'ic-18')}Beta programs</p><p class="t-body-sm c-2" style="margin-top:4px">Get real users to try something before launch: one link, a short form, a signed agreement, private access.</p></div><a class="btn btn--accent btn--sm" href="/studio?new=1">${icon('flask', 'ic-14')}New beta program</a></div>`
      + (betas.length ? `<div class="stack" style="margin-top:14px">${betas.map(b => `<a class="row gap-12 between" style="padding:12px 0;border-top:1px solid var(--color-border-default)" href="/studio/${esc((b.product || {}).slug)}/${b.id}"><span class="row gap-12" style="min-width:0">${plogo(b.product || {}, 28)}<span style="min-width:0"><span class="t-label truncate" style="display:block">${esc(b.title)}</span><span class="t-caption c-3" style="font-weight:400">${b.applied_count} applied · ${b.accepted_count}/${b.spots} accepted · ${b.feedback_count} feedback</span></span></span>${ph(b)}</a>`).join('')}</div>` : '');
  })();
})();
</script>
</body>
</html>
