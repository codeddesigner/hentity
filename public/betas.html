<style>
.bb{max-width:1136px;margin:0 auto;padding:28px 56px 96px;box-sizing:content-box}
.bb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}

.bb-filters{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:24px 0 24px}

<body>
<div data-header></div>
<main class="bb" id="main">
  <div id="ptabs"></div>
  <header class="bb-head">
    <div><h1 class="words">Beta tests</h1><p class="bb-sub t-caption c-3" style="display:none;margin-top:2px;font-weight:400" id="sub-m"></p><p>Try products before they launch. Makers pick testers who match, and you get perks for honest feedback.</p></div>
    <a class="btn btn--accent" href="/betas/new" id="request">Request beta testers</a>
  </header>
  <div class="bstats" id="stats" style="margin-top:24px" aria-live="polite"></div>
  <div class="bb-filters">
    <div class="chips" id="plat" data-single></div>
    <label class="bb-match" id="match-wrap" hidden>Only betas I match<span class="toggle"><input type="checkbox" id="only-match" aria-label="Only betas I match"><span class="toggle__track"></span></span></label>
  </div>
  <div class="bgrid" id="grid" aria-live="polite"></div>
</main>
<div data-tabbar></div>
<script src="/assets/beta.js?v=22e15ba0c4"></script>
<script>
H.mount({ active: 'betas', tab: 'products' });
(async function () {
  const { qs, qsa, esc, icon } = H;
  qs('#ptabs').innerHTML = H.productTabs('betas');
  qs('#request').innerHTML = `${icon('flask')}<span class="long">Request beta testers</span><span class="short-l">Request</span>`;
  const st = document.createElement('style'); st.textContent = '.short-l{display:none}@media(max-width:768px){.short-l{display:inline}}'; document.head.append(st);
  M.words(qs('.words'));
  qs('#grid').innerHTML = '<div class="skel" style="height:320px;border-radius:14px"></div>'.repeat(3);
  const filters = ['All', 'Android', 'iOS', 'Web', 'USSD / SMS', 'WhatsApp', 'API'];
  const want = H.params().get('platform') || 'All';
  qs('#plat').innerHTML = filters.map(f => `<button class="chip" type="button" data-chip data-p="${esc(f)}" aria-pressed="${f === want}">${icon('check')}${esc(f)}</button>`).join('');
  await API.ready;
  const [betas, stats, apps] = await Promise.all([API.betas().catch(e => (H.fail(e), [])), API.betaStats().catch(() => null), API.myBetaApps().catch(() => [])]);
  const appOf = new Map(apps.map(a => [a.beta_id, a]));
  const prof = API.profile || {};
  if (API.uid) qs('#match-wrap').hidden = false;
  const n = (v, l) => `<span><b data-count-to="${v || 0}">0</b>${l}</span>`;
  if (stats) {
    qs('#stats').innerHTML = n(stats.open, 'open betas') + (API.uid ? n(stats.match, 'you match') : '') + n(stats.testers_month, 'testers this month') + n(stats.perks, 'perks unlocked');
    qs('#sub-m').textContent = `${stats.open} open${API.uid ? ' · you match ' + stats.match : ''}`;
    M.countUp(qs('#stats'));
  }
  const order = { open: 0, full: 1, picking: 2, testing: 3, closed: 4, draft: 5 };
  function render() {
    const p = (qs('#plat [aria-pressed="true"]') || {}).dataset; const plat = p && p.p && p.p !== 'All' ? p.p : null;
    const only = qs('#only-match').checked;
    let L = betas.filter(b => !plat || (b.platforms || []).includes(plat));
    if (only) L = L.filter(b => { const m = B.match(b, prof); return m.rows.slice(0, 2).every(r => r.ok || r.unknown); });
    L.sort((a, b) => (order[B.phase(a).k] - order[B.phase(b).k]) || new Date(a.closes_at) - new Date(b.closes_at));
    qs('#grid').innerHTML = L.length ? L.map(b => B.card(b, { app: appOf.get(b.id) }).replace('class="bcard card', `class="bcard card${B.phase(b).k === 'closed' ? ' is-closed' : ''}`)).join('')
      : `<div class="empty card" style="grid-column:1/-1;padding:56px 24px;text-align:center"><span class="icon-badge icon-badge--accent" style="margin:0 auto 14px">${icon('flask')}</span><p class="t-h4">${betas.length ? 'No betas match these filters' : 'No beta tests yet'}</p><p class="t-body-sm c-2" style="margin:6px auto 18px;max-width:420px">${betas.length ? 'Try another platform, or turn off “Only betas I match”.' : 'Building something? Post a call for testers and Hentity shows it to people who fit.'}</p>${betas.length ? '' : `<a class="btn btn--accent btn--sm" href="/betas/new">${icon('flask', 'ic-14')}Request beta testers</a>`}</div>`;
    M.stagger(qs('#grid'), '.bcard'); H.contentShown();
  }
  H.bindChips(qs('#plat'), () => { const b = qs('#plat [aria-pressed="true"]'); if (!b) qs('#plat [data-p="All"]').setAttribute('aria-pressed', 'true'); const v = (qs('#plat [aria-pressed="true"]') || {}).dataset.p; history.replaceState(null, '', v && v !== 'All' ? '?platform=' + encodeURIComponent(v) : location.pathname); render(); });
  qs('#only-match').addEventListener('change', render);
  qs('#request').addEventListener('click', e => { if (!API.uid) { e.preventDefault(); location.href = '/signin?next=/betas/new'; } });
  render();
  // live: spots and new betas update without a refresh
  API.live('betas-board', 'betas', null, async ({ eventType, new: nb }) => {
    if (!nb || !nb.id) return;
    const i = betas.findIndex(b => b.id === nb.id);
    if (i > -1) { Object.assign(betas[i], nb); render(); }
    else if (eventType === 'INSERT' && nb.status === 'open') { const full = await API.beta(nb.id).catch(() => null); if (full) { betas.unshift(full); render(); const el = qs(`[data-beta="${nb.id}"]`); el && el.classList.add('flash'); } }
  });
})();
</script>
