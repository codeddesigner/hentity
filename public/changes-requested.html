/* Boot guard: hide the plain server-rendered copy while the app starts, report scripts that fail to load or run,
   and if the app never starts, reload once and then fall back to the readable server copy. */
(function () {
  var d = document.documentElement, n = 0; d.classList.add('js-boot');
  function log(m, s) { if (/view transition|_vercel\/insights/i.test(String(m) + ' ' + String(s || ''))) return; if (n++ > 3) return; try { fetch('https://sislzikhjapilksictxd.supabase.co/rest/v1/client_errors', { method: 'POST', keepalive: true, headers: { apikey: 'sb_publishable_49iWYS0Wr9kVY_PfDQphww_jj9dRaBz', 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ path: location.pathname.slice(0, 300), msg: String(m).slice(0, 600), src: String(s || '').slice(0, 400), ua: navigator.userAgent.slice(0, 300) }) }).catch(function () {}); } catch (e) {} }
  window.addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) log('failed to load', t.src || t.href); else if (e.message) log(e.message, (e.filename || '') + ':' + (e.lineno || '')); }, true);
  // A page that fails while loading its data shows the readable server copy instead of a blank screen
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason || {}; if (/view transition/i.test(r.message || r)) return; log('unhandled: ' + (r.message || r), (r.stack || '').split('\n')[1] || ''); if (!(window.performance && performance.getEntriesByName('hentity:content').length)) d.classList.remove('js-boot'); });
  // Only judge once every script has loaded: on a slow connection they may still be downloading
  function check() { if (window.H && window.API) return; if (document.readyState !== 'complete') return; d.classList.remove('js-boot'); log('app did not start: H=' + !!window.H + ' API=' + !!window.API + ' supabase=' + !!window.supabase, '');
    try { if (!sessionStorage.getItem('h-reload')) { sessionStorage.setItem('h-reload', '1'); location.reload(); } } catch (e) {} }
  window.addEventListener('load', function () { setTimeout(check, 1500); });
  // On a slow connection, show the readable server copy after 3s rather than a blank page
  setTimeout(function () { if (d.classList.contains('js-boot') && document.querySelector('[data-ssr]')) log('content not shown after 3s', 'ready=' + !!(window.performance && performance.getEntriesByName('hentity:ready').length)); d.classList.remove('js-boot'); }, 3000);
})();

<div data-header></div>
<main class="wrap-1248">
  <div class="two-col">
    <div class="stack gap-24">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="/my-products">Dashboard</a><span>/</span><a href="/my-products">Launches</a><span>/</span><span aria-current="page" data-s="name"></span></nav>
      <div class="stack gap-16" style="align-items:flex-start"><span class="status-dot badge--warning">Changes requested</span><h1 class="big-title" id="title">Fixes before approval</h1></div>
      <section class="mod">
        <div class="row gap-12" style="margin-bottom:16px"><span class="avatar" style="background:#000;color:#fff;font-size:12px">H</span><div><p class="t-label">Hentity moderation</p><p class="t-caption c-3" style="font-weight:400" id="note-date"></p></div></div><div id="note"></div>
        
      </section>
      <section class="card" style="padding:4px 20px" id="items"></section>

      <form id="reply-f" class="card card--pad stack gap-12" hidden><label class="field__label" for="msg">Message to moderation</label><textarea class="input" id="msg" rows="3" placeholder="Thanks! The demo account is…"></textarea><div class="row gap-8"><button class="btn btn--primary btn--sm">Send</button><button class="btn btn--ghost btn--sm" type="button" id="reply-x">Cancel</button></div></form>

      <section class="card card--pad"><h2 class="t-label" style="margin-bottom:16px">Progress</h2><div id="tl"></div></section>

    </aside>
  </div>

<div data-tabbar></div>
<script src="/assets/launch.js?v=19c07e1df5"></script>
<script>
H.mount({ active: 'my-products', tab: 'launch' });
(async function () {
  const { qs, qsa, toast, icon, esc } = H;
  let p; try { ({ p } = await L.mine(['changes'])); } catch (e) { return; }
  if (!p) { L.none('No changes requested'); return; }
  qsa('[data-s="name"]').forEach(el => el.textContent = p.name);
  qsa('[data-s="week"]').forEach(el => el.textContent = p.launch_date ? L.dayLabel(p.launch_date) : 'launch day');
  qs('#note').innerHTML = `<p>Thanks ${esc(API.profile.name.split(' ')[0])}, this looks great. ${(p.review_items || []).length ? 'A few things before we can approve:' : ''}</p><p style="margin-top:10px;white-space:pre-wrap">${esc(p.review_note || '')}</p>`;
  qs('#note-date').textContent = L.fmtDate(p.reviewed_at);
  qs('#items').innerHTML = (p.review_items || []).map(it => `<div class="list-row" style="padding:16px 0">${icon('alert-circle', 'ic-18 c-warning')}<div class="grow"><p class="list-row__title">${esc(it.title)}</p><p class="list-row__desc">${esc(it.detail || '')}</p></div><a class="btn btn--secondary btn--sm" href="/submit?id=${p.id}#${esc(it.anchor || 'basics')}">Fix</a></div>`).join('') || `<div class="list-row" style="padding:16px 0"><div class="grow"><p class="list-row__desc">Open your submission, make the changes above and resubmit.</p></div><a class="btn btn--secondary btn--sm" href="/submit?id=${p.id}">Edit</a></div>`;
  qs('#title').textContent = (p.review_items || []).length === 1 ? 'One quick fix before approval' : (p.review_items || []).length === 2 ? 'Two quick fixes before approval' : 'A few fixes before approval';
  qs('#resubmit').href = '/submit?id=' + p.id;
  qs('#tl').innerHTML = L.timeline([['done', 'Submitted for review', L.fmtDate(p.submitted_at)], ['now', 'Changes requested', L.fmtDate(p.reviewed_at)], ['todo', 'Resubmitted', 'Re-reviews usually take about 1 hour'], ['todo', 'Approved & scheduled']]);
  qs('#card').innerHTML = L.card(p);
  qs('#reply').addEventListener('click', () => { qs('#reply-f').hidden = false; qs('#msg').focus(); });
  qs('#reply-x').addEventListener('click', () => qs('#reply-f').hidden = true);
  qs('#reply-f').addEventListener('submit', async e => { e.preventDefault(); const v = qs('#msg').value.trim(); if (!v) return; try { await API.report('product', p.id, 'Maker reply: ' + v); e.target.hidden = true; e.target.reset(); toast('Sent to Hentity moderation'); } catch (err) { H.fail(err); } });
})();
</script>
