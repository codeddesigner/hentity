<script>
/* Boot guard: hide the plain server-rendered copy while the app starts, report scripts that fail to load or run,
   and if the app never starts, reload once and then fall back to the readable server copy. */
(function () {
  var d = document.documentElement, n = 0; d.classList.add('js-boot');
  function log(m, s) { if (/view transition|_vercel\/insights/i.test(String(m) + ' ' + String(s || ''))) return; if (n++ > 3) return; try { fetch('https://sislzikhjapilksictxd.supabase.co/rest/v1/client_errors', { method: 'POST', keepalive: true, headers: { apikey: 'sb_publishable_49iWYS0Wr9kVY_PfDQphww_jj9dRaBz', 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ path: location.pathname.slice(0, 300), msg: String(m).slice(0, 600), src: String(s || '').slice(0, 400), ua: navigator.userAgent.slice(0, 300) }) }).catch(function () {}); } catch (e) {} }
  window.addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) log('failed to load', t.src || t.href); else if (e.message) log(e.message, (e.filename || '') + ':' + (e.lineno || '')); }, true);
  // A page that fails while loading its data shows the readable server copy instead of a blank screen
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason || {}; if (/view transition/i.test(r.message || r)) return; log('unhandled: ' + (r.message || r), (r.stack || '').split('\n')[1] || ''); if (!(window.performance && performance.getEntriesByName('hentity:content').length)) d.classList.remove('js-boot'); });
  // Only judge once every script has loaded: on a slow connection they may still be downloading
  function check() { if (window.H && window.API) return; if (document.readyState !== 'complete') return; d.classList.remove('js-boot'); log('app did not start: H=' + !!window.H + ' API=' + !!window.API + ' supabase=' + !!window.supabase, '');
    try { if (!sessionStorage.getItem('h-reload')) { sessionStorage.setItem('h-reload', '1'); location.reload(); } } catch (e) {} }
  window.addEventListener('load', function () { setTimeout(check, 1500); });
  // On a slow connection, show the readable server copy after 3s rather than a blank page
  setTimeout(function () { if (d.classList.contains('js-boot') && document.querySelector('[data-ssr]')) log('content not shown after 3s', 'ready=' + !!(window.performance && performance.getEntriesByName('hentity:ready').length)); d.classList.remove('js-boot'); }, 3000);
})();
</script>

<title>Founder spotlight | Hentity</title>
<style>
/* Founder spotlight: the founder's private answer page (/spotlight/<id>) and the published story (/spotlight/<slug>) */
.sp{max-width:720px;margin:0 auto;padding:32px 24px 96px}
.sp-eye{font:500 12px/16px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-default,#ff5b14)}
.sp h1{font-size:32px;line-height:38px;font-weight:600;letter-spacing:-.025em;margin-top:10px}
.sp-lead{font-size:17px;line-height:26px;color:var(--color-text-secondary);margin-top:12px}
.sp-note{display:flex;gap:12px;margin-top:24px;padding:16px;border:1px solid var(--color-border-default);border-radius:14px;background:var(--color-bg-canvas)}
.sp-note p{font-size:14px;line-height:21px;white-space:pre-wrap}.sp-note small{display:block;font-size:12px;color:var(--color-text-tertiary);margin-bottom:4px}
.sp-h{width:36px;height:36px;border-radius:50%;background:#0a0a0a;color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.sp-priv{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13px;line-height:18px;color:var(--color-text-secondary)}.sp-priv .ic{width:14px;height:14px;flex:none;margin-top:2px}
.sp-prog{position:sticky;top:0;z-index:5;background:var(--color-bg-subtle,#fafafa);padding:14px 0 10px;margin-top:20px;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--color-text-tertiary)}
.sp-prog .bar{flex:1;height:4px;border-radius:2px;background:var(--color-bg-muted,#eee);overflow:hidden}.sp-prog .bar i{display:block;height:100%;background:#ff5b14;transition:width .3s}
.sp-qs{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.sp-q{padding:18px;border:1px solid var(--color-border-default);border-radius:14px;background:var(--color-bg-canvas)}
.sp-q label{display:flex;gap:10px;font-size:15px;line-height:21px;font-weight:600}.sp-q label span.n{font:500 12px/21px var(--font-mono);color:var(--color-text-tertiary);min-width:18px}
.sp-q .hint{font-size:13px;line-height:18px;color:var(--color-text-tertiary);margin:4px 0 0 28px}
.sp-q textarea{margin-top:12px;width:100%;min-height:96px;resize:vertical;font-size:15px;line-height:22px}
.sp-q .opt{font-size:12px;font-weight:400;color:var(--color-text-tertiary)}
.sp-send{margin-top:20px;padding:18px;border-radius:14px;background:var(--color-bg-canvas);border:1px solid var(--color-border-default)}
.sp-send .check{align-items:flex-start}.sp-acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.sp-saved{font-size:12px;color:var(--color-text-tertiary)}
.sp-done{text-align:center;padding:24px 8px}.sp-done .ic-big{width:56px;height:56px;border-radius:50%;background:#e3f9ee;color:#127a45;display:grid;place-items:center;margin:0 auto 14px}
/* the story */
.st-by{display:flex;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}.st-by b{font-size:14px;font-weight:600}.st-by small{display:block;font-size:13px;color:var(--color-text-tertiary)}
.st-prod{display:flex;align-items:center;gap:12px;margin-top:24px;padding:14px;border:1px solid var(--color-border-default);border-radius:14px;background:var(--color-bg-canvas)}
.st-body{margin-top:36px}.st-body h2{font-size:18px;line-height:26px;font-weight:600;letter-spacing:-.01em;margin-top:32px}.st-body h2:first-child{margin-top:0}
.st-body p{font-size:17px;line-height:28px;color:var(--color-text-primary);margin-top:10px;white-space:pre-wrap}
.st-share{display:flex;gap:8px;flex-wrap:wrap;margin-top:40px;padding-top:24px;border-top:1px solid var(--color-border-default)}
.st-banner{padding:10px 14px;border-radius:10px;background:#fff3d1;color:#8a5a00;font-size:13px;margin-bottom:20px}
@media (max-width:768px){.sp{padding:20px 16px 96px}.sp h1{font-size:26px;line-height:32px}.st-body p{font-size:16px;line-height:26px}}
</style>
<meta name="description" content="Discover the best new products built by African makers. A fresh launch board every Monday.">
<link rel="canonical" href="https://hentity.com/spotlight">
<meta property="og:title" content="Founder spotlight | Hentity">
<meta property="og:description" content="Discover the best new products built by African makers. A fresh launch board every Monday.">
<meta property="og:url" content="https://hentity.com/spotlight">
<meta property="og:type" content="website">
<meta property="og:image" content="https://hentity.com/og.png?v=5f906702f6">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<meta name="twitter:title" content="Founder spotlight | Hentity">

<meta name="twitter:image" content="https://hentity.com/og.png?v=5f906702f6">
</head>
<body class="subtle">
<div data-header></div>
<main class="sp" id="main"><div class="skel" style="height:360px;border-radius:16px"></div></main>
<div data-tabbar></div>
<script>
H.mount({ active: '', tab: '' });
(async function () {
  const { qs, qsa, esc, icon, toast, avatar, plogo } = H;
  const root = qs('#main');
  const key = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
  await API.ready.catch(() => {});
  let S;
  try { S = await API.sp.get(key); } catch (e) { S = null; }
  const isId = /^[0-9a-f-]{36}$/.test(key);
  if (!S) {
    if (isId && !API.uid) { location.href = '/signin?next=' + encodeURIComponent(location.pathname); return; }
    root.innerHTML = `<div class="sp-done"><h1 class="t-h2">This spotlight isn’t here</h1><p class="t-body-sm c-2" style="margin-top:8px">${isId ? 'It may belong to another account. Sign in with the account the email was sent to.' : 'It may have been taken down, or the link is wrong.'}</p><a class="btn btn--secondary btn--sm" href="/news" style="margin-top:16px">Read more stories</a></div>`;
    H.contentShown(); return;
  }
  const F = S.founder || {}, P = S.product;
  const first = (F.name || F.username || '').split(' ')[0];

  if (S.status === 'withdrawn') { root.innerHTML = `<div class="sp-done"><h1 class="t-h2">These questions are closed</h1><p class="t-body-sm c-2" style="margin-top:8px">The Hentity team closed this spotlight. Thanks for your time.</p></div>`; H.contentShown(); return; }
  if (S.mine && ['sent', 'answered', 'declined'].includes(S.status) && !S.admin) return form();
  if (S.status === 'published' || S.admin) return story();
  form();

  // ---------------------------------------------------------------- the founder answers
  function form() {
    document.title = 'Your spotlight questions | Hentity';
    if (S.status === 'declined') { root.innerHTML = `<div class="sp-done"><h1 class="t-h2">You passed on this one</h1><p class="t-body-sm c-2" style="margin-top:8px">No problem. If you change your mind, reply to the email and we’ll reopen it.</p></div>`; H.contentShown(); return; }
    const A = Object.assign({}, S.answers || {});
    const Q = S.questions || [];
    const answered = () => Q.filter(q => (A[q.id] || '').trim().length > 1).length;
    root.innerHTML = `<p class="sp-eye">Founder spotlight</p><h1>We’d like to feature ${esc(P ? P.name : 'you')}</h1>
      <p class="sp-lead">${Q.length} short questions about what you’re building. Answer in your own words; short is fine. Your answers save as you type, so you can come back later.</p>
      ${S.intro ? `<div class="sp-note"><span class="sp-h">H</span><div><small>From the Hentity team${S.due_at ? ` · if you can, by ${new Date(S.due_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long' })}` : ''}</small><p>${esc(S.intro)}</p></div></div>` : ''}
      <p class="sp-priv">${icon('lock')}<span>Only the Hentity team sees your answers. We may edit them for length and clarity, and we’ll only publish your spotlight if you say yes at the end.</span></p>
      ${S.status === 'answered' ? `<p class="st-banner" style="margin-top:16px;background:#e3f9ee;color:#127a45">You sent your answers ${H.ago(S.answered_at)}. You can still change them until the story is published.</p>` : ''}
      <div class="sp-prog"><span id="pc">${answered()} of ${Q.length} answered</span><span class="bar"><i id="pb" style="width:${answered() / Q.length * 100}%"></i></span><span class="sp-saved" id="sv"></span></div>
      <form id="f"><div class="sp-qs">${Q.map((q, i) => `<div class="sp-q"><label for="a-${q.id}"><span class="n">${i + 1}</span><span>${esc(q.q)}${q.optional ? ' <span class="opt">optional</span>' : ''}</span></label>${q.hint ? `<p class="hint">${esc(q.hint)}</p>` : ''}
          <textarea class="input" id="a-${q.id}" data-q="${q.id}" maxlength="4000" rows="4">${esc(A[q.id] || '')}</textarea></div>`).join('')}</div>
        <div class="sp-send"><label class="check"><input type="checkbox" id="ok"${S.consent ? ' checked' : ''}><span class="check__box">${icon('check')}</span><span class="t-body-sm">Hentity can publish my answers, edited for length and clarity, as a founder spotlight on hentity.com and in News.</span></label>
          <div class="sp-acts"><button class="btn btn--primary" type="submit" id="go">${icon('send')}${S.status === 'answered' ? 'Update my answers' : 'Send my answers'}</button>${S.status === 'sent' ? '<button class="link t-body-sm c-3" type="button" id="no">Not right now</button>' : ''}</div></div></form>`;
    H.contentShown();
    const grow = t => { t.style.height = 'auto'; t.style.height = Math.max(96, t.scrollHeight + 2) + 'px'; };
    qsa('[data-q]').forEach(grow);
    let timer, dirty = false;
    const status = t => { qs('#sv').textContent = t; };
    const save = async () => { if (!dirty) return; dirty = false; status('Saving…'); try { await API.sp.answer(S.id, A, false); status('Saved'); } catch (e) { status(''); H.fail(e); } };
    qs('#f').addEventListener('input', e => { const t = e.target.closest('[data-q]'); if (!t) return; A[t.dataset.q] = t.value; grow(t); dirty = true;
      const n = answered(); qs('#pc').textContent = `${n} of ${Q.length} answered`; qs('#pb').style.width = (n / Q.length * 100) + '%'; status(''); clearTimeout(timer); timer = setTimeout(save, 1200); });
    window.addEventListener('pagehide', save); document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
    qs('#f').onsubmit = async e => {
      e.preventDefault(); clearTimeout(timer);
      const miss = Q.find(q => !q.optional && (A[q.id] || '').trim().length < 2);
      if (miss) { toast('Answer every question that isn’t marked optional', 'error'); const t = qs(`#a-${miss.id}`); t.scrollIntoView({ block: 'center', behavior: 'smooth' }); t.focus(); return; }
      const ok = qs('#ok').checked;
      if (!ok && !(await H.confirm('Send without agreeing to publish?', { body: 'The Hentity team will read your answers but can’t publish your spotlight unless you tick the box.', ok: 'Send anyway', cancel: 'Go back' }))) return;
      const b = qs('#go'); b.disabled = true;
      try { await API.sp.answer(S.id, A, true, ok); dirty = false; done(ok); } catch (er) { H.fail(er); b.disabled = false; }
    };
    qs('#no') && (qs('#no').onclick = async () => { if (!(await H.confirm('Pass on this spotlight?', { body: 'We won’t ask again for this one. You can reply to the email if you change your mind.', ok: 'Not right now' }))) return; try { await API.sp.decline(S.id); location.reload(); } catch (e) { H.fail(e); } });
  }
  function done(ok) {
    window.scrollTo({ top: 0 });
    root.innerHTML = `<div class="sp-done"><span class="ic-big">${icon('check', 'ic-24')}</span><h1 class="t-h2">Thanks, ${esc(first)}</h1>
      <p class="t-body c-2" style="margin-top:10px;max-width:460px;margin-left:auto;margin-right:auto">${ok ? 'Your answers are with the Hentity team. We’ll edit them into a story and let you know when it’s live.' : 'Your answers are with the Hentity team. We won’t publish anything unless you agree.'}</p>
      <div class="row gap-8" style="justify-content:center;margin-top:20px"><a class="btn btn--secondary btn--sm" href="${location.pathname}">Review my answers</a><a class="btn btn--primary btn--sm" href="/">Back to Hentity</a></div></div>`;
  }

  // ---------------------------------------------------------------- the published story (or the admin's preview)
  function story() {
    const ans = S.published_answers || Object.fromEntries((S.questions || []).map(q => [q.id, (S.edits && S.edits[q.id]) || (S.answers || {})[q.id] || '']));
    const title = S.title || `${F.name}${P ? ' on building ' + P.name : ''}`;
    document.title = `${title} | Founder spotlight | Hentity`;
    const url = location.origin + '/spotlight/' + (S.slug || S.id);
    const when = S.published_at ? new Date(S.published_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
    root.innerHTML = `${S.status !== 'published' ? `<p class="st-banner">Preview: this isn’t published yet. Only you can see it.</p>` : S.mine ? `<p class="st-banner" style="background:#e3f9ee;color:#127a45">Your spotlight is live. Share it with your customers and investors.</p>` : ''}
      <p class="sp-eye">Founder spotlight${when ? ' · ' + when : ''}</p><h1>${esc(title)}</h1>${S.dek ? `<p class="sp-lead">${esc(S.dek)}</p>` : ''}
      <div class="st-by">${avatar(F, 44)}<div><b class="row gap-4" style="display:inline-flex;align-items:center">${esc(F.name || F.username)}${F.is_verified ? H.verified('') : ''}</b><small>${esc([F.headline, F.city].filter(Boolean).join(' · ') || '@' + F.username)}</small></div><a class="btn btn--secondary btn--sm" href="/makers/${esc(F.username)}" style="margin-left:auto">Profile</a></div>
      <div class="st-body">${(S.questions || []).filter(q => (ans[q.id] || '').trim()).map(q => `<h2>${esc(q.q)}</h2><p>${esc(ans[q.id])}</p>`).join('')}</div>
      ${P ? `<a class="st-prod" href="/products/${esc(P.slug)}">${plogo(P, 44)}<span style="min-width:0;flex:1"><b class="t-label">${esc(P.name)}</b><span class="t-caption c-3" style="display:block;font-weight:400">${esc(P.tagline || '')}</span></span><span class="btn btn--primary btn--sm">See on Hentity</span></a>` : ''}
      <div class="st-share"><a class="btn btn--secondary btn--sm" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}">${icon('share', 'ic-14')}LinkedIn</a>
        <a class="btn btn--secondary btn--sm" target="_blank" rel="noopener" href="https://x.com/intent/post?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}">${icon('share', 'ic-14')}X</a>
        <a class="btn btn--secondary btn--sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(title + ' ' + url)}">${icon('share', 'ic-14')}WhatsApp</a>
        <button class="btn btn--ghost btn--sm" type="button" id="cp">${icon('link', 'ic-14')}Copy link</button>${S.admin ? `<a class="btn btn--ghost btn--sm" href="/admin#spotlights/${S.id}" style="margin-left:auto">Edit in admin</a>` : ''}</div>`;
    H.contentShown();
    qs('#cp').onclick = async () => { try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch (e) { H.ask('Copy this link', { value: url, ok: 'Done', optional: true }); } };
  }
})();
</script>
