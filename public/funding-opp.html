<script>
/* Boot guard: hide the plain server-rendered copy while the app starts, report scripts that fail to load or run,
   and if the app never starts, reload once and then fall back to the readable server copy. */
(function () {
  var d = document.documentElement, n = 0; d.classList.add('js-boot');
  function log(m, s) { if (n++ > 3) return; try { fetch('https://sislzikhjapilksictxd.supabase.co/rest/v1/client_errors', { method: 'POST', keepalive: true, headers: { apikey: 'sb_publishable_49iWYS0Wr9kVY_PfDQphww_jj9dRaBz', 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ path: location.pathname.slice(0, 300), msg: String(m).slice(0, 600), src: String(s || '').slice(0, 400), ua: navigator.userAgent.slice(0, 300) }) }).catch(function () {}); } catch (e) {} }
  window.addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) log('failed to load', t.src || t.href); else if (e.message) log(e.message, (e.filename || '') + ':' + (e.lineno || '')); }, true);
  // A page that fails while loading its data shows the readable server copy instead of a blank screen
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason || {}; log('unhandled: ' + (r.message || r), (r.stack || '').split('\n')[1] || ''); if (!(window.performance && performance.getEntriesByName('hentity:content').length)) d.classList.remove('js-boot'); });
  function check() { if (window.H && window.API) return; d.classList.remove('js-boot'); log('app did not start: H=' + !!window.H + ' API=' + !!window.API + ' supabase=' + !!window.supabase, '');
    try { if (!sessionStorage.getItem('h-reload')) { sessionStorage.setItem('h-reload', '1'); location.reload(); } } catch (e) {} }
  window.addEventListener('load', function () { setTimeout(check, 1500); });
  setTimeout(function () { if (d.classList.contains('js-boot') && document.querySelector('[data-ssr]')) log('content not shown after 5s', 'ready=' + !!(window.performance && performance.getEntriesByName('hentity:ready').length)); d.classList.remove('js-boot'); check(); }, 5000);
})();

<style>
.fo{max-width:1112px;margin:0 auto;padding:32px 40px 96px;box-sizing:content-box;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start}
.fo .card{border-radius:16px}
.fo-sec{padding:22px 22px 20px;margin-top:16px}
.fo-h{font-size:20px;font-weight:600;letter-spacing:-.01em}
.fo-crit{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:14px}
.fo-crit .ev{margin-left:auto;color:var(--color-text-tertiary);font-size:13px;text-align:right}
.fo-judge{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--color-text-secondary)}.fo-judge b{color:var(--color-text-primary);font-weight:500;font-variant-numeric:tabular-nums}
.fo-panel{padding:24px;position:sticky;top:24px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px -8px rgba(16,24,40,.10)}
.fo-panel hr{border:0;border-top:1px solid var(--color-border-default);margin:12px 0}
.fo-sub{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
@media (max-width:1000px){.fo{grid-template-columns:minmax(0,1fr)}.fo-panel{position:static}}
@media (max-width:768px){.fo{padding:16px 16px 32px;gap:12px}.fo h1.t-h2{font-size:24px;line-height:30px}.fo .fu-chip{white-space:normal;height:auto;min-height:24px;padding:3px 8px}.fo-sec,.fo-panel{padding:18px}.fo-crit .ev{display:none}}
</style>

<body>
<div data-header></div>
<main id="main" class="fo"><div class="skel" style="height:520px;border-radius:16px"></div><div class="skel" style="height:520px;border-radius:16px"></div></main>
<div data-tabbar></div>
<script src="/assets/funding.js?v=2e5cfa330e"></script>
<script>
H.mount({ active: 'funding', tab: 'you' });
(async function () {
  const { qs, esc, icon, toast } = H;
  const root = qs('#main');
  await API.ready;
  if (!API.uid) { location.href = '/signin?next=' + encodeURIComponent(location.pathname + location.search); return; }
  const oid = location.pathname.split('/').filter(Boolean)[1];
  const products = await API.myFundingProducts().catch(() => []);
  if (!products.length) { location.href = '/funding'; return; }
  let pid = FU.pickPid(products), O;
  async function load() {
    try { O = await API.fundingOpp(oid, pid); } catch (e) { root.innerHTML = `<div class="card card--pad" style="grid-column:1/-1;text-align:center;padding:48px"><p class="t-h4">${esc(e.message || 'Not found')}</p><a class="btn btn--secondary btn--sm" href="/funding" style="margin-top:16px">Back to Funding</a></div>`; return; }
    document.title = O.name + ' | Hentity Funding';
    render();
  }
  const isGrant = () => O.mode === 'grant';
  function render() {
    const p = O.product, t = O.track, open = FU.isOpen(O);
    const chips = [`<span class="fu-chip fu-chip--green">${esc(O.amount_text || '—')}${O.amount_note ? ' · ' + esc(O.amount_note.split('·')[0].trim().toLowerCase()) : ''}</span>`, FU.deadlineChip(O, true),
      O.slots_text ? `<span class="fu-chip">${esc(O.slots_text)}</span>` : '', O.decision_by ? `<span class="fu-chip">Decision by ${FU.fmtDate(O.decision_by)}</span>` : '',
      !isGrant() && O.stages.length ? `<span class="fu-chip">${esc(O.stages.join(', '))}</span>` : ''].join('');
    const back = isGrant() ? ['Grants', '/funding'] : ['Investors', '/funding?tab=equity'];
    const who = O.org && O.org !== O.name ? O.org : O.name;
    root.innerHTML = `<div>
      <a class="row gap-8 t-body-sm c-2" href="${back[1]}" style="margin-bottom:14px">${icon('arrow-left', 'ic-16')}${back[0]}</a>
      <section class="card fo-sec" style="margin-top:0"><div class="row gap-16" style="align-items:center">${FU.logo(O, 48)}<div style="min-width:0"><p class="t-caption c-3" style="font-weight:400">${esc(O.org || FU.KIND[O.kind])}</p><h1 class="t-h2" style="margin-top:2px">${esc(O.name)}</h1></div></div>
        <div class="fu-chips" style="margin-top:14px">${chips}</div>
        ${O.description ? `<p class="t-body-sm c-2" style="margin-top:14px">${esc(O.description)}</p>` : ''}
        ${!open ? `<p class="t-body-sm" style="margin-top:12px"><b style="font-weight:500">${esc(O.round_note)}</b></p>` : ''}
        ${O.source_url ? `<p class="t-caption c-3" style="font-weight:400;margin-top:12px">Details checked by Hentity${O.checked_at ? ' on ' + FU.fmtDate(O.checked_at) : ''} · <a class="link" href="${esc(O.source_url)}" target="_blank" rel="noopener">source</a></p>` : ''}${API.isAdmin ? `<button class="btn btn--secondary btn--sm" type="button" id="fo-edit" style="margin-top:12px">${icon('edit', 'ic-14')}Edit listing</button>` : ''}</section>
      <section class="card fo-sec"><div class="row between gap-12 wrap"><h2 class="fo-h">Who can apply</h2><span class="badge ${O.meets === O.total ? 'badge--success' : ''}">${O.meets === O.total ? icon('check', 'ic-12') : ''}${esc(p.name)} meets ${O.meets} of ${O.total}</span></div>
        <div style="margin-top:10px">${O.checks.map(c => `<div class="fo-crit">${c.ok ? `<span class="fu-ok">${icon('check', 'ic-12')}</span>` : `<span class="fu-no">${icon('x', 'ic-12')}</span>`}<span>${esc(c.label)}</span><span class="ev">${esc(c.evidence || '')}</span></div>`).join('')}</div>
        ${O.meets < O.total ? `<p class="t-caption c-3" style="font-weight:400;margin-top:8px">Something wrong? Update your <a class="link link--accent" href="/products/${p.slug}/edit">product page</a>.</p>` : ''}</section>
      ${(O.judging || []).length ? `<section class="card fo-sec"><h2 class="fo-h">How it’s judged</h2><div style="margin-top:10px">${O.judging.map(j => `<div class="fo-judge"><span>${esc(j.label)}</span><b>${esc(String(j.pct))}%</b></div>`).join('')}</div></section>` : ''}
    </div>
    <aside class="card fo-panel" id="panel">
      <h2 class="fo-h">Apply on ${isGrant() ? 'the funder’s' : 'their'} site</h2>
      <p class="t-body-sm c-2" style="margin:12px 0 12px">Applications go through ${esc(who)} directly. Hentity helps you get ready and keeps track.</p>
      ${FU.linkBox(O)}
      <a class="btn btn--accent btn--block" style="margin-top:12px" href="${esc(FU.applyUrl(O))}" target="_blank" rel="noopener" id="go">${icon('arrow-up-right', 'ic-16')}${open ? 'Go to application' : 'Open their site'}</a>
      <hr>
      <div class="fo-sub" style="margin-bottom:12px"><p class="t-label">Get ready</p><p class="t-caption c-3" style="font-weight:400">What they usually ask for</p></div>
      <div id="ready">${FU.readyList(O, p, O.mode, true)}</div>
      <hr>
      <p class="t-label">Keep track</p>
      ${O.deadline ? `<label class="row between gap-12" style="margin-top:12px;cursor:pointer"><span><span class="t-body-sm" style="display:block">Remind me before it closes</span><span class="t-caption c-3" style="font-weight:400">Email and app, 3 days and 1 day before ${FU.fmtDate(O.deadline)}</span></span><span class="toggle"><input type="checkbox" id="remind"${!t || t.remind ? ' checked' : ''}${t && t.status === 'applied' ? ' disabled' : ''}><span class="toggle__track"></span></span></label>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px">
        <button class="btn btn--secondary" type="button" id="save" aria-pressed="${!!t}">${icon('bookmark', 'ic-16')}${t ? 'Saved' : 'Save'}</button>
        <button class="btn btn--secondary" type="button" id="applied" aria-pressed="${!!(t && t.status === 'applied')}">${icon('check', 'ic-16')}${t && t.status === 'applied' ? 'Applied' : 'I’ve applied'}</button></div>
      <p class="t-caption c-3" style="font-weight:400;margin-top:12px">${t && t.status === 'applied' ? `Marked applied ${H.ago(t.applied_at)}.${O.decision_by ? ` We’ll remind you when results are due (${FU.fmtDate(O.decision_by)}).` : ''} <button class="link" type="button" id="unapply">Undo</button>` : `Mark it applied to move it to “Applied”${O.decision_by ? ` and get a reminder when results are due (${FU.fmtDate(O.decision_by)})` : ''}.`}</p>
    </aside>`;
    if (products.length > 1) {
      const s = document.createElement('label'); s.className = 'fu-sel'; s.style.marginTop = '12px';
      s.innerHTML = `<select aria-label="Product">${products.map(x => `<option value="${x.id}"${x.id === pid ? ' selected' : ''}>Matching ${esc(x.name)}</option>`).join('')}</select>${icon('chevron-down', 'ic-14')}`;
      s.querySelector('select').onchange = e => { pid = e.target.value; FU.setPid(pid); load(); };
      root.querySelector('.fo-sec').append(s);
    }
    H.contentShown && H.contentShown();
  }
  const track = async (patch, msg) => { try { await API.fundingTrack(oid, pid, patch); msg && toast(msg); await load(); } catch (e) { H.fail(e); } };
  FU.bindReady(root, { get o() { return O; }, get p() { return O.product; }, get pid() { return pid; }, reload: load });
  root.addEventListener('click', async e => {
    if (e.target.closest('#fo-edit')) { FU.editSheet(O, load); return; }
    if (e.target.closest('#save')) { if (O.track) { if (O.track.status === 'applied' && !confirm('Remove this from your tracker? It’s marked as applied.')) return; try { await API.fundingUntrack(oid); toast('Removed from saved'); await load(); } catch (er) { H.fail(er); } } else { const r = root.querySelector('#remind'), on = r ? r.checked : true; track({ status: 'saved', remind: on }, on ? 'Saved. We’ll remind you before it closes.' : 'Saved'); } return; }
    if (e.target.closest('#applied')) { if (!O.track || O.track.status !== 'applied') track({ status: 'applied', applied_at: new Date().toISOString() }, 'Marked as applied'); return; }
    if (e.target.closest('#unapply')) { track({ status: 'saved', applied_at: null }, 'Moved back to saved'); return; }
    // Opening their site saves it, so it shows in the tracker and reminders work
    if (e.target.closest('#go') && !O.track) API.fundingTrack(oid, pid, { status: 'saved', remind: true }).then(load).catch(() => {});
  });
  root.addEventListener('change', e => { if (e.target.id === 'remind' && !O.track) return;   // not saved yet: the switch applies when they save
    if (e.target.id === 'remind') track({ remind: e.target.checked, status: O.track ? O.track.status : 'saved' }, e.target.checked ? 'Reminders on' : 'Reminders off'); });
  load();
})();
</script>
</body>
