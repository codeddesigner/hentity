/* Product analytics (Figma 249:3445): private to the product's team */
body{background:var(--color-bg-subtle)}
.sidebar{background:var(--color-bg-canvas)}
.an{max-width:1112px;margin:0 auto;padding:28px 40px 96px;box-sizing:content-box;
  --c-views:#4FA8FF;--c-clicks:#FF5B14;--c-founders:#FF8F57;--c-builders:#4FA8FF;--c-testers:#16B888;--c-investors:#9B87FF;--c-anon:#D4D4D8;--c-cities:#16B888}
:root[data-theme="dark"] .an{--c-views:#3B8FE0;--c-clicks:#F0571A;--c-founders:#E06A33;--c-builders:#3B8FE0;--c-testers:#12A078;--c-investors:#8270E6;--c-anon:#52525B;--c-cities:#12A078}
.an-crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text-tertiary)}
.an-crumbs a:hover{color:var(--color-text-primary)}.an-crumbs b{color:var(--color-text-primary);font-weight:500}
.an-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-top:16px}
.an-id{display:flex;gap:14px;align-items:center;min-width:0}
.an-id .plogo{width:48px;height:48px;border-radius:12px;font-size:18px}
.an-id h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.an-lock{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;background:var(--color-bg-muted);font-size:12px;font-weight:500;color:var(--color-text-secondary);letter-spacing:0}
.an-sub{font-size:13px;color:var(--color-text-tertiary);margin-top:2px}
.an-tabs{display:flex;gap:24px;margin-top:20px;border-bottom:1px solid var(--color-border-default)}
.an-tabs a{padding:10px 0;font-size:14px;color:var(--color-text-tertiary);border-bottom:2px solid transparent;margin-bottom:-1px}
.an-tabs a:hover{color:var(--color-text-primary)}
.an-tabs a[aria-current]{color:var(--color-text-primary);font-weight:500;border-color:var(--color-text-primary)}
.an-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 16px;flex-wrap:wrap}
.an-bar .chips{gap:8px}
.an-upd{font-size:13px;color:var(--color-text-tertiary)}
.an-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--color-bg-canvas);border:1px solid var(--color-border-default);font-size:13px;color:var(--color-text-secondary);margin-bottom:16px}

.an-svg{width:100%;height:240px;display:block;overflow:visible}
.an-svg .grid line{stroke:var(--color-border-default);stroke-width:1}
.an-svg text{fill:var(--color-text-tertiary);font-size:11px;font-family:inherit}
.an-plot{position:relative}

.an-tip.on{opacity:1}

.an-grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.an-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.an-fun{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.an-fun .row1{display:flex;justify-content:space-between;font-size:14px}
.an-fun .row1 b{font-family:var(--font-mono,ui-monospace,monospace);font-weight:500}
.an-fun i{display:block;height:22px;border-radius:4px;margin-top:6px;min-width:4px;transition:width .8s var(--ease-out,ease)}

.an-ref{display:flex;gap:8px;align-items:flex-start;margin-top:18px;padding:10px 12px;border-radius:10px;background:var(--color-bg-subtle);font-size:12.5px;color:var(--color-text-secondary)}
.an-bars{margin-top:14px;display:flex;flex-direction:column;gap:10px}

.an-b .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-b i{display:block;height:8px;border-radius:99px;background:var(--color-bg-muted);overflow:hidden}
.an-b em{display:block;height:100%;border-radius:inherit;transform-origin:left;animation:grow-x .8s var(--ease-out,ease) both}
.an-b .n{text-align:right;font-family:var(--font-mono,ui-monospace,monospace);font-variant-numeric:tabular-nums}
.an-stack{display:flex;height:24px;border-radius:6px;overflow:hidden;gap:2px;margin-top:14px;background:var(--color-bg-canvas)}
.an-stack span{transform-origin:left;animation:grow-x .8s var(--ease-out,ease) both}
.an-roles{margin-top:14px;display:flex;flex-direction:column;gap:9px;font-size:13.5px}
.an-roles div{display:flex;align-items:center;gap:8px}
.an-roles i{width:10px;height:10px;border-radius:3px;flex:none}
.an-roles b{margin-left:auto;font-family:var(--font-mono,ui-monospace,monospace);font-weight:500}
.an-inv{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:10px;background:#F3EEFF;color:#5B21B6;font-size:12.5px}
:root[data-theme="dark"] .an-inv{background:#24173f;color:#c4b5fd}
.an-dev{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:12.5px;color:var(--color-text-tertiary)}
.an-empty{font-size:13px;color:var(--color-text-tertiary);margin-top:14px}
.an-mhead{display:none}
.an-table{margin-top:10px}
.an-table summary{font-size:12.5px;color:var(--color-text-tertiary);cursor:pointer}
.an-table table{width:100%;margin-top:8px;font-size:12.5px;border-collapse:collapse}
.an-table td,.an-table th{padding:4px 6px;text-align:right;border-bottom:1px solid var(--color-border-default)}.an-table th:first-child,.an-table td:first-child{text-align:left}
@media (max-width:1100px){.an-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.an-grid3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.an-grid2,.an-grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:768px){
  .an{padding:8px 16px 32px}
  .an-crumbs,.an-head,.an-tabs{display:none}
  .an-mhead{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
  .an-mhead .plogo{width:36px;height:36px;border-radius:9px}
  .an-mhead p{font-size:12.5px;color:var(--color-text-tertiary)}
  .an-bar{margin-top:4px}.an-upd{display:none}
  .an-bar .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;width:calc(100% + 32px)}.an-bar .chips::-webkit-scrollbar{display:none}.an-bar .chip{flex:none}
  .an-kpis{grid-template-columns:1fr 1fr;gap:8px}
  .an-kpi{padding:14px}.an-kpi b{font-size:22px;line-height:28px;margin:0}
  .an-kpi.m-hide{display:none}
  .an-card{padding:16px}
  .an-card h2{font-size:15px;line-height:20px}
  .an-svg{height:170px}
  .an-legend{display:none}
  .an-b{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 44px}
}

<script>
H.mount({ active: 'my-products', tab: 'you' });
(async function () {
  const { qs, qsa, esc, icon, plogo, verified } = H;
  const root = qs('#an');
  await API.ready;
  const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || H.params().get('p') || '');
  if (!API.uid) { location.href = '/signin?next=' + encodeURIComponent(location.pathname); return; }
  const fail = (t, m) => { root.innerHTML = `<div style="text-align:center;padding-top:96px"><h1 class="t-h2">${esc(t)}</h1><p class="c-2" style="margin:8px 0 20px">${esc(m)}</p><a class="btn btn--secondary btn--sm" href="/my-products">My products</a></div>`; H.contentShown(); };
  const p = await API.product(slug).catch(() => null);
  if (!p) return fail('We couldn’t find that product', 'Check the link, or open it from My products.');

  const RANGES = [[7, '7 days'], [30, '30 days'], [90, '90 days'], [0, 'Since launch']];
  let days = +(H.params().get('days') || 30); if (!RANGES.some(r => r[0] === days)) days = 30;
  let A = null, loadedAt = Date.now();
  const SRC = { launches: 'Launches list', search: 'Search on Hentity', digest: 'Weekly digest email', badge: 'Badge on your website', whatsapp: 'WhatsApp shares', social: 'X and LinkedIn', directory: 'Directory', saved: 'Saved lists', google: 'Google and other search', direct: 'Direct or bookmarked', other: 'Other' };
  const BTN = { website: 'Website', video: 'Demo video', store: 'App store', follow: 'Follow', share: 'Share', save: 'Save', upvote: 'Upvote', review: 'Write a review' };
  const n = v => (+v || 0).toLocaleString('en-US');
  const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
  const day = d => new Date(String(d).slice(0, 10) + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const signed = (v, unit) => (v > 0 ? '+' : v < 0 ? '−' : '') + n(Math.abs(v)) + (unit || '');

  async function load() {
    try { A = await API.productAnalytics(p.id, days); loadedAt = Date.now(); }
    catch (e) { return fail('This isn’t your product', 'Only the team behind a product can see its analytics.'); }
    render();
  }

  // ---------------------------------------------------------------- the line chart (views + website clicks, one axis)
  function chart(el, rows) {
    const W = Math.max(280, el.clientWidth), H = el.classList.contains('an-mob') ? 170 : 240, L = 36, R = 8, T = 10, B = 24;
    const max = Math.max(4, ...rows.map(r => r.views)), nice = (() => { const m = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / m) * m; })();
    const x = i => L + (rows.length < 2 ? (W - L - R) / 2 : i * (W - L - R) / (rows.length - 1)), y = v => T + (H - T - B) * (1 - v / nice);
    const path = k => rows.map((r, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(r[k]).toFixed(1)}`).join('');
    const area = rows.length ? `${path('views')}L${x(rows.length - 1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z` : '';
    const ticks = [0, .33, .66, 1].map(f => Math.round(nice * f));
    const fmtK = v => v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : v;
    const xl = rows.length ? [0, Math.round((rows.length - 1) / 3), Math.round((rows.length - 1) * 2 / 3), rows.length - 1].filter((v, i, a) => a.indexOf(v) === i) : [];
    const li = rows.findIndex(r => r.d === A.product.launch);
    el.innerHTML = `<svg class="an-svg" viewBox="0 0 ${W} ${H}" style="height:${H}px" role="img" aria-label="Daily page views and website clicks">
      <g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmtK(t)}</text>`).join('')}</g>
      ${xl.map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${li === i ? 'Launch' : day(rows[i].d)}</text>`).join('')}
      <path d="${area}" fill="var(--c-views)" opacity=".12"/>
      <path d="${path('views')}" fill="none" stroke="var(--c-views)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="an-line"/>
      <path d="${path('clicks')}" fill="none" stroke="var(--c-clicks)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="an-line"/>
      <line class="an-x" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--color-text-tertiary)" stroke-dasharray="3 3" opacity="0"/>
      <circle class="an-dv" r="4" fill="var(--color-bg-canvas)" stroke="var(--c-views)" stroke-width="2" opacity="0"/><circle class="an-dc" r="4" fill="var(--color-bg-canvas)" stroke="var(--c-clicks)" stroke-width="2" opacity="0"/>
      ${li >= 0 ? `<circle cx="${x(li)}" cy="${y(rows[li].views)}" r="4" fill="var(--color-bg-canvas)" stroke="var(--c-views)" stroke-width="2"/>` : ''}
      <rect class="an-hit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/></svg>
      <div class="an-tip${li >= 0 ? ' pin' : ''}" style="left:${li >= 0 ? x(li) : 0}px;top:${li >= 0 ? y(rows[li].views) : 0}px">${li >= 0 ? `Launch day · ${day(rows[li].d)} · ${n(rows[li].views)} views, ${n(rows[li].clicks)} clicks` : ''}</div>`;
    // Draw the lines in
    el.querySelectorAll('.an-line').forEach(pth => { try { const len = pth.getTotalLength(); pth.style.strokeDasharray = len; pth.style.strokeDashoffset = len; pth.getBoundingClientRect(); pth.style.transition = 'stroke-dashoffset 1s cubic-bezier(.22,1,.36,1)'; pth.style.strokeDashoffset = 0; } catch (e) {} });
    // Crosshair + tooltip for any day
    const svg = el.querySelector('svg'), tip = el.querySelector('.an-tip'), xl_ = svg.querySelector('.an-x'), dv = svg.querySelector('.an-dv'), dc = svg.querySelector('.an-dc');
    const pinned = tip.innerHTML;
    const clamp = () => { const w = tip.offsetWidth, pw = el.clientWidth, l = parseFloat(tip.style.left) || 0; tip.style.left = Math.max(w / 2, Math.min(pw - w / 2, l)) + 'px'; };
    const at = ev => { const r = svg.getBoundingClientRect(), px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left, sx = px * W / r.width; const i = Math.max(0, Math.min(rows.length - 1, Math.round((sx - L) / ((W - L - R) / Math.max(1, rows.length - 1))))); return i; };
    const show = ev => { if (!rows.length) return; const i = at(ev), X = x(i), r = svg.getBoundingClientRect(), k = r.width / W;
      xl_.setAttribute('x1', X); xl_.setAttribute('x2', X); xl_.setAttribute('opacity', '.6'); dv.setAttribute('cx', X); dv.setAttribute('cy', y(rows[i].views)); dc.setAttribute('cx', X); dc.setAttribute('cy', y(rows[i].clicks)); dv.setAttribute('opacity', 1); dc.setAttribute('opacity', 1);
      tip.className = 'an-tip on'; tip.style.left = X * k + 'px'; tip.style.top = y(rows[i].views) * k + 'px'; tip.textContent = `${i === li ? 'Launch day · ' : ''}${day(rows[i].d)} · ${n(rows[i].views)} views, ${n(rows[i].clicks)} clicks`; clamp(); };
    const hide = () => { xl_.setAttribute('opacity', 0); dv.setAttribute('opacity', 0); dc.setAttribute('opacity', 0); if (li >= 0) { tip.className = 'an-tip pin'; tip.innerHTML = pinned; tip.style.left = x(li) * svg.getBoundingClientRect().width / W + 'px'; tip.style.top = y(rows[li].views) * svg.getBoundingClientRect().width / W + 'px'; clamp(); } else tip.className = 'an-tip'; };
    svg.addEventListener('mousemove', show); svg.addEventListener('touchmove', show, { passive: true }); svg.addEventListener('mouseleave', hide); svg.addEventListener('touchend', hide);
    if (li >= 0) hide();
  }
  const bars = (list, color, total) => { const top = Math.max(1, ...list.map(x => x.n)); return list.map(x => `<div class="an-b"><span class="t">${esc(x.label)}</span><i><em style="width:${x.n / top * 100}%;background:${typeof color === 'function' ? color(x) : color}"></em></i><span class="n">${n(x.n)}</span></div>`).join(''); };

  function render() {
    const k = A.kpi, f = A.funnel, rows = A.daily || [], prod = A.product;
    const launched = prod.launch ? `Launched ${day(prod.launch)}` : '';
    const vsPrev = k.views_prev ? Math.round((k.views - k.views_prev) / k.views_prev * 100) : null;
    const tracking = A.tracking_since ? new Date(A.tracking_since) : null;
    const rangeLabel = (RANGES.find(r => r[0] === days) || [])[1];
    const srcs = (A.sources || []).map(s => ({ label: SRC[s.k] || s.k, n: s.n, k: s.k }));
    const cities = (A.cities || []).map(c => ({ label: c.city, n: c.n }));
    const btns = (A.buttons || []).map(b => ({ label: BTN[b.k] || b.k, n: b.n, k: b.k }));
    const R_ = A.roles || {}, rtot = (R_.founders || 0) + (R_.builders || 0) + (R_.testers || 0) + (R_.investors || 0) + (R_.anon || 0);
    const roles = [['founders', 'Founders'], ['builders', 'Builders'], ['testers', 'Beta testers'], ['investors', 'Investors'], ['anon', 'Not signed in']].map(([key, l]) => ({ key, l, v: R_[key] || 0 }));
    const dev = A.devices || {}, dtot = (dev.phone || 0) + (dev.computer || 0);
    root.innerHTML = `
      <nav class="an-crumbs" aria-label="Breadcrumb"><a href="/my-products">My products</a>${icon('arrow-right', 'ic-12')}<b>${esc(p.name)}</b></nav>
      <div class="an-head"><div class="an-id">${plogo(p, 48)}<div style="min-width:0"><h1>${esc(p.name)}${p.verified ? verified('ic-18') : ''}<span class="an-lock">${icon('lock', 'ic-12')}Only your team sees this</span></h1><p class="an-sub">${esc(launched)}</p></div></div>
        <div class="row gap-8"><button class="btn btn--secondary btn--sm" type="button" id="csv">${icon('download', 'ic-14')}Export CSV</button><a class="btn btn--secondary btn--sm" href="/products/${esc(p.slug)}">${icon('arrow-up-right', 'ic-14')}View page</a></div></div>
      <nav class="an-tabs" aria-label="Product"><a href="/products/${esc(p.slug)}/edit">Edit</a><a href="/products/${esc(p.slug)}/analytics" aria-current="page">Analytics</a><a href="/products/${esc(p.slug)}#reviews">Reviews</a><a href="/studio/${esc(p.slug)}">Beta</a><a href="/studio/${esc(p.slug)}/badges">Badges</a></nav>
      <div class="an-mhead"><a class="nav__icon" href="/my-products" aria-label="Back">${icon('arrow-left')}</a>${plogo(p, 36)}<div class="grow" style="min-width:0"><p class="t-label truncate" style="font-size:16px;color:var(--color-text-primary)">${esc(p.name)}</p><p>Analytics · ${days ? 'last ' + rangeLabel : 'since launch'}</p></div><button class="nav__icon" type="button" id="csv-m" aria-label="Export CSV">${icon('download')}</button></div>
      <div class="an-bar"><div class="chips" role="group" aria-label="Period">${RANGES.map(([d, l]) => `<button class="chip" type="button" data-days="${d}" aria-pressed="${d === days}">${icon('check')}${l}</button>`).join('')}</div><span class="an-upd" id="upd">Updated just now</span></div>
      ${!tracking || (Date.now() - tracking) < 7 * 864e5 ? `<p class="an-note">${icon('info', 'ic-16')}<span>Detailed analytics started on ${tracking ? day(tracking.toISOString()) : 'today'}${k.views_total ? `. Before that, ${esc(p.name)} had ${n(k.views_total)} page views and ${n(k.clicks_total)} website clicks in total` : ''}. Numbers fill in as people find ${esc(p.name)} on Hentity.</span></p>` : ''}
      <div class="an-kpis">
        <div class="an-kpi"><p>Page views</p><b data-count-to="${k.views}">0</b><span class="${vsPrev > 0 ? 'up' : vsPrev < 0 ? 'down' : ''}">${vsPrev == null ? 'No earlier period yet' : signed(vsPrev, '%') + ' vs previous period'}</span></div>
        <div class="an-kpi"><p>Visitors</p><b data-count-to="${k.visitors}">0</b><span class="up">${k.visitors ? Math.round(k.new_visitors / k.visitors * 100) + '% new to ' + esc(p.name) : '–'}</span></div>
        <div class="an-kpi"><p>Website clicks</p><b data-count-to="${k.clicks}">0</b><span class="up">${k.visitors ? pct(k.clicks, k.visitors) + '% of visitors' : '–'}</span></div>
        <div class="an-kpi"><p>Upvotes</p><b data-count-to="${k.upvotes}">0</b><span class="up">${k.upvotes_launch ? signed(k.upvotes_launch) + ' on launch day' : signed(k.upvotes_period) + ' in this period'}</span></div>
        <div class="an-kpi m-hide"><p>Followers</p><b data-count-to="${k.followers}">0</b><span class="${k.followers_week ? 'up' : ''}">${signed(k.followers_week)} this week</span></div>
        <div class="an-kpi m-hide"><p>Saved</p><b data-count-to="${k.saved}">0</b><span class="${k.saved_week > 0 ? 'up' : k.saved_week < 0 ? 'down' : ''}">${signed(k.saved_week)} this week</span></div>
      </div>
      <section class="an-card" style="margin-top:16px"><div class="row between gap-12" style="align-items:flex-start"><div><h2>Views and website clicks</h2><p class="sub">Daily, ${days ? 'last ' + rangeLabel : 'since launch'}</p></div><div class="an-legend"><span><i style="background:var(--c-views)"></i>Page views</span><span><i style="background:var(--c-clicks)"></i>Website clicks</span></div></div>
        <div class="an-plot an-chart" id="chart"></div>
        <details class="an-table"><summary>Show as a table</summary><table><thead><tr><th>Day</th><th>Page views</th><th>Website clicks</th></tr></thead><tbody>${rows.slice().reverse().map(r => `<tr><td>${day(r.d)}</td><td>${n(r.views)}</td><td>${n(r.clicks)}</td></tr>`).join('')}</tbody></table></details></section>
      <div class="an-grid2">
        <section class="an-card"><h2>From seen to clicked</h2><p class="sub">Where people drop off</p>
          <div class="an-fun">${[[`Saw ${p.name} in a list`, f.seen, f.seen ? '100%' : 'Counts people who scrolled past it on the board or in the Directory', '#BFDFFF'], ['Opened your page', f.opened, f.seen ? pct(f.opened, f.seen) + '%' : '', 'var(--c-views)'], ['Clicked your website', f.clicked, f.opened ? pct(f.clicked, f.opened) + '% of visitors' : '', 'var(--c-clicks)'], ['Clicked again later', f.again, f.clicked ? pct(f.again, f.clicked) + '% came back' : '', 'var(--c-views)']]
            .map(([l, v, s, c], i) => { const top = Math.max(1, f.seen || 0, f.opened || 0); return `<div><div class="row1"><span>${esc(l)}</span><b>${n(v)}</b></div><i style="width:${Math.max(1, v / top * 100)}%;background:${c}"></i>${s ? `<small>${esc(s)}</small>` : ''}</div>`; }).join('')}</div>
          <p class="an-ref">${icon('link', 'ic-14')}<span>Website clicks carry ?ref=hentity, so you can count sign-ups from Hentity in your own analytics.</span></p></section>
        <section class="an-card"><h2>Where visitors came from</h2><p class="sub">Page views by source</p>
          ${srcs.length ? `<div class="an-bars">${bars(srcs, 'var(--c-views)')}</div>` : '<p class="an-empty">Sources show up after the first visits.</p>'}</section>
      </div>
      <div class="an-grid3">
        <section class="an-card"><h2>Where they are</h2><p class="sub">Visitors by city</p>${cities.length ? `<div class="an-bars">${bars(cities, 'var(--c-cities)')}</div>` : '<p class="an-empty">Cities show up after the first visits.</p>'}</section>
        <section class="an-card"><h2>Who they are</h2><p class="sub">Signed-in visitors by role</p>
          ${rtot ? `<div class="an-stack" role="img" aria-label="${roles.map(r => r.l + ' ' + Math.round(r.v / rtot * 100) + '%').join(', ')}">${roles.filter(r => r.v).map(r => `<span style="flex:${r.v};background:var(--c-${r.key})"></span>`).join('')}</div>
          <div class="an-roles">${roles.map(r => `<div><i style="background:var(--c-${r.key})"></i>${r.l}<b>${Math.round(r.v / rtot * 100)}%</b></div>`).join('')}</div>` : '<p class="an-empty">Roles show up after the first visits. Names are never shown.</p>'}
          ${R_.vinv ? `<p class="an-inv">${icon('eye', 'ic-14')}<span>${R_.vinv} verified investor${R_.vinv === 1 ? '' : 's'} viewed ${esc(p.name)}.${R_.vinv_clicked ? ` ${R_.vinv_clicked} clicked your website.` : ''}</span></p>` : ''}</section>
        <section class="an-card"><h2>What they clicked</h2><p class="sub">On your product page</p>${btns.length ? `<div class="an-bars">${bars(btns, x => x.k === 'website' ? 'var(--c-clicks)' : 'var(--c-anon)')}</div>` : '<p class="an-empty">Clicks show up after the first visits.</p>'}
          ${dtot ? `<p class="an-dev">${icon('globe', 'ic-14')}${Math.round((dev.phone || 0) / dtot * 100)}% on phones · ${Math.round((dev.computer || 0) / dtot * 100)}% on computers</p>` : ''}</section>
      </div>`;
    chart(qs('#chart'), rows);
    M.countUp && M.countUp();
    H.contentShown();
  }

  function csv() {
    if (!A) return;
    const lines = [['day', 'page_views', 'website_clicks']].concat((A.daily || []).map(r => [r.d, r.views, r.clicks]));
    lines.push([], ['source', 'page_views']); (A.sources || []).forEach(s => lines.push([SRC[s.k] || s.k, s.n]));
    lines.push([], ['city', 'visitors']); (A.cities || []).forEach(c => lines.push([c.city, c.n]));
    lines.push([], ['button', 'clicks']); (A.buttons || []).forEach(b => lines.push([BTN[b.k] || b.k, b.n]));
    const txt = lines.map(r => r.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv' })); a.download = `${p.slug}-analytics-${days ? days + 'd' : 'all'}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  root.addEventListener('click', e => {
    const c = e.target.closest('[data-days]'); if (c) { days = +c.dataset.days; const u = new URL(location.href); u.searchParams.set('days', days); history.replaceState(null, '', u); load(); return; }
    if (e.target.closest('#csv,#csv-m')) csv();
  });
  setInterval(() => { const el = qs('#upd'); if (el) { const m = Math.round((Date.now() - loadedAt) / 6e4); el.textContent = m < 1 ? 'Updated just now' : `Updated ${m} min ago`; } }, 30000);
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => A && chart(qs('#chart'), A.daily || []), 150); });
  load();
})();
</script>
</body>
</html>
