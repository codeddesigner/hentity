   and if the app never starts, reload once and then fall back to the readable server copy. */

  var d = document.documentElement, n = 0; d.classList.add('js-boot');
  function log(m, s) { if (n++ > 3) return; try { fetch('https://sislzikhjapilksictxd.supabase.co/rest/v1/client_errors', { method: 'POST', keepalive: true, headers: { apikey: 'sb_publishable_49iWYS0Wr9kVY_PfDQphww_jj9dRaBz', 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ path: location.pathname.slice(0, 300), msg: String(m).slice(0, 600), src: String(s || '').slice(0, 400), ua: navigator.userAgent.slice(0, 300) }) }).catch(function () {}); } catch (e) {} }
  window.addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) log('failed to load', t.src || t.href); else if (e.message) log(e.message, (e.filename || '') + ':' + (e.lineno || '')); }, true);
  // A page that fails while loading its data shows the readable server copy instead of a blank screen
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason || {}; log('unhandled: ' + (r.message || r), (r.stack || '').split('\n')[1] || ''); if (!(window.performance && performance.getEntriesByName('hentity:content').length)) d.classList.remove('js-boot'); });
  function check() { if (window.H && window.API) return; d.classList.remove('js-boot'); log('app did not start: H=' + !!window.H + ' API=' + !!window.API + ' supabase=' + !!window.supabase, '');
    try { if (!sessionStorage.getItem('h-reload')) { sessionStorage.setItem('h-reload', '1'); location.reload(); } } catch (e) {} }
  window.addEventListener('load', function () { setTimeout(check, 1500); });
  setTimeout(function () { if (d.classList.contains('js-boot') && document.querySelector('[data-ssr]')) log('content not shown after 5s', 'ready=' + !!(window.performance && performance.getEntriesByName('hentity:ready').length)); d.classList.remove('js-boot'); check(); }, 5000);
})();

<style>
.inbox{display:grid;grid-template-columns:200px minmax(0,712px);gap:48px;justify-content:center;padding:40px 32px 96px}
.filters-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:104px;align-self:start}
.filters-nav button{display:flex;align-items:center;height:36px;padding:0 12px;border-radius:var(--radius-md);font-size:13px;font-weight:500;color:var(--color-text-secondary);text-align:left}
.filters-nav button:hover{background:var(--color-bg-muted);color:var(--color-text-primary)}
.filters-nav button[aria-selected="true"]{background:var(--color-bg-muted);color:var(--color-text-primary)}
.filters-nav .count{margin-left:auto;min-width:24px;height:20px;padding:0 7px;border-radius:999px;background:var(--color-accent-default);color:#fff;font-size:12px;display:grid;place-items:center}
.ngroup{border:1px solid var(--color-border-default);border-radius:var(--radius-lg);overflow:hidden;background:var(--color-bg-canvas)}
.ngroup.unread{border-color:#fcd9c4}
:root[data-theme="dark"] .ngroup.unread{border-color:#5a2a10}
.nrow{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 16px 14px;border-top:1px solid var(--color-border-default);position:relative;cursor:pointer}
.nrow:first-child{border-top:0}
.nrow.is-unread{background:var(--color-accent-subtle)}
.nrow.is-unread .ndot{visibility:visible}
.ndot{width:6px;height:6px;border-radius:50%;background:var(--color-accent-default);margin-top:13px;flex:none;visibility:hidden}
.nrow .ntext{font-size:15px;line-height:22px;color:var(--color-text-secondary)}
.nrow .ntext b{font-weight:500;color:var(--color-text-primary)}
.nrow:hover:not(.is-unread){background:var(--color-bg-subtle)}
@media (max-width:900px){.inbox{grid-template-columns:1fr;padding:16px 16px 32px;gap:16px}.filters-nav{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.filters-nav button{flex:none;border:1px solid var(--color-border-default);border-radius:999px;height:34px}.filters-nav button[aria-selected="true"]{background:var(--color-bg-inverse);color:var(--color-text-inverse);border-color:var(--color-bg-inverse)}.nrow .btn{display:none}.nrow .ntext{font-size:14px;line-height:20px}}

<body class="subtle">
<div data-header></div>
<div class="inbox">
  <nav class="filters-nav" role="tablist" aria-label="Filter notifications" id="filters"></nav>
  <main>
    <div class="row between wrap gap-12" style="margin-bottom:20px"><h1 class="t-h2">Notifications</h1><div class="row gap-4"><button class="btn btn--ghost btn--sm" type="button" id="readall"><span data-icon="check"></span>Mark all as read</button><a class="btn btn--ghost btn--sm" href="/settings/notifications"><span data-icon="settings"></span>Settings</a></div></div>
    <div id="list" class="stack gap-12"></div>
    <div style="text-align:center;margin-top:20px"><button class="btn btn--ghost btn--sm" type="button" id="older">Load older</button></div>
  </main>
</div>
<div data-tabbar></div>
<script>
H.mount({ active: 'notifications', tab: 'you' });
(async function () {
  const { qs, qsa, icon, esc, store, toast, avatar, plogo } = H;
  await API.ready;
  if (!API.uid) { location.replace('/signin?next=/notifications'); return; }
  let N = [], filter = 'all', showOlder = false;
  const F = [['all', 'All'], ['unread', 'Unread'], ['launches', 'Your launches'], ['comments', 'Comments & replies'], ['followers', 'Followers'], ['system', 'From Hentity']];
  const unread = () => N.filter(n => !n.read_at).length;
  function renderFilters() { qs('#filters').innerHTML = F.map(([k, l]) => `<button role="tab" aria-selected="${k === filter}" data-f="${k}">${l}${k === 'unread' && unread() ? `<span class="count">${unread()}</span>` : ''}</button>`).join(''); }
  function av(n) { if (n.product) return plogo(n.product, 32); if (n.actor) return avatar(n.actor, 32); if (n.type === 'system') return `<span class="avatar" style="background:#000;color:#fff">H</span>`; if (n.type === 'upvotes') return `<span class="avatar" style="background:var(--color-accent-subtle);color:var(--color-accent-default)">${icon('upvote', 'ic-14')}</span>`; return `<span class="avatar">${icon('bell', 'ic-14')}</span>`; }
  function bucket(ts) { const d = (Date.now() - new Date(ts)) / 864e5; return d < 1 && new Date(ts).getDate() === new Date().getDate() ? 'today' : d < 7 ? 'week' : 'older'; }
  function render() {
    renderFilters(); H.setCount('notifs', unread());
    let L = N.filter(n => showOlder || bucket(n.created_at) !== 'older');
    if (filter === 'unread') L = L.filter(n => !n.read_at); else if (filter !== 'all') L = L.filter(n => n.grp === filter);
    const groups = [['today', 'Today'], ['week', 'This week'], ['older', 'Earlier']];
    qs('#list').innerHTML = groups.map(([g, label]) => { const items = L.filter(n => bucket(n.created_at) === g); if (!items.length) return ''; const hasUnread = items.some(n => !n.read_at);
      return `<section><h2 class="t-eyebrow c-3" style="margin:12px 0 10px">${label}</h2><div class="ngroup${hasUnread ? ' unread' : ''}">${items.map(n => `<div class="nrow${n.read_at ? '' : ' is-unread'}" data-id="${n.id}" data-link="${esc(n.link || '')}" tabindex="0" role="link"><span class="ndot" aria-hidden="true"></span>${av(n)}<div class="grow"><p class="ntext">${n.title}</p><p class="t-caption c-3" style="font-weight:400;margin-top:4px">${esc(n.body || '')}${n.body ? ' · ' : ''}${H.ago(n.created_at)}</p></div>${n.action_label && n.link ? `<a class="btn btn--secondary btn--sm" href="${esc(n.link)}" data-act>${esc(n.action_label)}</a>` : ''}</div>`).join('')}</div></section>`; }).join('') ||
      `<div class="card card--pad reveal" style="text-align:center;padding:48px 20px"><div class="icon-badge" style="margin:0 auto 14px">${icon('bell')}</div><p class="t-h4">You’re all caught up</p><p class="t-body-sm c-2" style="margin-top:6px">New upvotes, replies and review decisions show up here.</p></div>`;
    qs('#older').hidden = showOlder || !N.some(n => bucket(n.created_at) === 'older');
    M.stagger(qs('#list'), '.nrow');
  }
  async function load() { try { N = await API.notifications(100); render(); } catch (e) { H.fail(e); } }
  qs('#filters').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; render(); });
  qs('#list').addEventListener('click', async e => {
    const r = e.target.closest('.nrow'); if (!r) return;
    const n = N.find(x => x.id === r.dataset.id);
    if (n && !n.read_at) { n.read_at = new Date().toISOString(); API.markRead(n.id).catch(() => {}); }
    if (!e.target.closest('[data-act]') && r.dataset.link) location.href = r.dataset.link; else render();
  });
  qs('#list').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('nrow')) e.target.click(); });
  qs('#readall').addEventListener('click', async () => { try { await API.markAllRead(); N.forEach(n => n.read_at = n.read_at || new Date().toISOString()); render(); toast('All caught up'); } catch (e) { H.fail(e); } });
  qs('#older').addEventListener('click', () => { showOlder = true; render(); });
  API.live('inbox', 'notifications', 'user_id=eq.' + API.uid, ({ eventType }) => { if (eventType === 'INSERT') load(); });
  load();
})();
</script>
