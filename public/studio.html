<body>
<div data-header></div>
<div id="studio"><div class="st"><div class="skel" style="height:480px;border-radius:16px"></div></div></div>
<div data-tabbar></div>
<script>
H.mount({ active: 'my-products', tab: 'me' });
(async function () {
  const { qs, qsa, esc, icon, toast, plogo, verified, avatar } = H;
  const parts = location.pathname.split('/').filter(Boolean);   // studio / <product> / <beta>
  const root = qs('#studio');
  await API.ready;
  if (!API.uid) { location.href = '/signin?next=' + encodeURIComponent(location.pathname); return; }
  const isAdmin = API.profile && API.profile.role === 'admin';
  const fail = (t, m) => { root.innerHTML = `<div class="st" style="text-align:center;padding-top:96px"><h1 class="t-h2">${esc(t)}</h1><p class="c-2" style="margin:8px 0 20px">${esc(m)}</p><a class="btn btn--secondary btn--sm" href="/my-products">My products</a></div>`; H.contentShown(); };

  // /studio → pick a product
  if (!parts[1]) {
    const mine = (await API.myProducts().catch(() => [])).filter(p => p.status !== 'archived');
    if (mine.length === 1) { location.replace('/studio/' + mine[0].slug + location.search); return; }
    root.innerHTML = `<div class="st"><h1 class="t-h2" style="margin:12px 0 6px">Beta programs</h1><p class="c-2" style="margin-bottom:20px">Pick the product you want testers for.</p><div class="st-list">${mine.map(p => `<a class="st-bp" href="/studio/${esc(p.slug)}">${plogo(p, 40)}<div class="grow"><p class="t-label">${esc(p.name)}</p><p class="t-caption c-3" style="font-weight:400">${esc(p.tagline)}</p></div>${icon('arrow-right', 'ic-16')}</a>`).join('') || `<div class="st-box" style="text-align:center;padding:40px"><p class="t-h4">Add your product first</p><p class="c-2 t-body-sm" style="margin:6px 0 16px">Beta programs live inside your product on Hentity.</p><a class="btn btn--accent btn--sm" href="/submit">${icon('plus', 'ic-14')}Submit a product</a></div>`}</div></div>`;
    H.contentShown(); return;
  }
  const p = await API.product(parts[1]).catch(() => null);
  if (!p) return fail('We couldn’t find that product', 'Check the link, or open it from My products.');
  if (p.owner_id !== API.uid && !isAdmin) return fail('This isn’t your product', 'Only the makers of a product can run its beta programs.');
  document.title = `${p.name} | Beta programs | Hentity`;
  const header = (cur, tab) => `<div class="st-head"><div class="st-head__in">
      <nav class="st-crumbs" aria-label="Breadcrumb"><a href="/my-products">My products</a><span>/</span><a href="/studio/${esc(p.slug)}">${esc(p.name)}</a><span>/</span><b>${tab === 'badges' ? 'Badges &amp; embeds' : 'Beta programs'}</b></nav>
      <div class="row between gap-12"><div class="st-prod">${plogo(p, 32)}${esc(p.name)}${p.verified ? verified() : ''}</div><a class="row gap-6 t-body-sm" style="white-space:nowrap" href="/products/${esc(p.slug)}" target="_blank" rel="noopener">${icon('arrow-up-right', 'ic-14')}View public page</a></div>
      <nav class="st-tabs" aria-label="Product"><a href="/products/${esc(p.slug)}">Overview</a><a href="/my-products">Launches</a><a href="/studio/${esc(p.slug)}"${tab === 'badges' ? '' : ' aria-current="page"'}>Beta programs</a>${cur && cur.status !== 'draft' ? `<a href="/betas/${cur.id}/manage?tab=feedback">Feedback</a>` : ''}<a href="/studio/${esc(p.slug)}/badges"${tab === 'badges' ? ' aria-current="page"' : ''}>Badges &amp; embeds</a></nav>
    </div></div>`;

  // /studio/<product>/badges → Badges & embeds (Figma: Studio · Badges & embeds)
  if (parts[2] === 'badges') return badgesView();

  // /studio/<product> → the product's beta programs
  if (!parts[2]) {
    const list = await API.productBetas(p.id).catch(() => []);
    const line = b => { const ph = B.phase(b); const pill = b.status === 'draft' ? '<span class="st-pill">Draft</span>' : b.status === 'awaiting_payment' ? '<span class="st-pill st-pill--warn">Awaiting payment</span>' : ph.k === 'closed' ? `<span class="st-pill">${b.completed_at ? 'Completed · ' + B.fmtDay(b.completed_at) : 'Closed'}</span>` : `<span class="st-pill st-pill--live">${esc(ph.label)}</span>`; return `<a class="st-bp lift" href="/studio/${esc(p.slug)}/${b.id}"><span class="icon-badge">${icon('flask')}</span><div class="grow" style="min-width:0"><p class="t-label row gap-8 wrap">${esc(b.title)}${pill}</p><p class="t-caption c-3" style="font-weight:400;margin-top:3px">${b.spots} testers · ${b.applied_count} applied · ${b.accepted_count} accepted · ${b.signed_count || 0} signed · ${b.feedback_count} feedback</p></div>${icon('arrow-right', 'ic-16')}</a>`; };
    root.innerHTML = header() + `<div class="st"><div class="st-title"><div><h1>Beta programs</h1><p class="t-body-sm c-2" style="margin-top:4px">Get real people to try ${esc(p.name)} before everyone else: one link, a short form, a signed agreement, private access.</p></div><button class="btn btn--accent" type="button" id="new">${icon('plus', 'ic-14')}New beta program</button></div>
      <div class="st-list">${list.map(line).join('') || `<div class="st-box" style="text-align:center;padding:48px 24px"><span class="icon-badge icon-badge--accent" style="margin:0 auto 12px">${icon('flask')}</span><p class="t-h4">No beta programs yet</p><p class="t-body-sm c-2" style="margin:6px auto 18px;max-width:440px">Set one up in five steps. Share the link on WhatsApp, and ${esc(p.name)}’s page shows “Testers wanted” while it’s open.</p><button class="btn btn--accent btn--sm" type="button" data-new>${icon('plus', 'ic-14')}New beta program</button></div>`}</div></div>`;
    H.contentShown();
    const mk = async e => { const btn = e.currentTarget; btn.disabled = true; try { const b = await API.createBetaDraft(p.id, 'Help test ' + p.name); location.href = `/studio/${p.slug}/${b.id}`; } catch (err) { btn.disabled = false; H.fail(err); } };
    qs('#new').onclick = mk; qsa('[data-new]').forEach(x => x.onclick = mk);
    if (H.params().get('new') === '1' && !list.length) qs('#new').click();
    return;
  }

  // /studio/<product>/<beta> → the wizard and results
  let b = await API.beta(parts[2]).catch(() => null);
  if (!b || b.product_id !== p.id) return fail('We couldn’t find that beta program', 'It may have been deleted.');
  const STEPS = [['details', 'Details', 'Goal, platforms, dates, perk'], ['form', 'Application form', ''], ['agreement', 'Agreement', 'Beta tester agreement'], ['access', 'Access', 'Play testing + web links'], ['share', 'Share', 'Link, WhatsApp, QR']];
  const live = () => b.status !== 'draft';
  let step = H.params().get('step') || (b.status === 'closed' ? 'results' : live() ? 'share' : 'details');
  let cfg = (await API.betaAccessConfig(b.id).catch(() => null)) || {}; cfg = cfg.config || {};
  let saveT = null, pending = {};
  const save = (patch, now) => { Object.assign(b, patch); Object.assign(pending, patch); clearTimeout(saveT); const go = async () => { const pt = pending; pending = {}; try { const nb = await API.updateBeta(b.id, pt); ['slug', 'status', 'funding'].forEach(k => b[k] = nb[k]); qs('#saved') && (qs('#saved').textContent = 'Saved'); } catch (e) { H.fail(e); } }; if (now) return go(); saveT = setTimeout(go, 600); qs('#saved') && (qs('#saved').textContent = 'Saving…'); };
  const sub = () => [`${b.spots} testers`, B.countryText(b.countries), b.platforms.join(' + ') || 'Any device', b.test_start ? 'testing ' + B.fmtDay(b.test_start) + '–' + B.fmtDay(b.test_end || b.test_start) : ''].filter(Boolean).join(' · ');
  const statusPill = () => { const ph = B.phase(b); if (b.status === 'draft') return '<span class="st-pill">Draft</span>'; if (b.status === 'awaiting_payment') return '<span class="st-pill st-pill--warn">Awaiting payment</span>'; if (ph.k === 'closed') return `<span class="st-pill st-pill--live">${icon('check', 'ic-12')}${b.completed_at ? 'Completed · ' + esc(B.fmtDay(b.completed_at)) : 'Closed'}</span>`; return `<span class="st-pill st-pill--live">${esc(ph.label)}</span>`; };
  const isDone = k => ({ details: b.title.length >= 8 && b.why.length > 10, form: true, agreement: !!(b.agreement || {}).legal_name, access: Object.values(b.access || {}).some(Boolean), share: live() })[k];
  function frame() {
    const steps = STEPS.map(([k, t, s], i) => `<button type="button" class="st-step ${isDone(k) && step !== k ? 'is-done' : ''}" data-step="${k}"${step === k ? ' aria-current="step"' : ''}><span class="st-step__n">${isDone(k) && step !== k ? icon('check', 'ic-12') : i + 1}</span><span><p>${t}</p><span class="s">${k === 'form' ? (b.form || []).length + ' question' + ((b.form || []).length === 1 ? '' : 's') : s}</span></span></button>`).join('')
      + (live() ? `<div class="hr" style="margin:8px 0"></div><button type="button" class="st-step" data-step="results"${step === 'results' ? ' aria-current="step"' : ''}><span class="st-step__n">${icon('bar-chart', 'ic-12')}</span><span><p>Results</p><span class="s">Funnel, signatures, perks</span></span></button><a class="st-step" href="/betas/${b.id}/manage"><span class="st-step__n">${icon('users', 'ic-12')}</span><span><p>Applicants &amp; testers</p><span class="s">${b.applied_count} applied · ${b.accepted_count} in</span></span></a>` : '');
    const actions = b.status === 'closed' ? `<button class="btn btn--secondary btn--sm" type="button" id="csv">${icon('download', 'ic-14')}Export CSV</button><button class="btn btn--primary btn--sm" type="button" id="again">${icon('flask', 'ic-14')}Run another beta</button>`
      : `<a class="btn btn--secondary btn--sm" href="/b/${esc(b.slug)}?view=preview" target="_blank" rel="noopener">${icon('eye', 'ic-14')}Preview as tester</a>${b.status === 'draft' ? `<button class="btn btn--accent btn--sm" type="button" id="publish">${icon('flask', 'ic-14')}Publish beta</button>` : `<button class="btn btn--ghost btn--sm" type="button" id="close">Close beta</button>`}`;
    root.innerHTML = header(b) + `<div class="st"><div class="st-title"><div><h1>${esc(b.title)} ${statusPill()}</h1><p class="t-body-sm c-2" style="margin-top:4px">${esc(sub())} <span class="c-3" id="saved" style="margin-left:6px"></span></p></div><div class="row gap-8 wrap">${actions}</div></div>
      ${b.status === 'awaiting_payment' ? `<div class="alert alert--accent" style="margin-bottom:20px"><span>${icon('clock')}</span><div><p class="alert__title">Waiting for payment · ${B.naira(B.budget(b).total)}</p><p class="alert__body">Hentity emailed you how to pay for the airtime. The link goes live once the money is in.</p></div></div>` : ''}
      <div class="st-grid${step === 'results' ? ' st-grid--wide' : ''}" id="grid"><nav class="st-steps" aria-label="Steps">${steps}</nav><section class="st-main" id="main"></section><aside class="st-aside" id="aside"></aside></div></div>`;
    qsa('[data-step]').forEach(x => x.onclick = () => go(x.dataset.step));
    qs('#publish') && (qs('#publish').onclick = publish);
    qs('#close') && (qs('#close').onclick = async () => { if (!confirm('Close this beta? New applications stop, personal links stop working, and results stay here.')) return; try { await API.completeBeta(b.id); b = await API.beta(b.id); step = 'results'; frame(); toast('Beta closed'); } catch (e) { H.fail(e); } });
    qs('#csv') && (qs('#csv').onclick = exportCsv);
    qs('#again') && (qs('#again').onclick = async () => { try { const nb = await API.createBetaDraft(p.id, b.title.slice(0, 70)); const copy = { why: b.why, countries: b.countries, platforms: b.platforms, steps: b.steps, form: b.form, agreement: b.agreement, access: b.access, settings: b.settings, time_needed: b.time_needed, perk: b.perk, perk_type: b.perk_type, spots: b.spots }; await API.updateBeta(nb.id, copy); await API.saveBetaAccessConfig(nb.id, cfg); location.href = `/studio/${p.slug}/${nb.id}`; } catch (e) { H.fail(e); } });
    VIEWS[step](); H.mount(); H.contentShown();
  }
  function go(k) { if (!VIEWS[k]) return; step = k; history.replaceState(null, '', '?step=' + k); frame(); window.scrollTo({ top: 0 }); }
  const main = () => qs('#main'), aside = () => qs('#aside');
  const tog = (id, on, dis) => `<label class="toggle"><input type="checkbox" id="${id}"${on ? ' checked' : ''}${dis ? ' disabled' : ''}><span class="toggle__track"></span></label>`;
  const next = k => `<div class="row between" style="margin-top:20px"><span></span><button class="btn btn--primary" type="button" data-next="${k}">Next: ${STEPS.find(s => s[0] === k)[1]}${icon('arrow-right', 'ic-14')}</button></div>`;
  const bindNext = () => qsa('[data-next]').forEach(x => x.onclick = () => go(x.dataset.next));

  async function publish() {
    const miss = [];
    if (b.title.length < 8) miss.push(['details', 'Give the beta a title of at least 8 characters']);
    if (b.why.length < 10) miss.push(['details', 'Say why you need testers']);
    if (new Date(b.closes_at) <= new Date()) miss.push(['details', 'Pick an application closing date in the future']);
    if (!(b.agreement || {}).legal_name) miss.push(['agreement', 'Add your company’s legal name to the agreement']);
    if (!Object.values(b.access || {}).some(Boolean)) miss.push(['access', 'Turn on at least one way for testers to get the beta']);
    if ((b.access || {}).web && !cfg.web_url) miss.push(['access', 'Add the web address for private invite links']);
    if (miss.length) { go(miss[0][0]); toast(miss[0][1], 'error'); return; }
    const total = B.budget(b).total;
    if (b.airtime_amount > 0 && !confirm(`Publish and pay ${B.naira(total)}? Hentity will email you how to pay. The link goes live once the money is in.`)) return;
    try { await save({ status: 'open' }, true); b = await API.beta(b.id); step = 'share'; frame(); toast(b.status === 'open' ? 'Your beta is live. Share the link!' : 'Saved. Waiting for payment'); if (b.status === 'open') M.burst(qs('.st-title h1')); } catch (e) { H.fail(e); }
  }

  // ------------------------------------------------------------------ 1 · Details
  const VIEWS = {};
  VIEWS.details = () => {
    const d = s => s ? String(s).slice(0, 10) : '';
    main().innerHTML = `<h2>Details</h2><p class="sub">What you’re testing, with whom, and what testers get.</p>
      <div class="st-box"><div class="field"><div class="field__row"><label class="field__label" for="t">Title</label><span class="field__counter" id="tc">${b.title.length} / 70</span></div><input class="input" id="t" maxlength="70" value="${esc(b.title)}" placeholder="Test our Moniepoint CSV import before launch"></div>
        <div class="field" style="margin-top:14px"><div class="field__row"><label class="field__label" for="w">Why you need testers</label><span class="field__counter" id="wc">${b.why.length} / 400</span></div><textarea class="input" id="w" rows="3" maxlength="400" style="height:auto;padding:10px 12px" placeholder="Half our customers moved to Moniepoint this year. We want 50 traders to try statement import on real data before everyone gets it.">${esc(b.why)}</textarea></div></div>
      <div class="st-box"><p class="field__label">Countries <span class="c-3" style="font-weight:400">(none = anywhere in Africa)</span></p><div class="chips" id="cs" style="margin-top:8px">${Object.entries(B.COUNTRIES).map(([k, v]) => `<button class="chip" type="button" data-chip data-v="${k}" aria-pressed="${b.countries.includes(k)}">${icon('check')}${esc(v)}</button>`).join('')}</div>
        <p class="field__label" style="margin-top:16px">Platforms</p><div class="chips" id="ps" style="margin-top:8px">${B.PLATFORMS.map(x => `<button class="chip" type="button" data-chip data-v="${esc(x)}" aria-pressed="${b.platforms.includes(x)}">${icon('check')}${esc(x)}</button>`).join('')}</div></div>
      <div class="st-box"><div class="grid-2" style="gap:12px"><div class="field"><label class="field__label" for="sp">Testers you need</label><input class="input" id="sp" type="number" min="1" max="2000" value="${b.spots}"></div><div class="field"><label class="field__label" for="tn">Time it takes</label><select class="input" id="tn">${B.TIMES.map(x => `<option${x === b.time_needed ? ' selected' : ''}>${x}</option>`).join('')}</select></div>
        <div class="field"><label class="field__label" for="cl">Applications close</label><input class="input" id="cl" type="date" value="${d(b.closes_at)}"></div><div></div>
        <div class="field"><label class="field__label" for="ts">Testing starts</label><input class="input" id="ts" type="date" value="${d(b.test_start)}"></div><div class="field"><label class="field__label" for="te">Testing ends</label><input class="input" id="te" type="date" value="${d(b.test_end)}"></div></div>
        <p class="field__hint" style="margin-top:8px">Personal links stop working the day after testing ends.</p></div>
      <div class="st-box"><p class="field__label">What testers will do <span class="c-3" style="font-weight:400">(up to 6 tasks, they tick them off)</span></p><div id="tasks" class="stack gap-8" style="margin-top:8px"></div><button class="link link--accent t-body-sm" type="button" id="addt" style="margin-top:10px">${icon('plus', 'ic-12')} Add a task</button></div>
      <div class="st-box"><div class="field"><label class="field__label" for="pk">Product perk <span class="c-3" style="font-weight:400">(optional)</span></label><input class="input" id="pk" maxlength="120" value="${esc(b.perk)}" placeholder="3 months of Pro"></div>
        <div class="field" style="margin-top:14px"><label class="field__label" for="air">Airtime per tester (₦) <span class="c-3" style="font-weight:400">(optional, paid by Hentity after feedback)</span></label><input class="input" id="air" type="number" min="0" max="100000" step="100" value="${b.airtime_amount || ''}" placeholder="0" ${b.funding === 'held' ? 'disabled' : ''}></div>
        <div id="cost" class="t-body-sm c-2" style="margin-top:10px"></div></div>
      ${next('form')}`;
    const cost = () => { const bu = B.budget(b); qs('#cost').innerHTML = b.airtime_amount > 0 ? `${b.spots} × ${B.naira(b.airtime_amount)} + 5% Hentity fee = <b style="color:var(--color-text-primary)">${B.naira(bu.total)}</b>. You pay before the link goes live; unused airtime is refunded.` : ''; };
    cost();
    const tasks = () => { qs('#tasks').innerHTML = (b.steps || []).map((s, i) => `<div class="row gap-8"><span class="bstep__n" style="flex:none">${i + 1}</span><input class="input" data-ti="${i}" maxlength="120" value="${esc(s)}"><button type="button" class="btn btn--ghost btn--sm" data-tx="${i}" aria-label="Remove task">${icon('x', 'ic-14')}</button></div>`).join(''); qs('#addt').hidden = (b.steps || []).length >= 6; };
    tasks();
    qs('#tasks').addEventListener('input', e => { const i = e.target.dataset.ti; if (i == null) return; const st = [...b.steps]; st[+i] = e.target.value; save({ steps: st.filter((x, j) => x.trim() || j === +i) }); });
    qs('#tasks').addEventListener('click', e => { const x = e.target.closest('[data-tx]'); if (!x) return; const st = [...b.steps]; st.splice(+x.dataset.tx, 1); save({ steps: st }); tasks(); });
    qs('#addt').onclick = () => { save({ steps: [...(b.steps || []), ''] }); tasks(); qs(`[data-ti="${b.steps.length - 1}"]`).focus(); };
    qs('#t').oninput = e => { qs('#tc').textContent = e.target.value.length + ' / 70'; if (e.target.value.trim().length >= 3) save({ title: e.target.value.trim() }); };
    qs('#w').oninput = e => { qs('#wc').textContent = e.target.value.length + ' / 400'; save({ why: e.target.value.trim() }); };
    H.bindChips(qs('#cs'), () => save({ countries: qsa('#cs [aria-pressed="true"]').map(x => x.dataset.v) }));
    H.bindChips(qs('#ps'), () => { const pl = qsa('#ps [aria-pressed="true"]').map(x => x.dataset.v); const acc = Object.assign({}, b.access); if (pl.includes('Android') && acc.android == null) acc.android = true; if (pl.includes('Web') && acc.web == null) acc.web = true; if (pl.includes('iOS') && acc.ios == null) acc.ios = true; save({ platforms: pl, access: acc }); });
    qs('#sp').oninput = e => { const n = Math.max(1, Math.min(2000, +e.target.value || 1)); save({ spots: n }); cost(); };
    qs('#tn').onchange = e => save({ time_needed: e.target.value });

          <p class="row gap-8 t-caption c-3" style="font-weight:400;margin-top:12px;align-items:flex-start">${icon('info', 'ic-14')}<span>Badges are images served by Hentity, so a new medal or count shows up on your site without touching the code. Clicks are tagged ?ref=badge, and counted here.</span></p></div></div></div>`;
    const draw = () => {
      qs('#blist').innerHTML = B_LIST.map(([k, t, s, locked]) => `<button type="button" class="bdg-opt${k === kind ? ' is-on' : ''}${locked ? ' is-locked' : ''}" data-k="${k}"${locked ? ' disabled' : ''}><span class="bdg-radio"></span><span class="grow" style="text-align:left"><span class="t-label" style="display:block">${t}</span><span class="t-caption c-3" style="font-weight:400">${esc(s)}</span></span>${locked ? icon('lock', 'ic-14') : ''}</button>`).join('');
      const pv = (k, t) => `${location.origin}/badges/${p.slug}/${k}.svg?theme=${t}&preview=1${size !== 'medium' ? '&size=' + size : ''}`;
      const [w, h] = dims(kind);
      qs('#prev').innerHTML = (theme === 'auto' ? ['dark', 'light'] : [theme, theme === 'dark' ? 'light' : 'dark']).map(t => `<img src="${pv(kind, t)}" width="${w}" height="${h}" alt="${esc(alt())}">`).join('');
      qs('#code').innerHTML = hl(code());
    };
    draw(); H.mount(); H.contentShown();
    qs('#blist').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b || b.disabled) return; kind = b.dataset.k; draw(); });
    H.bindChips(qs('#theme'), () => { theme = (qs('#theme [aria-pressed="true"]') || {}).dataset.v || 'dark'; draw(); });
    H.bindChips(qs('#size'), () => { size = (qs('#size [aria-pressed="true"]') || {}).dataset.v || 'medium'; draw(); });
    qs('#fw').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; fw = b.dataset.v; qsa('#fw button').forEach(x => x.setAttribute('aria-selected', String(x === b))); draw(); });
    qs('#copy').onclick = () => { B.copy(code()); toast('Code copied. Paste it into your site'); };
  }
})();
</script>
</body>
</html>
