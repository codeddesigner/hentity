<script>
const EMBED = new URLSearchParams(location.search).get('embed') === '1';

H.mount({ active: 'insights', tab: 'products' });
(async function () {
  const { qs, qsa, esc, icon, toast, flag } = H;
  const CN = { NG: 'Nigeria', KE: 'Kenya', GH: 'Ghana', ZA: 'South Africa', RW: 'Rwanda', EG: 'Egypt', MA: 'Morocco', SN: 'Senegal', ET: 'Ethiopia', UG: 'Uganda', TZ: 'Tanzania', CI: 'Côte d’Ivoire', CM: 'Cameroon', TN: 'Tunisia' };
  const CATS = ['Fintech', 'SaaS', 'Apps', 'AI', 'Commerce', 'Productivity', 'Dev Tools', 'Health', 'Education', 'Agriculture', 'Logistics', 'Infrastructure', 'Energy & Climate'];
  const slug = s => s.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const prm = H.params();
  let tab = prm.get('tab') || 'overview', cc = (prm.get('country') || '').toUpperCase(), days = +(prm.get('days') || 30), D = null, ALL = null;
  qs('#cc').innerHTML = '<option value="">All of Africa</option>' + Object.entries(CN).map(([k, v]) => `<option value="${k}"${k === cc ? ' selected' : ''}>${esc(v)}</option>`).join('');

  const n = v => (v || 0).toLocaleString('en-US');
  const pct = (a, b) => b ? Math.round((a - b) / b * 1000) / 10 : null;

  const vsPrev = () => days === 30 ? 'vs ' + new Date(Date.now() - 30 * 864e5).toLocaleDateString('en-GB', { month: 'short' }) : days === 7 ? 'vs last week' : days === 365 ? 'vs last year' : `vs prior ${days} days`;
  const period = () => ({ 7: 'last 7 days', 30: 'last 30 days', 90: 'last 90 days', 365: 'last 12 months' })[days] || `last ${days} days`;

  async function load() {
    qs('#view').style.opacity = .5;

      [D, ALL] = await Promise.all([API.insights(cc, days), cc ? (ALL || API.insights('', days)) : null]);
      if (!cc) ALL = D;
      render(); H.contentShown();
    } catch (e) { H.fail(e); qs('#view').innerHTML = '<p class="c-2">Couldn’t load insights. Try again in a moment.</p>'; }
    qs('#view').style.opacity = 1;
    const u = new URLSearchParams(); if (tab !== 'overview') u.set('tab', tab); if (cc) u.set('country', cc); if (days !== 30) u.set('days', days); if (EMBED) u.set('embed', '1');
    history.replaceState(null, '', location.pathname + (u.toString() ? '?' + u : ''));
  }
  // mobile country chips
  const mobileCC = () => { qs('#ccm').innerHTML = [['', 'All of Africa'], ...((ALL && ALL.countries) || []).slice(0, 6).map(c => [c.cc, CN[c.cc] || c.cc])].map(([k, l]) => `<button class="chip" type="button" data-chip data-cc="${k}" aria-pressed="${k === cc}">${icon('check')}${esc(l)}</button>`).join(''); };

  // ---------------------------------------------------------------- pieces
  function kpis() {
    const where = cc ? CN[cc] : 'Hentity ecosystem';
    return `<section class="ins-sec"><div class="kp-head"><p class="ins-h">Overview</p><p class="ins-s">${esc(where)} · ${period()}</p></div>
      <div class="kpis4">
        <div><p class="l">${icon('rocket', 'ic-16')}Startups live</p><b data-count-to="${D.live}">0</b><span class="delta ${D.live_week ? 'up' : 'flat'}">${D.live_week ? icon('upvote', 'ic-12') + n(D.live_week) + ' this week' : 'None new this week'}</span></div>
        <div><p class="l">${icon('calendar', 'ic-16')}Launched</p><b data-count-to="${D.launched}">0</b>${delta(D.launched, D.launched_prev, `<span class="d-only">${vsPrev()}</span>`)}</div>
        <div><p class="l">${icon('eye', 'ic-16')}Visitors</p><b data-count-to="${D.views}">0</b>${delta(D.views, D.views_prev)}</div>
        <div><p class="l">${icon('globe', 'ic-16')}Cities</p><b data-count-to="${D.cities}">0</b><span class="delta ${D.cities_new ? 'up' : 'flat'}">${D.cities_new ? icon('upvote', 'ic-12') + n(D.cities_new) + ' new' : 'No new cities'}</span></div>
      </div></section>`;
  }
  function heat() {
    const today = new Date(); today.setHours(12, 0, 0, 0);
    const start = new Date(today); start.setDate(start.getDate() - 364 - ((start.getDay() + 6) % 7));

  }
  function countries() {
    const L = (ALL || D).countries || [], top = L.slice(0, 6), rest = L.slice(6).reduce((a, c) => a + c.n, 0), max = Math.max(1, ...L.map(c => c.n));
    return `<div><p class="ins-h">Countries</p><p class="ins-s">Startups live by country</p><div class="clist">${top.map(c => `<a class="crow" href="/countries/${slug(CN[c.cc] || c.cc)}"><span class="bar" style="width:${Math.max(40, c.n / max * 100)}%">${flag(c.cc)}${esc(CN[c.cc] || c.cc)}</span><b>${n(c.n)}</b></a>`).join('') || '<p class="t-body-sm c-2">No products yet.</p>'}${L.length > 6 ? `<div class="crow"><span class="bar" style="width:40%">${L.length - 6} more</span><b>${n(rest)}</b></div>` : ''}</div></div>`;
  }
  function concentration() {
    const C = D.city_list || [], tot = Math.max(1, C.reduce((a, c) => a + c.n, 0)), top = C.slice(0, 3), share = Math.round(top.reduce((a, c) => a + c.n, 0) / tot * 100);
    const cols = ['#E2F200', '#AEE6FB', '#DDF4FD'];
    const S = D.stages || [], st = Math.max(1, S.reduce((a, s) => a + s.n, 0));
    return `<div class="concs"><p class="ins-h">Concentration</p><p class="ins-s">Share of startups in the top 3 cities</p>
      <div class="conc row gap-12" style="margin-top:14px;align-items:baseline"><b>${C.length ? share : 0}%</b><span class="t-caption c-2" style="font-weight:400">${esc(top.map(c => c.city).join(', ') || 'No cities yet')}</span></div>
      <div class="cbar">${top.map((c, i) => `<i style="width:${c.n / tot * 100}%;background:${cols[i]}"></i>`).join('')}<i style="flex:1;background:var(--color-bg-muted)"></i></div>
      <div class="row gap-12 wrap t-caption c-3" style="font-weight:400">${top.map((c, i) => `<span class="row gap-4"><i style="width:8px;height:8px;border-radius:2px;background:${cols[i]};display:inline-block"></i>${esc(c.city)} ${Math.round(c.n / tot * 100)}%</span>`).join('')}${C.length > 3 ? `<span>Rest ${100 - share}%</span>` : ''}</div>
      <p class="st-label" style="margin:18px 0 4px">By stage</p>${S.map(s => `<div class="stg"><span>${esc(s.stage)}</span><i style="width:${Math.max(6, s.n / st * 100)}px"></i><b>${Math.round(s.n / st * 100)}%</b></div>`).join('')}</div>`;
  }
  // Figma Insights treemap: biggest industries first, laid out in rows of 3, 4, 5, 5… Row height and tile
  // width follow the counts, softened so small industries still get a readable tile.
  function rowTree(items, W, Hh) {
    const L = items.slice().sort((a, b) => b.n - a.n), sizes = [3, 4, 5, 5, 6, 6, 8], rows = [];
    for (let i = 0, k = 0; i < L.length; k++) { const c = sizes[Math.min(k, sizes.length - 1)]; rows.push(L.slice(i, i + c)); i += c; }
    if (rows.length > 1 && rows[rows.length - 1].length < 3) rows[rows.length - 2].push(...rows.pop());   // no lonely last row
    const rw = rows.map(r => Math.sqrt(r.reduce((a, x) => a + Math.max(x.n, 0.5), 0))), MINH = 64;
    const tot = rw.reduce((a, b) => a + b, 0) || 1; let hs = rw.map(w => w / tot * Hh);
    const short = hs.filter(h => h < MINH).length;
    if (short && short < hs.length) { const spare = Hh - short * MINH, big = rw.filter((w, i) => hs[i] >= MINH).reduce((a, b) => a + b, 0) || 1; hs = rw.map((w, i) => hs[i] < MINH ? MINH : w / big * spare); }
    const out = []; let y = 0;
    rows.forEach((r, ri) => {
      const ww = r.map(x => Math.pow(Math.max(x.n, 0.5), 0.85)), wt = ww.reduce((a, b) => a + b, 0) || 1; let x = 0;
      r.forEach((it, i) => { const w = i === r.length - 1 ? W - x : Math.round(ww[i] / wt * W); out.push(Object.assign({}, it, { x, y, w, h: hs[ri] })); x += w; });
      y += hs[ri];
    });
    return out;
  }
  function squarify(items, W, Hh) {
    const out = [], area = W * Hh, total = items.reduce((a, i) => a + i.w, 0) || 1;
    let rest = items.map(i => Object.assign({}, i, { a: i.w / total * area })), x = 0, y = 0, w = W, h = Hh;
    const worst = (row, side) => { const s = row.reduce((a, r) => a + r.a, 0), mx = Math.max(...row.map(r => r.a)), mn = Math.min(...row.map(r => r.a)); return Math.max(side * side * mx / (s * s), (s * s) / (side * side * mn)); };
    while (rest.length) {
      const side = Math.min(w, h); let row = [rest[0]], i = 1;
      while (i < rest.length && worst(row.concat(rest[i]), side) <= worst(row, side)) { row.push(rest[i]); i++; }
      rest = rest.slice(i);
      const s = row.reduce((a, r) => a + r.a, 0);
      if (w >= h) { const cw = s / h; let cy = y; row.forEach(r => { const ch = r.a / cw; out.push(Object.assign(r, { x, y: cy, w: cw, h: ch })); cy += ch; }); x += cw; w -= cw; }
      else { const ch = s / w; let cx = x; row.forEach(r => { const cw = r.a / ch; out.push(Object.assign(r, { x: cx, y, w: cw, h: ch })); cx += cw; }); y += ch; h -= ch; }
    }
    return out;
  }
  // Colour follows the industry (H.CAT_COLOR), never its rank; everything else is "Other" grey
  const OTHER = H.CAT_OTHER, short = H.catShort;
  const pill = k => `<button class="ins-pill d-only" type="button" data-shareimg="${k}">${icon('image', 'ic-14')}Share as image</button>`;
  function industries(fullHeight) {
    const by = new Map((D.industries || []).map(i => [i.name, i]));
    const L = CATS.map(c => Object.assign({ name: c, n: 0, cur: 0, prev: 0 }, by.get(c) || {})).concat((D.industries || []).filter(i => !CATS.includes(i.name)));
    L.sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
    const minPos = Math.max(1, Math.min(...L.filter(i => i.n).map(i => i.n), 1));
    const growth = L.filter(i => i.cur >= 2).map(i => [i, i.prev ? (i.cur - i.prev) / i.prev : i.cur]).sort((a, b) => b[1] - a[1])[0];
    const fast = growth && growth[1] > 0 ? growth[0].name : null;
    const live = L.filter(i => i.n).length, keyed = L.filter(i => H.CAT_COLOR[i.name] && i.n), rest = L.some(i => !H.CAT_COLOR[i.name]);
    return `<section${fullHeight ? '' : ' class="ins-sec"'}><div class="ins-hd"><div><p class="ins-h">Industries</p><p class="ins-s d-only">${live} industr${live === 1 ? 'y' : 'ies'} · the main 8 have their own colour, the rest are Other</p></div>${pill('industries')}</div>
      <div class="tree" id="tree" data-items='${esc(JSON.stringify(L.map(i => ({ name: i.name, n: i.n, w: i.n || minPos * 0.35, cur: i.cur, prev: i.prev }))))}' data-fast="${esc(fast || '')}"></div>
      <div class="tlegend">${keyed.map((i, k) => `<a href="/categories/${slug(i.name)}"${k >= 7 ? ' class="dm"' : ''}><i style="background:${H.catColor(i.name)}"></i>${esc(short(i.name))}</a>`).join('')}${rest ? `<span class="dm"><i style="background:${OTHER}"></i>Other</span>` : ''}</div></section>`;
  }
  function drawTree() {
    const el = qs('#tree'); if (!el) return;
    let items = JSON.parse(el.dataset.items).filter(i => (i.name || '').trim()); const fast = el.dataset.fast;
    if (innerWidth <= 768) items = items.filter(i => i.n && H.CAT_COLOR[i.name]).slice(0, 7);   // phone: just the big coloured ones
    const W = el.clientWidth, Hh = el.clientHeight, G = 4;
    const cells = rowTree(items, W, Hh);
    el.innerHTML = cells.map(c => {
      const g = c.name === fast && c.prev ? Math.round((c.cur - c.prev) / c.prev * 100) : null;
      return `<a href="/categories/${slug(c.name)}" style="left:${c.x}px;top:${c.y}px;width:${Math.max(0, c.w - G)}px;height:${Math.max(0, c.h - G)}px;background:${H.catColor(c.name)};color:${H.catInk(c.name)}" title="${esc(c.name)}: ${c.n}"><span class="truncate">${esc(short(c.name).toLowerCase())}${c.name === fast ? ` ↑${g !== null ? g + '%' : ''}` : ''}</span>${c.w > 46 && c.h > 46 ? `<b>${n(c.n)}</b>` : ''}</a>`;
    }).join('');
  }
  function cities(limit) {
    const C = (D.city_list || []).slice(0, limit), max = Math.max(1, ...C.map(c => c.n));
    return `<section><div class="ins-hd"><div><p class="ins-h"><span class="m-only">Top c</span><span class="d-only">C</span>ities</p><p class="ins-s">${limit < (D.city_list || []).length ? `Top ${limit} of ${D.city_list.length} cities` : `${C.length} cities`} · startups live</p></div>${pill('cities')}</div>
      <div class="citylist" style="margin-top:12px">${C.map((c, i) => `<div class="r"><span class="n">${String(i + 1).padStart(2, '0')}</span>${flag(c.cc)}<span class="truncate">${esc(c.city)}</span><span class="tr"><i style="width:${c.n / max * 100}%;background:${i === 0 ? '#E2F200' : '#AEE6FB'}"></i></span><span class="v">${n(c.n)}</span><span class="p">${c.new ? '+' + c.new : ''}</span></div>`).join('') || '<p class="t-body-sm c-2" style="padding:10px 0">No cities yet.</p>'}</div></section>`;
  }
  function funding() {
    const S = D.stages || [], st = Math.max(1, S.reduce((a, s) => a + s.n, 0)), R = D.raised || [];
    return `<div class="ins-grid"><section><p class="ins-h">Startups by stage</p><p class="ins-s">${n(D.total)} startups · as set by their makers</p>
        <table class="ins-table" style="margin-top:12px"><tr><th>Stage</th><th class="num">Startups</th><th class="num">Share</th></tr>${S.map(s => `<tr><td>${esc(s.stage)}</td><td class="num">${n(s.n)}</td><td class="num">${Math.round(s.n / st * 100)}%</td></tr>`).join('')}</table></section>
      <section><p class="ins-h">Disclosed funding</p><p class="ins-s">From company profiles that list an amount raised</p>
        ${R.length ? `<table class="ins-table" style="margin-top:12px"><tr><th>Startup</th><th>Stage</th><th class="num">Raised</th></tr>${R.map(r => `<tr><td><a class="link" href="/products/${esc(r.slug)}">${esc(r.name)}</a></td><td>${esc(r.stage || '')}</td><td class="num">${esc(r.raised)}</td></tr>`).join('')}</table>` : `<p class="t-body-sm c-2" style="margin-top:12px">No startups have shared an amount raised yet. Makers can add it to their company profile when they submit.</p>`}</section></div>`;
  }
  function industriesTab() {
    const L = (D.industries || []).slice();
    return `<div class="ins-grid">${industries(true)}<section><p class="ins-h">All industries</p><p class="ins-s">${period()} compared with the period before</p>
      <table class="ins-table" style="margin-top:12px"><tr><th>Industry</th><th class="num">Startups</th><th class="num">New</th><th class="num">Before</th></tr>${L.map(i => `<tr><td><a class="link" href="/categories/${slug(i.name)}">${esc(i.name)}</a></td><td class="num">${n(i.n)}</td><td class="num">${n(i.cur)}</td><td class="num">${n(i.prev)}</td></tr>`).join('') || '<tr><td colspan="4" class="c-2">No products yet.</td></tr>'}</table></section></div>`;
  }

  // ---------------------------------------------------------------- Share as image
  const shareUrl = () => location.origin + '/insights' + (cc ? '?country=' + cc : '');
  const imgOpts = (kind, size, theme) => ({ kind, size, theme, cats: CATS, where: cc ? CN[cc] : '', periodLabel: ({ 7: 'this week', 30: 'in 30 days', 90: 'in 90 days', 365: 'this year' })[days] || `in ${days} days` });
  const fileName = (kind, size) => `hentity-insights-${kind}-${cc ? cc.toLowerCase() + '-' : ''}${size}.png`;
  async function makeFile(kind, size, theme) { const c = document.createElement('canvas'); await ShareImage.render(c, D, imgOpts(kind, size, theme)); const blob = await ShareImage.toBlob(c); return { blob, file: new File([blob], fileName(kind, size), { type: 'image/png' }) }; }
  function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
  const caption = () => `${cc ? 'Startups in ' + CN[cc] : 'The state of African startups'}, live on Hentity`;
  async function sendTo(app, kind, size, theme) {
    const { blob, file } = await makeFile(kind, size, theme);
    // Phones (and some desktops) can hand the PNG straight to WhatsApp, X or LinkedIn through the system share sheet
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], text: caption() + ' ' + shareUrl() }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    download(blob, file.name);
    const u = encodeURIComponent(shareUrl()), t = encodeURIComponent(caption());
    const links = { whatsapp: `https://wa.me/?text=${t}%20${u}`, x: `https://x.com/intent/post?text=${t}&url=${u}`, linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${u}` };
    if (links[app]) { window.open(links[app], '_blank', 'noopener'); toast('Image downloaded. Attach it to your post.'); } else toast('Image saved');
  }
  async function copyImage(kind, size, theme) {
    try { const { blob } = await makeFile(kind, size, theme); await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); toast('Image copied'); }
    catch (e) { toast('Your browser can’t copy images. Use Download instead.', 'error'); }
  }
  function openShare(kind) {
    if (!D || !window.ShareImage) return;
    (innerWidth <= 768 ? openSheet : openModal)(kind || 'industries');
  }
  function openModal(kind) {
    const st = { kind, size: 'square', theme: 'light' };
    const el = document.createElement('div'); el.className = 'scrim';
    el.innerHTML = `<div class="modal si" role="dialog" aria-modal="true" aria-label="Share as image">
      <div class="si-hd"><h2>Share as image</h2><button class="nav__icon" type="button" data-x aria-label="Close">${icon('x', 'ic-20')}</button></div>
      <div class="si-pv"><canvas id="si-main"></canvas><p class="si-cap" id="si-cap"></p></div>
      <div class="si-side">
        <p class="si-lbl">What to share</p>
        ${[['industries', 'Industries', 'Treemap with category colours'], ['cities', 'Top cities', 'Ranked bars'], ['numbers', 'Headline numbers', 'Startups live, cities, visitors'], ['full', 'Full snapshot', 'Everything on this page']].map(([k, t, d]) => `<button class="si-opt" type="button" role="radio" data-k="${k}"><span class="rd"></span><span><b>${t}</b><small>${d}</small></span></button>`).join('')}
        <p class="si-lbl" style="margin-top:8px">Size</p>
        <div class="si-sizes">${[['square', 'Square · feed'], ['story', 'Story · status'], ['wide', 'Wide · X, LinkedIn']].map(([k, t]) => `<button class="si-size" type="button" role="radio" data-s="${k}"><canvas></canvas>${t}</button>`).join('')}</div>
        <div class="si-row" style="margin-top:6px"><span class="si-lbl" style="flex:none;margin:0 6px 0 0">Theme</span><div class="chips" data-single style="flex:none">${['light', 'dark'].map(t => `<button class="chip" type="button" data-chip data-t="${t}" aria-pressed="${t === 'light'}">${icon('check')}${t === 'light' ? 'Light' : 'Dark'}</button>`).join('')}</div></div>
        <div class="si-row" style="margin-top:6px"><button class="btn btn--secondary btn--sm" data-app="whatsapp">${icon('chats', 'ic-16')}WhatsApp</button><button class="btn btn--secondary btn--sm" data-app="x">${icon('share', 'ic-16')}X</button><button class="btn btn--secondary btn--sm" data-app="linkedin">${icon('link', 'ic-16')}LinkedIn</button></div>
        <div class="si-row"><button class="btn btn--secondary" data-copy>${icon('copy', 'ic-16')}Copy image</button><button class="btn btn--primary" data-dl>${icon('download', 'ic-16')}Download PNG</button></div>
        <p class="si-note">Every image carries hentity.com/insights, the date and the CC BY 4.0 credit, so it can be reposted anywhere.</p>
      </div></div>`;
    document.body.appendChild(el);
    const close = () => { el.remove(); removeEventListener('keydown', esc); }, esc = e => { if (e.key === 'Escape') close(); };
    addEventListener('keydown', esc);
    el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-x]')) close(); });
    const main = el.querySelector('#si-main');
    let seq = 0;
    async function paint() {
      const my = ++seq;
      el.querySelectorAll('[data-k]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.k === st.kind)));
      el.querySelectorAll('[data-s]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.s === st.size)));
      el.querySelectorAll('[data-t]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === st.theme)));
      await ShareImage.render(main, D, imgOpts(st.kind, st.size, st.theme)); if (my !== seq) return;
      main.className = st.size;
      for (const b of el.querySelectorAll('[data-s]')) await ShareImage.render(b.querySelector('canvas'), D, imgOpts(st.kind, b.dataset.s, st.theme));
      const blob = await ShareImage.toBlob(main); if (my !== seq) return;
      const [w, h] = ShareImage.SIZES[st.size]; qs('#si-cap').textContent = `${w} × ${h} PNG · about ${Math.max(1, Math.round(blob.size / 1024))} KB`;
    }
    el.addEventListener('click', e => {
      const k = e.target.closest('[data-k]'), sz = e.target.closest('[data-s]'), t = e.target.closest('[data-t]'), app = e.target.closest('[data-app]');
      if (k) { st.kind = k.dataset.k; paint(); } else if (sz) { st.size = sz.dataset.s; paint(); } else if (t) { st.theme = t.dataset.t; paint(); }
      else if (app) sendTo(app.dataset.app, st.kind, st.size, st.theme);
      else if (e.target.closest('[data-copy]')) copyImage(st.kind, st.size, st.theme);
      else if (e.target.closest('[data-dl]')) makeFile(st.kind, st.size, st.theme).then(({ blob, file }) => download(blob, file.name));
    });
    paint();
  }
  function openSheet(kind) {
    const st = { kind, size: 'story' }, themeFor = s => s === 'story' ? 'dark' : 'light';
    const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.style.alignItems = 'end';
    const el = document.createElement('div'); el.className = 'ss'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Share as image');
    el.innerHTML = `<div class="grab"></div><h2>Share as image</h2>
      <div class="chips" data-single>${[['industries', 'Industries'], ['cities', 'Cities'], ['numbers', 'Numbers'], ['full', 'All']].map(([k, l]) => `<button class="chip" type="button" data-chip data-k="${k}">${icon('check')}${l}</button>`).join('')}</div>
      <div class="ss-pv">${['story', 'square', 'wide'].map(s => `<button type="button" data-s="${s}" aria-label="${s}"><canvas></canvas></button>`).join('')}</div>
      <div class="ss-act">
        <button type="button" data-app="whatsapp"><i style="background:#25D366">${icon('chats', 'ic-20')}</i>WhatsApp</button>
        <button type="button" data-app="status"><i style="background:#0a0a0a">${icon('image', 'ic-20')}</i>Status</button>
        <button type="button" data-app="x"><i style="background:#0a0a0a">${icon('share', 'ic-20')}</i>X</button>
        <button type="button" data-app="linkedin"><i style="background:#0A66C2">${icon('link', 'ic-20')}</i>LinkedIn</button>
        <button type="button" data-dl><i style="background:var(--color-bg-muted);color:var(--color-text-primary)">${icon('download', 'ic-20')}</i>Save</button>
      </div>`;
    document.body.append(scrim, el);
    const close = () => { el.remove(); scrim.remove(); };
    scrim.addEventListener('click', close);
    let seq = 0;
    async function paint() {
      const my = ++seq;
      el.querySelectorAll('[data-k]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === st.kind)));
      el.querySelectorAll('[data-s]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.s === st.size)));
      for (const b of el.querySelectorAll('[data-s]')) { if (my !== seq) return; await ShareImage.render(b.querySelector('canvas'), D, imgOpts(st.kind, b.dataset.s, themeFor(b.dataset.s))); }
    }
    el.addEventListener('click', e => {
      const k = e.target.closest('[data-k]'), sz = e.target.closest('[data-s]'), app = e.target.closest('[data-app]');
      if (k) { st.kind = k.dataset.k; paint(); } else if (sz) { st.size = sz.dataset.s; el.querySelectorAll('[data-s]').forEach(b => b.setAttribute('aria-checked', String(b === sz))); }
      else if (app) sendTo(app.dataset.app, st.kind, st.size, themeFor(st.size));
      else if (e.target.closest('[data-dl]')) makeFile(st.kind, st.size, themeFor(st.size)).then(({ blob, file }) => download(blob, file.name));
    });
    paint();
  }

  function render() {
    mobileCC();
    let html;
    document.body.classList.toggle('tab-founders', tab === 'founders'); document.body.classList.toggle('tab-explore', tab === 'explore');
    qs('#mtabs').innerHTML = [['overview', 'Overview'], ['founders', 'Founders'], ['funding', 'Funding'], ['explore', 'Explore'], ['industries', 'Industries'], ['cities', 'Cities']].map(([k, l]) => `<button class="chip" type="button" data-chip data-mt="${k}" aria-pressed="${k === tab}">${icon('check')}${l}</button>`).join('');
    if (tab === 'founders' || tab === 'explore') { if (!window.InsightsMore) { setTimeout(render, 120); return; } const ctx = { cc, CN, CATS, D: ALL || D }; window.InsightsMore[tab](qs('#view'), ctx); return; }
    if (tab === 'industries') html = industriesTab();
    else if (tab === 'cities') html = `<div class="ins-grid">${cities(40)}<div>${countries()}</div></div>`;
    else if (tab === 'funding') html = funding();
    else html = `<div class="ins-grid"><div>${kpis()}${heat()}<section class="ins-sec cc-sec" style="display:grid;grid-template-columns:1fr 1fr;gap:28px">${countries()}${concentration()}</section></div><div>${industries()}${cities(8)}</div></div>`;
    qs('#view').innerHTML = html;
    drawTree(); M.countUp && M.countUp(qs('#view'));
  }

  qs('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; tab = b.dataset.t; qsa('#tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b))); render(); load(); });
  qs('#cc').addEventListener('change', e => { cc = e.target.value; load(); });
  qs('#days').addEventListener('change', e => { days = +e.target.value; ALL = null; load(); });
  qs('#mtabs').addEventListener('click', e => { const b = e.target.closest('[data-mt]'); if (!b) return; tab = b.dataset.mt; qsa('#tabs button').forEach(x => x.setAttribute('aria-selected', String(x.dataset.t === tab))); load(); });
  qs('#ccm').addEventListener('click', e => { const b = e.target.closest('[data-cc]'); if (!b) return; cc = b.dataset.cc; qs('#cc').value = cc; load(); });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawTree, 150); });
  qsa('[data-share]').forEach(b => b.onclick = () => openShare(innerWidth <= 768 ? 'numbers' : 'industries'));
  qs('#view').addEventListener('click', e => { const b = e.target.closest('[data-shareimg]'); if (b) openShare(b.dataset.shareimg); });
  qs('#embed').onclick = () => { const u = `${location.origin}/insights?embed=1${cc ? '&country=' + cc : ''}`; const code = `<iframe src="${u}" width="100%" height="900" style="border:0" title="The state of African startups | Hentity"></iframe>`; navigator.clipboard && navigator.clipboard.writeText(code).catch(() => {}); toast('Embed code copied'); };
  qs('#csv').onclick = () => {
    if (!D) return;
    const rows = [['section', 'name', 'value', 'new_in_period'], ['overview', 'startups_live', D.live, D.live_week], ['overview', 'launched', D.launched, ''], ['overview', 'page_views', D.views, ''], ['overview', 'cities', D.cities, D.cities_new],
      ...(D.industries || []).map(i => ['industry', i.name, i.n, i.cur]), ...(D.countries || []).map(c => ['country', CN[c.cc] || c.cc, c.n, '']), ...(D.city_list || []).map(c => ['city', `${c.city} (${c.cc})`, c.n, c.new]), ...(D.stages || []).map(s => ['stage', s.stage, s.n, ''])];
    const csv = rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = `hentity-insights-${cc || 'africa'}-${days}d.csv`; a.click();
  };
  await API.ready; load();
})();
</script>
</body>
</html>
