/* Boot guard: hide the plain server-rendered copy while the app starts, report scripts that fail to load or run,
   and if the app never starts, reload once and then fall back to the readable server copy. */
(function () {
  var d = document.documentElement, n = 0; d.classList.add('js-boot');
  function log(m, s) { if (n++ > 3) return; try { fetch('https://sislzikhjapilksictxd.supabase.co/rest/v1/client_errors', { method: 'POST', keepalive: true, headers: { apikey: 'sb_publishable_49iWYS0Wr9kVY_PfDQphww_jj9dRaBz', 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ path: location.pathname.slice(0, 300), msg: String(m).slice(0, 600), src: String(s || '').slice(0, 400), ua: navigator.userAgent.slice(0, 300) }) }).catch(function () {}); } catch (e) {} }
  window.addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) log('failed to load', t.src || t.href); else if (e.message) log(e.message, (e.filename || '') + ':' + (e.lineno || '')); }, true);
  // A page that fails while loading its data shows the readable server copy instead of a blank screen
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason || {}; log('unhandled: ' + (r.message || r), (r.stack || '').split('\n')[1] || ''); if (!(window.performance && performance.getEntriesByName('hentity:content').length)) d.classList.remove('js-boot'); });

    try { if (!sessionStorage.getItem('h-reload')) { sessionStorage.setItem('h-reload', '1'); location.reload(); } } catch (e) {} }
  window.addEventListener('load', function () { setTimeout(check, 1500); });
  setTimeout(function () { if (d.classList.contains('js-boot') && document.querySelector('[data-ssr]')) log('content not shown after 5s', 'ready=' + !!(window.performance && performance.getEntriesByName('hentity:ready').length)); d.classList.remove('js-boot'); check(); }, 5000);
})();

<script>
H.mount({ active: 'funding', tab: 'you' });
(async function () {
  const { qs, esc, icon, toast, plogo, verified } = H;
  const root = qs('#main');
  await API.ready;
  let mode = H.params().get('tab') === 'equity' ? 'equity' : 'grant';
  const F = { view: '', quick: '', cat: '', cc: '', stage: '', amount: '' };
  // A best match meets most of what the funder asks for (60%+). Everyone can still browse every opportunity.
  const isBest = o => o.total ? o.meets / o.total >= 0.6 : false;
  const CATS = ['Fintech', 'SaaS', 'Apps', 'AI', 'Commerce', 'Productivity', 'Dev Tools', 'Health', 'Education', 'Agriculture', 'Logistics', 'Infrastructure', 'Energy & Climate'];
  const STAGES = ['Idea', 'Pre-seed', 'Seed', 'Series A', 'Series B+'];
  const counts = await (async () => { try { const r = await API.sb.from('funding_opps').select('mode').eq('active', true); return { grant: (r.data || []).filter(x => x.mode === 'grant').length, equity: (r.data || []).filter(x => x.mode === 'equity').length }; } catch (e) { return { grant: 0, equity: 0 }; } })();
  const toggle = c => `<div class="fu-toggle" role="group" aria-label="Grants or equity"><button type="button" data-mode="grant" aria-pressed="${mode === 'grant'}">${icon('star', 'ic-16 ic-star')}Grants <span class="n">${c.grant}</span></button><button type="button" data-mode="equity" aria-pressed="${mode === 'equity'}">${icon('bar-chart', 'ic-16')}Equity <span class="n">${c.equity}</span></button></div>`;
  const subtitle = name => mode === 'grant' ? `Grants, prizes and competitions you don’t pay back. ${name ? 'Matched to ' + esc(name) + '.' : 'Matched to your product.'}` : `Investors, angel networks and accelerators backing African startups. ${name ? 'Matched to ' + esc(name) + '.' : 'Matched to your product.'}`;

  // ------------------------------------------------ locked (signed out, or no listed product)
  const products = API.uid ? await API.myFundingProducts().catch(() => []) : [];
  if (!API.uid || !products.length) {
    const fake = Array.from({ length: 4 }, (_, i) => `<div class="card fu-card"><div class="row gap-12"><span class="fu-logo" style="width:36px;height:36px;background:${['#F87171', '#FBBF24', '#34D399', '#60A5FA'][i]}"></span><div class="stack gap-4"><span class="skel" style="width:160px;height:12px"></span><span class="skel" style="width:110px;height:10px"></span></div></div><span class="skel" style="width:120px;height:20px"></span><div class="fu-chips"><span class="fu-chip">— days left</span><span class="fu-chip">Category</span><span class="fu-chip">Stage</span></div><div class="fu-foot">${'<span class="fu-dots"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span>'}</div></div>`).join('');
    const signed = !!API.uid;
    root.innerHTML = `<div class="fu-head"><div><h1>Funding</h1><p class="fu-sub">${subtitle('')}</p></div>${toggle(counts)}</div>
      <div class="fu-lock" style="margin-top:24px"><div class="fu-blur"><div class="fu-filters">${['Best match', 'Closing soon', 'Women-founded', 'Non-dilutive', 'Competitions'].map(x => `<span class="chip">${x}</span>`).join('')}</div><div class="fu-cards">${fake}</div></div>
        <div class="card fu-lockcard"><span class="icon-badge" style="background:var(--color-accent-subtle,#fff1ea);color:var(--color-accent-default)">${icon('lock')}</span>
          <h2 class="t-h3" style="margin-top:16px">List your product to unlock Funding</h2>
          <p class="t-body-sm c-2" style="margin-top:10px">We match grants and investors to your product’s category, stage, country and team. ${counts.grant} grant${counts.grant === 1 ? '' : 's'} and ${counts.equity} investor${counts.equity === 1 ? '' : 's'} are on Hentity right now.</p>
          <div class="fu-steps"><div class="fu-step ${signed ? 'done' : 'now'}"><i>${signed ? icon('check', 'ic-12') : ''}</i><span>${signed ? 'Create your account' : 'Sign in or create your account'}</span></div>
            <div class="fu-step ${signed ? 'now' : 'todo'}"><i></i><span>List or claim your product<small>Takes about 5 minutes</small></span></div>
            <div class="fu-step todo"><i></i><span>Add stage, country and founding team<small>Needed for matching</small></span></div></div>
          ${signed ? `<div class="grid-2" style="gap:8px"><a class="btn btn--accent" href="/submit">${icon('plus')}List your product</a><a class="btn btn--secondary" href="/directory?profile=unclaimed">Claim your startup</a></div><p class="t-caption c-3" style="font-weight:400;margin-top:12px">Your startup may already be on Hentity. Claiming takes a minute.</p>`
            : `<div class="grid-2" style="gap:8px"><a class="btn btn--accent" href="/signup?next=/funding">Create account</a><a class="btn btn--secondary" href="/signin?next=/funding">Sign in</a></div>`}
        </div></div>`;
    root.addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) { mode = b.dataset.mode; root.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); root.querySelector('.fu-sub').innerHTML = subtitle(''); } });
    H.contentShown && H.contentShown(); return;
  }

  // ------------------------------------------------ board
  let pid = FU.pickPid(products), B = null;
  const PAGE = 48;   // render in pages: the catalogue runs to hundreds of funders
  async function load() {
    root.style.opacity = B ? .6 : 1;
    try { B = await API.fundingBoard(pid, mode); } catch (e) { H.fail(e); return; }
    root.style.opacity = 1; FU.setPid(pid);
    const u = new URLSearchParams(location.search); mode === 'equity' ? u.set('tab', 'equity') : u.delete('tab'); history.replaceState(null, '', location.pathname + (u.toString() ? '?' + u : ''));
    render();
  }
  function filtered() {
    let L = B.opps.slice();
    if (F.view === 'best') L = L.filter(isBest);
    const q = F.quick;
    if (q === 'soon') L = L.filter(o => o.deadline).sort((a, b) => a.deadline.localeCompare(b.deadline));
    if (q === 'women') L = L.filter(o => o.women_only);
    if (q === 'nondil') L = L.filter(o => /non-?dilutive|non-refundable|equity-free/i.test(o.amount_note + ' ' + o.amount_text) || ['grant', 'prize'].includes(o.kind));
    if (q === 'comp') L = L.filter(o => ['competition', 'prize'].includes(o.kind));
    if (q === 'form') L = L.filter(o => o.apply_url && o.apply_url !== o.website);
    if (q === 'angel') L = L.filter(o => o.kind === 'angel');
    if (q === 'vc') L = L.filter(o => ['vc', 'micro_vc'].includes(o.kind));
    if (q === 'acc') L = L.filter(o => o.kind === 'accelerator');
    if (F.cat) L = L.filter(o => !o.categories.length || o.categories.includes(F.cat));
    if (F.cc) L = L.filter(o => !o.countries.length || o.countries.includes(F.cc));
    if (F.stage) L = L.filter(o => !o.stages.length || o.stages.includes(F.stage));
    if (F.amount) L = L.filter(o => (o.amount_usd || 0) >= +F.amount);
    return L;
  }
  function render() {
    const p = B.product, all = filtered(), L = all.slice(0, F.limit || PAGE);
    if (!F.view) F.view = B.opps.some(isBest) ? 'best' : 'all';
    const nBest = B.opps.filter(isBest).length;
    const quick = mode === 'grant' ? [['soon', 'Closing soon'], ['women', 'Women-founded'], ['nondil', 'Non-dilutive'], ['comp', 'Competitions']] : [['form', 'Online form'], ['angel', 'Angels'], ['vc', 'VC funds'], ['acc', 'Accelerators']];
    const sel = (k, label, opts) => `<label class="fu-sel"><select data-f="${k}" aria-label="${label}"><option value="">${label}</option>${opts.map(([v, l]) => `<option value="${esc(v)}"${F[k] === String(v) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>${icon('chevron-down', 'ic-14')}</label>`;
    const tr = B.tracked || [];
    root.innerHTML = `<div class="fu-head"><div><h1 class="row gap-12">${'<a class="nav__icon m-only" href="/me" aria-label="Back" style="margin-left:-8px">' + icon('arrow-left') + '</a>'}Funding</h1><p class="fu-sub">${subtitle(p.name)}</p></div>${toggle(B.counts)}</div>
      <div class="fu-prod">${plogo(p)}<div style="min-width:0"><p class="t-label row gap-6"><span class="truncate">Matching for ${esc(p.name)}</span>${p.verified ? verified('verified--sm') : ''}</p><p class="t-caption c-3 meta" style="font-weight:400;margin-top:2px">${esc(FU.productLine(p))}${!p.team || !p.stage || !p.country ? ` · <a class="link link--accent" href="/products/${p.slug}/edit">Add missing details</a>` : ''}</p></div>
        <span class="fu-switch">${products.length > 1 ? `<span class="d-only">Switch product</span><span class="m-only">${icon('chevron-down', 'ic-16')}</span><select id="pick" aria-label="Switch product">${products.map(x => `<option value="${x.id}"${x.id === pid ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : `<a href="/products/${p.slug}/edit" class="d-only" style="color:inherit">Edit details</a>`}</span></div>
      <div class="tabs fu-tabs" role="tablist" aria-label="Which opportunities"><button class="tab" type="button" role="tab" data-view="best" aria-selected="${F.view === 'best'}">Best match <span class="c-3">${nBest}</span></button><button class="tab" type="button" role="tab" data-view="all" aria-selected="${F.view === 'all'}">All opportunities <span class="c-3">${B.opps.length}</span></button></div>
      <div class="fu-filters">${quick.map(([k, l]) => `<button class="chip" type="button" data-q="${k}" aria-pressed="${F.quick === k}">${icon('check')}${l}</button>`).join('')}
        ${sel('cat', 'Category', CATS.map(c => [c, c]))}${sel('cc', 'Country', Object.entries(FU.CN))}${sel('stage', 'Stage', STAGES.map(s => [s, s]))}${sel('amount', 'Amount', [[5000, '$5k+'], [25000, '$25k+'], [100000, '$100k+'], [500000, '$500k+']])}</div>
      <div class="fu-grid"><div>${L.length ? (mode === 'grant' ? `<div class="fu-cards">${L.map(card).join('')}</div>` : table(L)) + (all.length > L.length ? `<div style="text-align:center;margin-top:16px"><button class="btn btn--secondary" type="button" id="more">Show more <span class="c-3">${all.length - L.length} left</span></button></div>` : '') : `<div class="card fu-empty">${icon('search', 'ic-20')}<p style="margin-top:8px">${F.view === 'best' && !nBest ? `Nothing fits ${esc(B.product.name)} closely yet.` : 'Nothing matches these filters yet.'}</p><p class="t-body-sm c-3" style="margin-top:4px">${F.view === 'best' ? '<button class="link link--accent" type="button" data-view="all">See all opportunities</button>' : B.opps.length ? 'Try clearing a filter.' : 'Hentity adds new rounds as they open. Check back soon.'}</p></div>`}</div>
        <aside class="fu-side">
          <div class="card"><p class="t-label">Saved and applied</p>${tr.length ? tr.map(a => { const s = FU.TRACK[a.status] || [a.status, '']; const d = FU.daysLeft(a.deadline); return `<a class="fu-app" href="/funding/${a.opp_id}?p=${pid}"><span style="min-width:0"><span class="truncate" style="display:block">${esc(a.name)}</span><span class="t-caption ${a.status === 'saved' && d != null && d >= 0 && d < 10 ? 'fu-red' : 'c-3'}" style="font-weight:400">${esc(FU.deadlineText(a))}</span></span><span class="badge ${a.status === 'applied' && a.closed ? 'badge--success' : 'badge--' + s[1]}">${s[0]}</span></a>`; }).join('') : `<p class="t-body-sm c-3" style="margin-top:8px">Nothing yet. Save ${mode === 'grant' ? 'a grant' : 'an investor'} or mark one as applied to track it here, with reminders before deadlines.</p>`}</div>
        </aside></div>`;
    H.contentShown && H.contentShown();
  }
  function card(o) {
    const strong = o.meets === o.total, open = FU.isOpen(o);
    const cats = o.categories.length ? o.categories.slice(0, 2).join(', ') : 'Any category';
    const stg = o.stages.length ? (o.stages.length > 1 ? o.stages[0] + '–' + o.stages[o.stages.length - 1] : o.stages[0]) : 'Any stage';
    return `<article class="card fu-card lift"><div class="row gap-12" style="padding-right:${API.isAdmin ? 64 : 28}px">${FU.logo(o, 36)}<div style="min-width:0"><a class="t-label truncate" style="display:block" href="/funding/${o.id}?p=${pid}">${esc(o.name)}</a><p class="t-caption c-3 truncate" style="font-weight:400">${esc(o.org || FU.KIND[o.kind])}</p></div></div>
      ${FU.editBtn(o, 'fu-edit')}<button class="nav__icon fu-save" type="button" data-save="${o.id}" aria-pressed="${!!o.track}" aria-label="${o.track ? 'Saved' : 'Save'}">${icon('bookmark', 'ic-18')}</button>
      <p class="fu-amt">${esc(o.amount_text || '—')}<small>${esc(o.amount_note || FU.KIND[o.kind])}</small></p>
      <div class="fu-chips">${isBest(o) ? `<span class="fu-best">${icon('star', 'ic-12')}Best match</span>` : ''}${FU.deadlineChip(o)}<span class="fu-chip">${esc(cats)}</span><span class="fu-chip">${esc(stg)}</span><span class="fu-chip">${esc(o.region_label || 'All of Africa')}</span>${o.women_only ? '<span class="fu-chip">Women-founded or mixed</span>' : ''}</div>
      <div class="fu-foot">${FU.dots(o)}<span class="${strong ? 'fu-strong' : ''}">${esc(B.product.name)} meets ${o.meets} of ${o.total}</span>
        ${o.track && o.track.status === 'applied' ? `<a class="btn btn--sm btn--ghost" href="/funding/${o.id}?p=${pid}">${icon('check', 'ic-14')}Applied</a>`
          : strong && open ? `<a class="btn btn--sm btn--accent" href="${esc(FU.applyUrl(o))}" target="_blank" rel="noopener" data-go="${o.id}">${icon('arrow-up-right', 'ic-14')}Apply on site</a>`
          : `<a class="btn btn--sm btn--secondary" href="/funding/${o.id}?p=${pid}">View</a>`}</div></article>`;
  }
  function table(L) {
    return `<div class="fu-table"><div class="fu-tr fu-th d-only" style="border-top:0"><span>Investor</span><span>Cheque · Stage</span><span>Sectors</span><span style="text-align:right">Fit</span><span></span></div>
      ${L.map(o => { const f = FU.fit(o), d = FU.daysLeft(o.deadline), applied = o.track && o.track.status === 'applied';
        return `<div class="fu-tr" data-inv="${o.id}"><span class="fu-mlogo">${FU.logo(o, 36)}</span><div class="row gap-12" style="min-width:0"><span class="d-only">${FU.logo(o, 36)}</span><div style="min-width:0"><span class="row gap-4" style="align-items:center"><button class="t-label fu-inv" type="button" data-inv="${o.id}">${esc(o.name)}</button>${FU.editBtn(o, 'fu-edit-sm')}</span><p class="t-caption c-3" style="font-weight:400">${esc(FU.KIND[o.kind])}${o.amount_note && o.kind === 'accelerator' && o.amount_note.split('·')[0].trim().length <= 24 ? ' · ' + esc(o.amount_note.split('·')[0].trim()) : ''} · ${esc(o.region_label || 'Africa')}<span class="m-only">${esc(o.amount_text)}</span></p></div></div>
          <div class="fu-cq"><p class="fu-cheque">${esc(o.amount_text || 'Not disclosed')}</p><p class="t-caption c-3" style="font-weight:400">${esc(o.stages.join(', ') || 'Any stage')}</p></div>
          <div class="fu-chips fu-sect">${(o.categories.length ? o.categories : ['Any category']).slice(0, 3).map(c => `<span class="fu-chip">${o.categories.length ? `<i style="width:6px;height:6px;border-radius:50%;background:${H.catColor ? H.catColor(c) : '#999'}"></i>` : ''}${esc(c)}</span>`).join('')}</div>
          <div class="fu-fit"><span class="badge ${isBest(o) ? 'badge--success' : ''}">${isBest(o) ? icon('star', 'ic-12') + 'Best match' : f[0]}</span><span class="t-caption c-3" style="font-weight:400">${FU.howLabel(o)}</span><span class="t-caption" style="font-weight:400;color:${d != null ? (d < 10 ? '#B42318' : '#8A5A00') : 'var(--color-text-tertiary)'}">${esc(FU.deadlineText(o))}</span></div>
          <div class="fu-act" style="text-align:right">${applied ? `<button class="btn btn--sm btn--ghost" type="button" data-inv="${o.id}">${icon('check', 'ic-14')}Applied</button>` : `<a class="btn btn--sm ${f[1] === 'success' ? 'btn--primary' : 'btn--secondary'}" href="${esc(FU.applyUrl(o))}" target="_blank" rel="noopener" data-go="${o.id}">${icon('arrow-up-right', 'ic-14')}Apply on site</a>`}</div></div>`; }).join('')}</div>`;
  }
  root.addEventListener('click', async e => {
    const ed = e.target.closest('[data-edit]'); if (ed) { e.preventDefault(); e.stopPropagation(); const o = B.opps.find(x => x.id === ed.dataset.edit); if (o) FU.editSheet(o, load); return; }
    if (e.target.closest('#more')) { F.limit = (F.limit || PAGE) + PAGE; render(); return; }
    const m = e.target.closest('[data-mode]'); if (m) { mode = m.dataset.mode; F.quick = ''; F.view = ''; F.limit = 0; load(); return; }
    const v = e.target.closest('[data-view]'); if (v) { F.view = v.dataset.view; F.limit = 0; render(); return; }
    const q = e.target.closest('[data-q]'); if (q) { F.quick = F.quick === q.dataset.q ? '' : q.dataset.q; F.limit = 0; render(); return; }
    const s = e.target.closest('[data-save]'); if (s) { e.preventDefault(); const o = B.opps.find(x => x.id === s.dataset.save); const on = !o.track; try { if (on) await API.fundingTrack(o.id, pid, { status: 'saved', remind: true }); else await API.fundingUntrack(o.id); toast(on ? 'Saved. We’ll remind you before it closes.' : 'Removed from saved'); load(); } catch (er) { H.fail(er); } return; }
    // Opening a funder's site saves it to the tracker
    const g = e.target.closest('[data-go]'); if (g) { const o = B.opps.find(x => x.id === g.dataset.go); if (o && !o.track) API.fundingTrack(o.id, pid, { status: 'saved', remind: true }).then(load).catch(() => {}); return; }
    const iv = e.target.closest('[data-inv]'); if (iv && !e.target.closest('a')) { const o = B.opps.find(x => x.id === iv.dataset.inv); if (o) FU.investorSheet(o, B.product, pid, load); return; }
  });
  root.addEventListener('change', e => { const f = e.target.dataset.f; if (f) { F[f] = e.target.value; F.limit = 0; render(); } if (e.target.id === 'pick') { pid = e.target.value; load(); } });
  load();
})();
</script>
</body>
</html>
