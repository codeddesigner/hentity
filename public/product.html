<style>
.pp{max-width:1136px;margin:0 auto;padding:24px 56px 96px;box-sizing:content-box}
.crumbs{margin-bottom:24px}
.pp-top{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:48px}
.stage{position:relative;aspect-ratio:672/394;border-radius:20px;background:#000;display:grid;place-items:center;overflow:hidden;transition:background .4s}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .35s}
.stage .btn{position:relative;z-index:1;border-radius:999px}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.thumbs button{aspect-ratio:126/72;border-radius:var(--radius-md);border:2px solid transparent;background-size:cover;background-position:center;transition:transform .2s,border-color .2s}
.thumbs button:hover{transform:translateY(-2px)}
.thumbs button[aria-selected="true"]{border-color:var(--color-accent-default)}
.award{display:inline-flex;align-items:center;gap:10px;height:30px;padding:0 14px 0 8px;border-radius:999px;border:1px solid var(--color-border-default);font-size:13px;font-weight:500}
.award i{width:16px;height:16px;border-radius:50%}
.facts{display:grid;grid-template-columns:repeat(5,1fr);margin-top:28px;border:1px solid var(--color-border-default);border-radius:var(--radius-lg);background:var(--color-bg-subtle)}
.facts>div{padding:20px;border-left:1px solid var(--color-border-default);display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:18px;font-weight:500}
.facts>div:first-child{border-left:0}
.pp-body{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px;margin-top:28px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0 32px}
.kpi{padding:16px;border-radius:var(--radius-md);border:1px solid var(--color-border-default)}
.kpi b{display:block;font-size:20px;line-height:26px;font-weight:600;letter-spacing:-0.015em}
.kv{display:flex;justify-content:space-between;font-size:13px;line-height:18px;padding:6px 0}
.kv span:first-child{color:var(--color-text-secondary)}
.badge--founder{background:#000;color:#fff}
:root[data-theme="dark"] .badge--founder{background:#fff;color:#000}
.share{display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:13px;font-weight:500}
.share button,.share a{display:inline-flex;align-items:center;gap:6px;min-height:32px}
.share a:hover,.share button:hover{color:var(--color-accent-default)}
@media (max-width:1180px){.pp{padding:24px 32px 80px}}
@media (max-width:1024px){.pp-top,.pp-body{grid-template-columns:minmax(0,1fr)}.pp-top>:last-child{order:-1}.pp-top{gap:24px}.facts{grid-template-columns:repeat(2,1fr)}.facts>div{border-left:0;border-top:1px solid var(--color-border-default)}.facts>div:first-child{border-top:0}}
@media (max-width:768px){.pp{padding:12px 16px 32px}.kpis{grid-template-columns:repeat(2,1fr)}.facts{grid-template-columns:minmax(0,1fr)}.pp-title{font-size:32px!important;line-height:38px!important}.crumbs{display:none}}
</style>

<main class="pp" id="pp">

<script>
H.mount({ active: 'products', tab: 'products' });
(async function () {
  const { qs, qsa, icon, flag, verified, esc, toast, plogo, avatar } = H;
  const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || H.params().get('p') || '');
  await API.ready;
  let p;
  try { p = await API.product(slug); } catch (e) { H.fail(e); }
  if (!p) { document.title = 'Product not found · Hentity'; qs('#pp').innerHTML = `<div style="padding:96px 0;text-align:center" class="reveal"><h1 class="t-h2">We couldn’t find that product</h1><p class="c-2" style="margin:8px 0 20px">It may have been renamed, unpublished, or it’s still in review.</p><a class="btn btn--primary" href="/">Back to this week’s launches</a></div>`; return; }
  document.title = `${p.name} · ${p.tagline} · Hentity`;
  if (p.status === 'unclaimed') return unclaimed(p);
  D.remember([p]);
  // Everything public comes in one parallel batch (instant when the server preloaded it); the member's own
  // state (votes, follows) is a second parallel batch instead of a chain of round trips.
  const [makers, company, cur, alts, isSaved, comments, ownerRows, rankRows] = await Promise.all([API.makers(p.id), API.company(p.company_id), API.currentWeek(), API.alternatives(p).catch(() => []), API.isBookmarked('product', p.id), API.comments({ product: p.id }), p.owner_id ? API.profilesByIds([p.owner_id]) : [], D.isLive(p) ? API.board({ week: p.week_id }) : []]);
  const owner = ownerRows[0] || null;
  const team = [owner && { user: owner, role: 'Founder' }, ...makers.filter(m => !owner || m.user.id !== owner.id)].filter(Boolean);
  const makerIds = new Set(team.map(m => m.user.id));
  const [following, followingProduct] = await Promise.all([API.following('user', [...makerIds]), API.following('product', [p.id]), D.loadVotes([p])]);
  let rank = 0;
  if (D.isLive(p)) rank = rankRows.filter(x => !x.promoted).findIndex(x => x.id === p.id) + 1;
  const live = D.isLive(p);
  const media = (p.media && p.media.length ? p.media : [{ color: p.color }]).slice(0, 5);
  const mediaStyle = m => m.url ? `background-image:url('${esc(m.url)}')` : `background:${esc(m.color || '#000')}`;
  const weekDate = p.launch_date ? new Date(p.launch_date + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'long', month: 'short', day: 'numeric', timeZone: 'UTC' }) : p.week_starts_at ? new Date(p.week_starts_at).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' }) : '';
  const voteLabel = () => (D.voted.has(p.id) ? 'Upvoted · ' : 'Upvote · ') + D.fmt(p.upvote_count);
  qs('#pp').innerHTML = `
  <nav class="crumbs reveal" aria-label="Breadcrumb"><a href="/">Discover</a><span>/</span><a href="${(p.categories || [])[0] ? '/categories/' + (p.categories[0]).toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') : '/directory'}">${esc((p.categories || [])[0] || 'Products')}</a><span>/</span><span aria-current="page">${esc(p.name)}</span></nav>
  <div class="pp-top">
    <div class="reveal" style="--i:1">
      <div class="stage" id="stage" style="${media[0].url ? '' : mediaStyle(media[0])}">${media[0].url ? `<img src="${esc(media[0].url)}" alt="${esc(p.name)} screenshot 1">` : ''}${p.video_url ? `<a class="btn btn--secondary" href="${esc(p.video_url)}" target="_blank" rel="noopener">${icon('video')}Watch the demo</a>` : ''}</div>
      <div class="thumbs" role="tablist" aria-label="Gallery">${media.map((m, i) => `<button role="tab" aria-selected="${i === 0}" aria-label="Image ${i + 1}" style="${mediaStyle(m)}" data-i="${i}"></button>`).join('')}</div>
    </div>
    <div class="stack gap-20 reveal" style="--i:2">
      ${plogo(p, 64)}
      <div><h1 class="pp-title" style="font-size:44px;line-height:50px;font-weight:600;letter-spacing:-0.03em">${esc(p.name)}${p.verified ? `<span style="display:inline-flex;vertical-align:middle;margin-left:10px;position:relative;top:-3px">${verified('ic-24')}</span>` : ''}</h1><p class="t-body-lg c-2" style="margin-top:10px">${esc(p.tagline)}</p></div>
      ${rank && rank <= 3 ? `<div class="stack gap-8" style="align-items:flex-start"><span class="award"><i style="background:var(--award-${['gold', 'silver', 'bronze'][rank - 1]})"></i>#${rank} this week${p.week_id === (cur && cur.id) ? ' · live now' : ''}</span></div>` : `<div class="row gap-8 wrap">${(p.categories || []).map(c => `<a class="badge" href="/categories/${c.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}">${esc(c)}</a>`).join('')}${!live && p.status === 'scheduled' ? `<span class="badge badge--upcoming">Launches ${weekDate}</span>` : ''}</div>`}
      <div class="grid-2" style="gap:12px">
        ${p.website ? `<a class="btn btn--secondary btn--lg" href="${esc(p.website)}" target="_blank" rel="noopener" id="getit">${icon('arrow-up-right')}Visit website</a>` : ''}
        ${live ? `<button class="btn btn--lg ${D.voted.has(p.id) ? 'btn--secondary' : 'btn--accent'}" type="button" id="vote" data-vote-big>${icon('upvote')}<span id="vote-l">${voteLabel()}</span></button>` : p.status === 'scheduled' ? `<button class="btn btn--accent btn--lg" type="button" id="notify">${icon('bell')}Notify me on launch day</button>` : `<button class="btn btn--secondary btn--lg" type="button" id="follow-p">${icon('plus')}Follow</button>`}
      </div>
      <div id="beta-callout"></div>
      <span class="here" id="here" hidden><i></i><span id="here-n"></span></span>
      <div class="share"><span class="c-3" style="font-weight:400">Share</span>
        <a href="https://wa.me/?text=${encodeURIComponent(p.name + ' on Hentity ' + location.href)}" target="_blank" rel="noopener">${icon('share', 'ic-14')}WhatsApp</a>
        <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(location.href)}" target="_blank" rel="noopener">${icon('share', 'ic-14')}LinkedIn</a>
        <a href="https://x.com/intent/post?url=${encodeURIComponent(location.href)}&text=${encodeURIComponent(p.name + ' — ' + p.tagline)}" target="_blank" rel="noopener">${icon('share', 'ic-14')}X</a>
        <button type="button" id="copy">${icon('link', 'ic-14')}Copy link</button>
        <button type="button" id="save" aria-pressed="${isSaved}">${icon('bookmark', 'ic-14')}<span>${isSaved ? 'Saved' : 'Save'}</span></button></div>
    </div>
  </div>
  <div class="facts" data-scroll-reveal>
    <div><span class="t-eyebrow c-3">Countries</span><span class="row gap-4">${(p.countries && p.countries.length ? p.countries : [p.country]).map(flag).join('')}</span><span>${(p.countries && p.countries.length ? p.countries : [p.country]).map(c => H.COUNTRY[c] || c).join(', ')}</span></div>
    <div><span class="t-eyebrow c-3">Pay with</span><span>${esc((p.pay_methods || []).join(' · ') || '—')}</span></div>
    <div><span class="t-eyebrow c-3">Currencies</span><span>${esc(p.currencies || '—')}</span></div>
    <div><span class="t-eyebrow c-3">Languages</span><span>${esc(p.languages || '—')}</span></div>
    <div><span class="t-eyebrow c-3">Platforms</span><span>${esc(p.platforms || '—')}</span></div>
  </div>
  <div class="pp-body">
    <div>
      <p class="t-eyebrow c-3" style="margin-bottom:12px">About this launch</p>
      <p class="c-2" style="max-width:68ch;white-space:pre-line">${esc(p.description || p.tagline)}</p>
      <div id="beta"></div>
      <div class="kpis">
        <div class="kpi lift card" data-scroll-reveal><b data-count-to="${p.upvote_count}" id="kpi-votes">0</b><span class="t-caption c-2" style="font-weight:400">upvotes</span></div>
        <div class="kpi lift card" data-scroll-reveal><b data-count-to="${p.comment_count}" id="kpi-comments">0</b><span class="t-caption c-2" style="font-weight:400">comments</span></div>
        <div class="kpi lift card" data-scroll-reveal><b class="c-accent">${rank ? '#' + rank : '—'}</b><span class="t-caption c-2" style="font-weight:400">${rank ? 'this week' : live ? 'unranked' : 'not live yet'}</span></div>
        <div class="kpi lift card" data-scroll-reveal><b data-count-to="${p.follower_count}">0</b><span class="t-caption c-2" style="font-weight:400">followers</span></div>
      </div>
      <div class="row between wrap gap-12" style="margin-bottom:20px"><h2 class="t-h3">Discussion · <span id="c-count">${p.comment_count}</span></h2><a class="badge badge--accent badge--pill" href="/chats/p-${p.slug}">${icon('chats', 'ic-14')}Open the product room</a></div>
      <form class="row gap-12" id="c-form" style="margin-bottom:28px;align-items:flex-start">${API.uid ? avatar(H.user(), 32) : '<span class="avatar">?</span>'}<div class="grow stack gap-8"><textarea class="input" id="c-text" rows="2" maxlength="4000" placeholder="${API.uid ? 'Ask the makers a question or share feedback' : 'Sign in to join the discussion'}" aria-label="Write a comment"></textarea><div class="row" style="justify-content:flex-end"><button class="btn btn--primary btn--sm" type="submit">Comment</button></div></div></form>
      <div class="stack gap-24" id="comments"></div>
    </div>
    <aside class="stack gap-20">
      ${company ? `<section class="card card--pad" data-scroll-reveal><h2 class="t-label" style="margin-bottom:14px">Company</h2>
        <div class="row gap-12" style="margin-bottom:14px">${plogo({ name: company.name, color: p.color }, 32)}<div><p class="t-label">${esc(company.name)}</p>${company.verified ? `<p class="t-caption c-success row gap-4" style="font-weight:400">${icon('check', 'ic-12')}Verified startup${company.registration ? ' · ' + esc(company.registration) : ''}</p>` : ''}</div></div>
        <div class="kv"><span>Stage</span><span>${esc(company.stage || p.stage)}</span></div><div class="kv"><span>HQ</span><span>${esc(company.city)}, ${H.COUNTRY[company.country] || company.country}</span></div><div class="kv"><span>Team</span><span>${company.team_size} people</span></div>${company.founded ? `<div class="kv"><span>Founded</span><span>${company.founded}</span></div>` : ''}<div class="kv"><span>Raised</span><span>${esc(company.raised || 'Undisclosed')}</span></div></section>` : ''}
      <section class="card card--pad" data-scroll-reveal><h2 class="t-label" style="margin-bottom:14px">Makers</h2><div class="stack gap-12">${team.map(m => `<div class="row gap-12">${avatar(m.user, 32)}<a class="grow" href="/makers/${m.user.username}"><p class="t-label">${esc(m.user.name)}</p><p class="t-caption c-3" style="font-weight:400">${esc(m.role || 'Maker')}${m.user.city ? ' · ' + esc(m.user.city) : ''}</p></a>${m.user.id === API.uid ? '' : `<button class="btn btn--sm ${following.has(m.user.id) ? 'btn--ghost' : 'btn--secondary'}" data-follow="${m.user.id}">${following.has(m.user.id) ? 'Following' : 'Follow'}</button>`}</div>`).join('') || '<p class="t-body-sm c-2">No makers listed yet.</p>'}</div></section>
      ${alts.length ? `<section class="card card--pad" data-scroll-reveal><h2 class="t-label" style="margin-bottom:14px">Alternatives</h2><div class="stack gap-12">${alts.map(a => `<a class="row gap-12" href="/products/${a.slug}">${plogo(a, 32)}<div><p class="t-label row gap-6">${esc(a.name)}${flag(a.country)}</p><p class="t-caption c-3" style="font-weight:400">${esc(a.tagline)}</p></div></a>`).join('')}</div></section>` : ''}
    </aside>
  </div>`;
  M.scroll(); M.countUp(); H.contentShown();
  API.trackView(p.id);
  // Visitors from a maker's Hentity badge (?ref=badge): count the click, and their upvote if they give one
  try {
    if (H.params().get('ref') === 'badge' && !sessionStorage.getItem('rb:' + p.id)) { sessionStorage.setItem('rb:' + p.id, '1'); API.badgeHit(p.slug, 'click'); }
    if (sessionStorage.getItem('rb:' + p.id)) document.addEventListener('hentity:vote', e => { if (e.detail && e.detail.id === p.id && e.detail.on && !sessionStorage.getItem('rbv:' + p.id)) { sessionStorage.setItem('rbv:' + p.id, '1'); API.badgeHit(p.slug, 'upvote'); } });
  } catch (e) {}
  if (p.testers_wanted || (API.uid && p.owner_id === API.uid)) API.openBetaOf(p.id).then(betaBits).catch(() => {});
  // ---------------------------------------------------------------- Unclaimed profile (Figma: Claims · Product · Unclaimed)
  // Built by Hentity from public business sources. Every fact shows its source; no people are named until the team
  // claims the page. Visitors can follow and ask the team to join; votes, comments and launches open after claiming.
  async function unclaimed(p) {
    const C = p.claim || {}, facts = C.facts || [], news = C.news || [];
    const fact = k => facts.find(f => f.key === k);
    const dom = (p.website || '').replace(/^https?:\/\/(www\.)?/i, '').replace(/\/.*$/, '');
    const mon = d => d ? new Date(d).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }) : '';
    const day = d => d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
    const src = f => { const t = [f.source, f.date ? mon(f.date) : f.checked ? 'checked ' + day(f.checked) : ''].filter(Boolean).join(' · '); return t ? (f.url ? `<a class="src" href="${esc(f.url)}" target="_blank" rel="noopener nofollow">${icon('link', 'ic-12')}${esc(t)}</a>` : `<span class="src">${icon('link', 'ic-12')}${esc(t)}</span>`) : ''; };
    const ago = d => { if (!d) return ''; const n = Math.round((Date.now() - new Date(d)) / 864e5); return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago'; };
    const cat = (p.categories || [])[0], catSlug = c => c.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const meta = [p.city || H.COUNTRY[p.country] ? `<span class="row gap-6">${flag(p.country)}${esc([p.city, H.COUNTRY[p.country] || p.country].filter(Boolean).join(', '))}</span>` : '', cat ? esc(cat) : '', fact('founded') ? 'Founded ' + esc(fact('founded').value) : '', fact('team') ? 'Team ' + esc(fact('team').value) : ''].filter(Boolean);
    const list = facts.filter(f => !['founded', 'team'].includes(f.key));
    const [followingProduct, asked, asks] = await Promise.all([API.following('product', [p.id]), API.notifyRequests(), API.asks(p.id)]);
    let fol = followingProduct.has(p.id), ask = asked.has(p.id), followers = p.follower_count || 0, nAsk = asks;
    const want = () => Math.max(followers, nAsk);
    qs('#pp').innerHTML = `
    <nav class="crumbs reveal" aria-label="Breadcrumb"><a href="/directory">Directory</a><span>/</span>${cat ? `<a href="/categories/${catSlug(cat)}">${esc(cat)}</a><span>/</span>` : ''}<span aria-current="page">${esc(p.name)}</span></nav>
    <div class="uc-banner reveal">${icon('info', 'ic-20')}<div class="grow" style="min-width:0"><p class="t-body-sm" style="font-weight:500"><span class="d-only">Hentity created this profile from public sources. It hasn’t been claimed by the team yet.</span><span class="m-only">Created by Hentity from public sources. Not yet claimed by the team.</span></p><p class="t-caption c-3 d-only" style="font-weight:400;margin-top:2px">Details may be incomplete.${C.checked_at ? ' Last checked ' + ago(C.checked_at) + '.' : ''}</p></div>
      <button class="btn btn--ghost btn--sm d-only" type="button" id="uc-report">Report an error</button><a class="btn btn--accent btn--sm d-only" href="/claim/${esc(p.slug)}">${icon('shield', 'ic-14')}Claim this profile</a></div>
    <div class="uc-head reveal" style="--i:1">
      ${plogo(p, 64)}
      <div class="grow" style="min-width:0">
        <h1 class="pp-title row gap-12 wrap" style="font-size:44px;line-height:50px;font-weight:600;letter-spacing:-0.03em">${esc(p.name)}<span class="uc-tag uc-tag--lg" style="letter-spacing:0">Unclaimed</span></h1>
        <p class="t-body-lg c-2 row gap-8 wrap" style="margin-top:6px">${esc(p.tagline)}${dom ? `<span class="src d-only">${icon('link', 'ic-12')}${esc(dom)}</span>` : ''}</p>
        <p class="row gap-8 wrap t-body-sm c-2 uc-meta" style="margin-top:8px">${meta.join('<span class="c-3">·</span>')}</p>
      </div>
      <div class="row gap-8 uc-cta">${p.website ? `<a class="btn btn--secondary" href="${esc(p.website)}" target="_blank" rel="noopener nofollow" id="getit">${icon('arrow-up-right')}<span class="d-only">Visit website</span><span class="m-only">Website</span></a>` : ''}<button class="btn btn--primary" type="button" id="uc-follow"></button><button class="btn btn--accent" type="button" id="vote" data-vote-big></button></div>
    </div>
    <div class="pp-body" style="margin-top:28px">
      <div class="stack gap-20">
        ${list.length ? `<section class="card uc-know" data-scroll-reveal><div class="row between gap-12" style="padding:20px 20px 4px"><h2 class="t-h4">What we know</h2><span class="t-caption c-3 d-only" style="font-weight:400">Every fact links to its source</span></div>
          ${list.map(f => `<div class="uc-row"><span class="t-body-sm c-2">${esc(f.label || f.key)}</span><div class="stack gap-6" style="align-items:flex-start;min-width:0"><span>${esc(f.value)}</span>${src(f)}</div></div>`).join('')}</section>` : ''}
        ${news.length ? `<section class="card card--pad d-only" data-scroll-reveal><h2 class="t-h4" style="margin-bottom:14px">In the news</h2><div class="stack gap-12">${news.map(n => `<a class="row gap-12 uc-news" href="${esc(n.url)}" target="_blank" rel="noopener nofollow"><span class="uc-thumb" style="background:linear-gradient(135deg,${esc(p.color || '#111')},#0a0a0a)"></span><span class="grow" style="min-width:0"><span class="t-body-sm" style="font-weight:500;display:block">${esc(n.title)}</span><span class="t-caption c-3" style="font-weight:400">${esc([n.source, n.date ? new Date(n.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : ''].filter(Boolean).join(' · '))}</span></span>${icon('arrow-up-right', 'ic-16')}</a>`).join('')}</div></section>` : ''}
        <section class="card card--pad row gap-16 wrap" data-scroll-reveal id="uc-ask-card"><div class="grow" style="min-width:220px"><p class="t-body-sm" style="font-weight:500" id="uc-want"></p><p class="t-caption c-3" style="font-weight:400;margin-top:2px">We tell the team every time someone asks. Comments open once it’s claimed.</p></div><button class="btn btn--secondary btn--sm" type="button" id="uc-ask"></button></section>
      </div>
      <aside class="stack gap-20 d-only-b">
        <section class="uc-dark" data-scroll-reveal><p class="t-eyebrow">Work at ${esc(p.name)}?</p><h2 class="t-h3" style="margin:6px 0 14px;color:#fff">Claim this profile</h2>
          <ul class="stack gap-10" style="list-style:none;margin:0 0 18px;padding:0">${['Fix anything we got wrong', 'Pick a launch date and go on the leaderboard', 'Reply to reviews and run beta programs', 'Start your Data room with what we found'].map(t => `<li><span class="ic">${icon('check', 'ic-14')}</span>${t}</li>`).join('')}</ul>
          <a class="btn btn--accent btn--block btn--lg" href="/claim/${esc(p.slug)}">${icon('shield', 'ic-16')}Claim ${esc(p.name)}</a>
          <p class="t-caption" style="font-weight:400;color:#a3a3a3;margin-top:12px;text-align:center">${dom ? `Fastest with a @${esc(dom)} email. About 2 minutes.` : 'Verify with company documents. Reviewed in 1–2 working days.'}</p></section>
        <section class="card card--pad" data-scroll-reveal><h2 class="t-label" style="margin-bottom:10px">Signals</h2>
          ${C.spotted_at ? `<div class="kv"><span>Spotted</span><span>${new Date(C.spotted_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</span></div>` : ''}
          <div class="kv"><span>Sources</span><span>${C.sources || new Set(facts.map(f => f.source).filter(Boolean)).size} public source${(C.sources || 0) === 1 ? '' : 's'}</span></div>
          <div class="kv"><span>Followers on Hentity</span><span id="uc-followers">${D.fmt(followers)}</span></div>
          <div class="kv"><span>Profile views</span><span>${D.fmt(p.view_count || 0)}</span></div></section>
        <p class="row gap-8 t-caption c-3" style="font-weight:400;align-items:flex-start">${icon('shield', 'ic-14')}<span>Hentity lists only public business information, never personal contact details. Team members can ask us to remove this page.</span></p>
        <button class="link t-body-sm" type="button" id="uc-remove" style="align-self:flex-start">Request removal</button>
      </aside>
    </div>
    <div class="uc-bar m-only-f"><span class="t-body-sm" style="font-weight:500">Work at ${esc(p.name)}?</span><a class="btn btn--accent btn--sm" href="/claim/${esc(p.slug)}">${icon('shield', 'ic-14')}Claim profile</a></div>`;
    const st = document.createElement('style');
    st.textContent = `.uc-head{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:20px;align-items:center;margin-top:32px}
      .uc-row{display:grid;grid-template-columns:126px minmax(0,1fr);gap:16px;padding:16px 20px;border-top:1px solid var(--color-border-default)}
      .uc-row:first-of-type{border-top:0}.uc-know .uc-row:nth-child(2){border-top:0}
      .uc-know{padding-bottom:6px}.uc-news:hover{color:var(--color-accent-default)}
      .uc-thumb{width:72px;height:48px;border-radius:8px;flex:none}
      .m-only,.m-only-f{display:none}
      @media (max-width:768px){.uc-head{grid-template-columns:56px minmax(0,1fr);margin-top:18px;gap:12px 14px}.uc-head>.grow{display:contents}.uc-head>.grow>p{grid-column:1/-1;margin-top:0!important}.uc-head h1{align-self:center}.uc-head .plogo{width:56px;height:56px}.uc-cta{grid-column:1/-1;display:grid!important;grid-template-columns:1fr 1fr;gap:8px}.uc-cta>#vote{grid-column:1/-1}
        .uc-head h1{font-size:30px!important;line-height:36px!important}.d-only{display:none!important}.d-only-b{display:none!important}.m-only{display:inline}
        .uc-row{grid-template-columns:minmax(0,1fr);gap:6px;padding:14px 16px}.uc-row>span:first-child{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-tertiary)}
        .uc-banner{padding:12px 14px}.m-only-f{display:flex}
        .uc-bar{position:fixed;left:0;right:0;bottom:84px;z-index:49;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:#0a0a0a;color:#fff}
        .pp{padding-bottom:110px!important}}`;
    document.head.appendChild(st);
    const setF = () => { qs('#uc-follow').innerHTML = fol ? icon('check') + 'Following' : icon('plus') + 'Follow'; qs('#uc-follow').className = 'btn ' + (fol ? 'btn--secondary' : 'btn--primary'); const f = qs('#uc-followers'); if (f) f.textContent = D.fmt(followers); };
    const setA = () => { qs('#uc-ask').innerHTML = ask ? icon('check', 'ic-14') + 'You asked' : icon('bell', 'ic-14') + 'Ask them to join'; qs('#uc-want').textContent = want() ? `${D.fmt(want())} ${want() === 1 ? 'person wants' : 'people want'} ${p.name} on Hentity` : `Want ${p.name} on Hentity?`; };
    setF(); setA();
    // Upvotes are open on unclaimed pages too
    D.remember([p]); await D.loadVotes([p]);
    const vb = qs('#vote'), vlabel = () => { vb.className = 'btn ' + (D.voted.has(p.id) ? 'btn--secondary' : 'btn--accent'); vb.innerHTML = icon('upvote') + (D.voted.has(p.id) ? 'Upvoted · ' : 'Upvote · ') + D.fmt(p.upvote_count); };
    vb.dataset.vote = p.id; vlabel(); vb.addEventListener('click', () => setTimeout(vlabel, 30)); D.liveCounts && D.liveCounts(vlabel);
    qs('#uc-follow').onclick = async () => { if (!API.uid) { location.href = '/signin?next=' + location.pathname; return; } fol = !fol; followers += fol ? 1 : -1; setF(); setA(); try { await API.follow('product', p.id, fol); } catch (e) { fol = !fol; followers += fol ? 1 : -1; setF(); setA(); H.fail(e); } };
    qs('#uc-ask').onclick = async () => { if (!API.uid) { location.href = '/signin?next=' + location.pathname; return; } ask = !ask; nAsk += ask ? 1 : -1; setA(); try { await API.notifyMe(p.id, ask); toast(ask ? `We’ll tell the ${p.name} team you asked` : 'Request removed'); } catch (e) { ask = !ask; nAsk += ask ? 1 : -1; setA(); H.fail(e); } };
    qs('#getit') && qs('#getit').addEventListener('click', () => API.trackClick(p.id));
    qs('#uc-report') && (qs('#uc-report').onclick = async () => { const why = prompt('What did we get wrong? Tell us the fact and the correct value.'); if (!why) return; try { await API.report('product', p.id, why); toast('Thanks. We’ll check it against the sources.'); } catch (e) { H.fail(e); } });
    const removal = () => {
      const el = document.createElement('div'); el.className = 'scrim';
      el.innerHTML = `<form class="modal stack gap-14" role="dialog" aria-modal="true" aria-label="Request removal"><h2 class="t-h3">Remove ${esc(p.name)} from Hentity</h2>
        <p class="t-body-sm c-2">If you work at ${esc(p.name)} and don’t want this page, tell us. We remove it within 48 hours and won’t add it again. Prefer to keep it and fix it instead? <a class="link link--accent" href="/claim/${esc(p.slug)}">Claim it</a>.</p>
        <label class="field"><span class="field__label">Your name</span><input class="input" name="nm" required maxlength="120"></label>
        <label class="field"><span class="field__label">Work email</span><input class="input" name="em" type="email" required placeholder="${dom ? 'you@' + esc(dom) : 'you@company.com'}"></label>
        <label class="field"><span class="field__label">Your role</span><input class="input" name="rel" maxlength="60" placeholder="Founder, CEO, legal…"></label>
        <label class="field"><span class="field__label">Anything else? (optional)</span><textarea class="input" name="why" rows="3" maxlength="1000"></textarea></label>
        <div class="row gap-8" style="justify-content:flex-end"><button class="btn btn--ghost" type="button" data-x>Cancel</button><button class="btn btn--primary" type="submit">Send request</button></div></form>`;
      document.body.appendChild(el);
      el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-x]')) el.remove(); });
      el.querySelector('form').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target); try { await API.requestRemoval(p.slug, f.get('nm'), f.get('em'), f.get('rel'), f.get('why')); el.remove(); toast('Request sent. We’ll reply within 48 hours.'); } catch (err) { H.fail(err); } };
    };
    qs('#uc-remove').onclick = removal;
    if (H.params().get('remove') === '1') removal();
    M.scroll(); H.contentShown(); API.trackView(p.id);
  }
  // Beta program (Figma: Product · with beta): callout by the buttons, card under "About this launch"
  function betaBits(b) {
    if (!b || (b.settings && b.settings.show_on_product === false && p.owner_id !== API.uid)) return;
    const left = Math.max(0, b.spots - (b.accepted_count || 0)), perk = B.perkText(b);
    const href = `/b/${esc(b.slug)}?s=product`;
    qs('#beta-callout').innerHTML = `<div class="bcall" data-scroll-reveal><div class="row gap-12" style="align-items:flex-start"><span class="bcall__i">${icon('flask', 'ic-16')}</span><div class="grow" style="min-width:0"><p class="t-label">Testers wanted: ${esc(b.title)}</p><p class="t-caption c-2" style="font-weight:400;margin-top:2px">${left} of ${b.spots} spots left${b.time_needed ? ' · ' + esc(b.time_needed) : ''}${perk ? ' · perk: ' + esc(perk) : ''}</p></div><a class="btn btn--primary btn--sm" href="${href}">${icon('flask', 'ic-14')}Test the beta</a></div><p class="row gap-6 t-caption c-3" style="font-weight:400;margin-top:10px">${icon('shield', 'ic-12')}Testing is separate from voting. You never need to upvote to join or get the perk.</p></div>`;
    const ag = b.agreement || {}, cl = ag.clauses || {};
    const who = [b.countries.length ? 'People in ' + B.countryText(b.countries) : 'People anywhere in Africa', b.platforms.length ? 'on ' + b.platforms.join(' or ') : ''].filter(Boolean).join(' ');
    const tiles = [['users', 'Who', who], ['list', 'What you’ll do', (b.steps || []).slice(0, 3).join(', ') || 'Try it and send a short feedback form'], ['signature', 'Agreement', 'A short beta agreement: ' + [cl.confidentiality !== false ? 'keep it private' : '', 'feedback terms', 'your data'].filter(Boolean).join(', ')], ['sparkles', 'Perk', perk ? perk + (b.airtime_amount > 0 ? ', paid by Hentity after feedback' : ', after feedback') : 'Early access and a direct line to the makers']];
    qs('#beta').innerHTML = `<section class="card bprog" id="beta-card" data-scroll-reveal>
      <div class="row between gap-12" style="align-items:flex-start"><div><p class="t-eyebrow" style="color:var(--color-info)">Beta program</p><h2 class="t-h3" style="margin-top:4px">${esc(b.title)}</h2></div><div class="row gap-6 wrap">${[...b.platforms, b.time_needed].filter(Boolean).map(t => `<span class="btag">${esc(t)}</span>`).join('')}</div></div>
      ${b.why ? `<p class="c-2" style="margin-top:12px">${esc(b.why)}</p>` : ''}
      <div class="bprog__tiles">${tiles.map(([i, t, d]) => `<div><span class="c-2">${icon(i, 'ic-14')}</span><p class="t-label" style="margin-top:8px">${t}</p><p class="t-caption c-2" style="font-weight:400;margin-top:4px">${esc(d)}</p></div>`).join('')}</div>
      <div class="row gap-16 wrap" style="margin-top:18px;align-items:center"><div class="grow" style="min-width:200px"><div class="bcard__bar"><i style="width:${B.filled(b)}%"></i></div><div class="row between t-caption c-3" style="font-weight:400;margin-top:8px"><span>${b.accepted_count} of ${b.spots} spots filled</span><span>Applications close ${esc(B.fmtDay(b.closes_at))}</span></div></div>
        <button class="btn btn--ghost btn--sm" type="button" id="beta-share">${icon('share', 'ic-14')}Share beta</button><a class="btn btn--primary btn--sm" href="${href}">${icon('flask', 'ic-14')}Apply to test</a></div>
    </section>`;
    M.scroll(qs('#pp'));
    qs('#beta-share').onclick = () => { const u = location.origin + '/b/' + b.slug; if (navigator.share) navigator.share({ title: b.title, url: u }).catch(() => {}); else { navigator.clipboard && navigator.clipboard.writeText(u); toast('Beta link copied'); } };
    if (location.hash === '#beta') setTimeout(() => qs('#beta-card').scrollIntoView({ behavior: 'smooth', block: 'center' }), 200);
  }
  qs('#getit') && qs('#getit').addEventListener('click', () => API.trackClick(p.id));
  qsa('.thumbs button').forEach(b => b.addEventListener('click', () => { qsa('.thumbs button').forEach(o => o.setAttribute('aria-selected', String(o === b))); const m = media[+b.dataset.i]; const st = qs('#stage'); st.querySelector('img') && st.querySelector('img').remove(); if (m.url) { st.style.background = '#000'; st.insertAdjacentHTML('afterbegin', `<img src="${esc(m.url)}" alt="${esc(p.name)} screenshot ${+b.dataset.i + 1}">`); } else st.style.background = m.color; }));
  const vb = qs('#vote');
  if (vb) {
    vb.dataset.vote = p.id;
    vb.addEventListener('click', () => setTimeout(() => { vb.className = 'btn btn--lg ' + (D.voted.has(p.id) ? 'btn--secondary' : 'btn--accent'); qs('#vote-l').textContent = voteLabel(); M.roll(qs('#kpi-votes'), D.fmt(p.upvote_count)); }, 30));
    D.liveCounts(() => { qs('#vote-l').textContent = voteLabel(); M.roll(qs('#kpi-votes'), D.fmt(p.upvote_count)); });
  }
  const nb = qs('#notify'); if (nb) { let on = (await API.notifyRequests()).has(p.id); const set = () => nb.innerHTML = on ? icon('check') + 'You’ll be notified' : icon('bell') + 'Notify me on launch day'; set(); nb.addEventListener('click', async () => { try { on = !on; await API.notifyMe(p.id, on); set(); toast(on ? 'We’ll remind you on launch day' : 'Reminder removed'); } catch (e) { on = !on; set(); H.fail(e); } }); }
  const fp = qs('#follow-p'); if (fp) { let on = followingProduct.has(p.id); const set = () => fp.innerHTML = on ? icon('check') + 'Following' : icon('plus') + 'Follow'; set(); fp.addEventListener('click', async () => { try { on = !on; await API.follow('product', p.id, on); set(); } catch (e) { on = !on; set(); H.fail(e); } }); }
  qs('#copy').addEventListener('click', () => { navigator.clipboard && navigator.clipboard.writeText(location.href); toast('Link copied'); });
  qs('#save').addEventListener('click', async e => { const b = e.currentTarget; const on = b.getAttribute('aria-pressed') !== 'true'; try { await API.bookmark('product', p.id, on); b.setAttribute('aria-pressed', on); b.querySelector('span').textContent = on ? 'Saved' : 'Save'; toast(on ? 'Saved to your list' : 'Removed from saved'); } catch (err) { H.fail(err); } });
  qsa('[data-follow]').forEach(b => b.addEventListener('click', async () => { const id = b.dataset.follow; const on = b.textContent !== 'Following'; try { await API.follow('user', id, on); b.textContent = on ? 'Following' : 'Follow'; b.className = 'btn btn--sm ' + (on ? 'btn--ghost' : 'btn--secondary'); } catch (e) { H.fail(e); } }));

  // Comments (threaded)
  let all = comments;
  function cHTML(c, isReply) {
    const isMaker = c.user && makerIds.has(c.user.id);
    return `<div class="comment" id="c-${c.id}">${c.user ? avatar(c.user, isReply ? 28 : null) : '<span class="avatar">?</span>'}<div class="grow" style="min-width:0">
      <p class="t-label row gap-8 wrap">${c.user ? `<a href="/makers/${c.user.username}">${esc(c.user.name)}</a>` : 'Deleted maker'}${isMaker ? `<span class="badge badge--founder">${owner && c.user.id === owner.id ? 'Founder' : 'Maker'} of ${esc(p.name)}</span>` : ''}<span class="c-3" style="font-weight:400">· ${H.ago(c.created_at)}</span></p>
      <p class="body" style="margin-top:6px;white-space:pre-wrap;${c.deleted ? 'color:var(--color-text-tertiary);font-style:italic' : ''}">${c.deleted ? 'This comment was deleted.' : esc(c.body)}</p>
      ${c.deleted ? '' : `<div class="c-actions">${!isReply ? `<button type="button" data-reply="${c.id}">Reply</button>` : ''}${c.user && c.user.id === API.uid ? `<button type="button" data-del="${c.id}">Delete</button>` : `<button type="button" data-report="${c.id}">Report</button>`}</div>`}
      ${!isReply ? `<div class="replies-in" data-replies="${c.id}">${all.filter(r => r.parent_id === c.id).map(r => cHTML(r, true)).join('')}</div>` : ''}
    </div></div>`;
  }
  function renderComments() { qs('#comments').innerHTML = all.filter(c => !c.parent_id).reverse().map(c => cHTML(c)).join('') || '<p class="t-body-sm c-2">No comments yet. Ask the makers something.</p>'; }
  renderComments();
  if (location.hash) setTimeout(() => { const t = document.querySelector(location.hash); t && t.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300);
  qs('#c-text').addEventListener('focus', () => { if (!API.uid) location.href = '/signin?next=' + location.pathname; });
  qs('#c-form').addEventListener('submit', async e => {
    e.preventDefault(); const v = qs('#c-text').value.trim(); if (!v) return;
    const btn = e.target.querySelector('button'); btn.disabled = true;
    try { const c = await API.comment({ product: p.id, body: v }); all.push(c); renderComments(); qs('#c-' + c.id).classList.add('reveal'); qs('#c-text').value = ''; p.comment_count++; M.roll(qs('#c-count'), p.comment_count); toast('Comment posted'); } catch (err) { H.fail(err); } finally { btn.disabled = false; }
  });
  qs('#comments').addEventListener('click', async e => {
    const r = e.target.closest('[data-reply]'), d = e.target.closest('[data-del]'), rp = e.target.closest('[data-report]');
    if (r) {
      if (!API.uid) { location.href = '/signin?next=' + location.pathname; return; }
      const box = qs(`[data-replies="${r.dataset.reply}"]`); if (box.querySelector('form')) return;
      box.insertAdjacentHTML('beforeend', `<form class="stack gap-8 reveal"><textarea class="input" rows="2" placeholder="Write a reply" aria-label="Reply"></textarea><div class="row gap-8"><button class="btn btn--primary btn--sm">Reply</button><button class="btn btn--ghost btn--sm" type="button" data-cancel>Cancel</button></div></form>`);
      const f = box.querySelector('form'); f.querySelector('textarea').focus();
      f.querySelector('[data-cancel]').onclick = () => f.remove();
      f.onsubmit = async ev => { ev.preventDefault(); const v = f.querySelector('textarea').value.trim(); if (!v) return; try { const c = await API.comment({ product: p.id, parent: r.dataset.reply, body: v }); all.push(c); renderComments(); toast('Reply posted'); } catch (err) { H.fail(err); } };
    }
    if (d) { if (!confirm('Delete this comment?')) return; try { await API.deleteComment(d.dataset.del); const c = all.find(x => x.id === d.dataset.del); c.deleted = true; renderComments(); toast('Comment deleted'); } catch (err) { H.fail(err); } }
    if (rp) { const why = prompt('Why are you reporting this comment?'); if (!why) return; try { await API.report('comment', rp.dataset.report, why); toast('Thanks — a moderator will take a look'); } catch (err) { H.fail(err); } }
  });
  API.presence('p:' + p.id, n => { const el = qs('#here'); if (!el) return; if (n < 2) { el.hidden = true; return; } el.hidden = false; M.roll(qs('#here-n'), `${n} people viewing now`); });
  API.live('pc', 'comments', 'product_id=eq.' + p.id, async ({ eventType, new: n }) => {
    if (eventType !== 'INSERT' || all.some(c => c.id === n.id)) return;
    const [u] = await API.profilesByIds([n.user_id]); all.push(Object.assign({}, n, { user: u })); renderComments(); const el = qs('#c-' + n.id); el && el.classList.add('flash'); M.roll(qs('#c-count'), all.length);
  });
})();
</script>
</body>
