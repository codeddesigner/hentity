<script>
(async function () {
  const { qs, qsa, icon } = H;
  await API.ready;
  if (!API.uid) { location.replace('/signin?next=/welcome'); return; }
  H.mount();
  const cats = ['Fintech', 'Apps', 'AI', 'Developer Tools', 'Health', 'Agriculture', 'Commerce', 'Energy & Climate', 'Education', 'Logistics', 'Proptech', 'Hardware'];
  const sel = new Set((API.profile.interests || []).length ? API.profile.interests : []);
  qs('#interests').innerHTML = cats.map(c => `<button class="chip chip--lg" type="button" data-chip aria-pressed="${sel.has(c)}">${icon('check')}${c}</button>`).join('');
  M.stagger(qs('#interests'));
  H.bindChips(qs('#interests'), validate);
  qsa('[data-use]').forEach(b => b.addEventListener('click', () => { qsa('[data-use]').forEach(o => o.setAttribute('aria-checked', String(o === b))); }));
  function picked() { return qsa('#interests [aria-pressed="true"]').map(c => c.textContent.trim()); }
  function validate() { const n = picked().length; qs('#hint').textContent = n < 3 ? `Pick ${3 - n} more to continue.` : ''; qs('#go').disabled = n < 3; }
  validate();
  qs('#form').addEventListener('submit', async e => {
    e.preventDefault(); if (picked().length < 3) return;
    const use = qs('[data-use][aria-checked="true"]').dataset.use;
    try { await API.updateProfile({ interests: picked(), settings: Object.assign({}, API.profile.settings, { onboarded: true, use }) }); sessionStorage.removeItem('hentity.pending'); location.href = use === 'launch' ? '/submit?new=1' : '/'; } catch (ex) { H.fail(ex); }
  });
})();
</script>
