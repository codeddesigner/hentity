<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta property="og:site_name" content="Hentity">
<meta property="og:locale" content="en_GB">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://sislzikhjapilksictxd.supabase.co" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/api.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/motion.js"></script>
<title>Create your account · Hentity</title>
<meta name="description" content="Discover the best new products built by African makers. A fresh launch board every Monday.">
<link rel="canonical" href="https://hentity.vercel.app/signup">
<meta property="og:title" content="Create your account · Hentity">
<meta property="og:description" content="Discover the best new products built by African makers. A fresh launch board every Monday.">
<meta property="og:url" content="https://hentity.vercel.app/signup">
<meta property="og:type" content="website">
<meta property="og:image" content="https://hentity.vercel.app/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Create your account · Hentity">
<meta name="twitter:description" content="Discover the best new products built by African makers. A fresh launch board every Monday.">
<meta name="twitter:image" content="https://hentity.vercel.app/og.png">
</head>
<body class="no-tabbar">
<div class="auth">
  <div data-brand></div>
  <main class="auth__side">
    <div data-mobilebar></div>
    <form class="auth__form" id="form" novalidate>
      <div class="auth__heading">
        <h1 class="t-h2">Create your account</h1>
        <p class="c-2">Join makers and early adopters discovering African technology.</p>
      </div>
      <a class="btn btn--secondary btn--block" href="/welcome?via=google" id="google"><span data-icon="google"></span>Continue with Google</a>
      <div class="divider-label">or</div>
      <div class="field" id="f-name">
        <label class="field__label" for="name">Full name</label>
        <input class="input" id="name" name="name" autocomplete="name" placeholder="Ada Okafor" required>
      </div>
      <div class="field" id="f-username">
        <div class="field__row"><label class="field__label" for="username">Username</label><span class="field__counter" id="u-count">0 / 30</span></div>
        <input class="input" id="username" name="username" autocomplete="username" maxlength="30" placeholder="ada" required spellcheck="false" autocapitalize="off">
        <p class="field__hint" id="u-hint">Lowercase letters, numbers and underscores.</p>
      </div>
      <div class="field" id="f-email">
        <label class="field__label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
        <p class="field__hint is-error" id="e-hint" hidden></p>
      </div>
      <div class="field" id="f-password">
        <label class="field__label" for="password">Password</label>
        <div class="input-group"><input class="input" id="password" name="password" type="password" autocomplete="new-password" required><button class="input-group__btn" type="button" data-reveal aria-label="Show password"></button></div>
        <p class="field__hint" id="p-hint">At least 10 characters.</p>
      </div>
      <label class="check"><input type="checkbox" name="terms" id="terms"><span class="check__box"><span data-icon="check"></span></span><span>I agree to the <a class="link" href="/guidelines" style="font-weight:400">Terms and Community Guidelines</a></span></label>
      <button class="btn btn--primary btn--block" type="submit" id="submit" disabled>Create account</button>
      <p class="auth__switch">Already on Hentity? <a href="/signin">Sign in</a></p>
    </form>
  </main>
</div>
<script src="/assets/auth.js"></script>
<script>
H.mount();
(async function () {
  const { qs } = H; const form = qs('#form');
  await API.ready; if (API.uid) { location.replace('/'); return; }
  let userOk = false, timer;
  function strength(p) { let s = 0; if (p.length >= 10) s++; if (/[A-Z]/.test(p) && /[a-z]/.test(p)) s++; if (/\d/.test(p)) s++; if (/[^A-Za-z0-9]/.test(p)) s++; return s; }
  function update() {
    const pw = form.password.value, ph = qs('#p-hint');
    ph.className = 'field__hint';
    if (!pw) ph.textContent = 'At least 10 characters.';
    else if (pw.length < 10) ph.textContent = `At least 10 characters. ${10 - pw.length} to go`;
    else { const s = strength(pw); ph.textContent = 'At least 10 characters. ' + (s >= 3 ? 'Strong ✓' : s === 2 ? 'Good' : 'Fair — add numbers or symbols'); if (s >= 3) ph.className = 'field__hint is-success'; }
    qs('#submit').disabled = !(form.name.value.trim() && userOk && Auth.emailOk(form.email.value.trim()) && pw.length >= 10 && qs('#terms').checked);
  }
  form.username.addEventListener('input', () => {
    const el = form.username; el.value = el.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
    const v = el.value, h = qs('#u-hint'); qs('#u-count').textContent = v.length + ' / 30';
    userOk = false; clearTimeout(timer); qs('#f-username').classList.remove('is-error');
    if (!v) { h.textContent = 'Lowercase letters, numbers and underscores.'; h.className = 'field__hint'; update(); return; }
    if (v.length < 3) { h.textContent = 'At least 3 characters.'; h.className = 'field__hint'; update(); return; }
    h.textContent = 'Checking hentity.vercel.app/makers/' + v + '…'; h.className = 'field__hint';
    timer = setTimeout(async () => {
      const ok = await API.usernameAvailable(v);
      if (form.username.value !== v) return;
      if (!ok) { h.textContent = '@' + v + ' is taken. Try ' + v + '_' + (Math.floor(Math.random() * 90) + 10); h.className = 'field__hint is-error'; qs('#f-username').classList.add('is-error'); }
      else { h.textContent = 'hentity.vercel.app/makers/' + v + ' · available'; h.className = 'field__hint is-success'; userOk = true; }
      update();
    }, 350);
  });
  form.name.addEventListener('blur', () => { if (!form.username.value && form.name.value.trim()) { form.username.value = form.name.value.trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 30); form.username.dispatchEvent(new Event('input')); } });
  form.addEventListener('input', update); form.addEventListener('change', update);
  form.addEventListener('submit', async e => {
    e.preventDefault(); if (qs('#submit').disabled) return;
    const email = form.email.value.trim().toLowerCase(); const btn = qs('#submit'); btn.disabled = true; btn.innerHTML = H.icon('clock', 'spin') + 'Creating account';
    try {
      const r = await API.auth.signUp({ email, password: form.password.value, name: form.name.value.trim(), username: form.username.value });
      if (r.user && r.user.identities && r.user.identities.length === 0) throw new Error('already registered');
      sessionStorage.setItem('hentity.pending', JSON.stringify({ email, name: form.name.value.trim() }));
      location.href = r.session ? '/welcome' : '/check-email';
    } catch (ex) { const [t, b] = Auth.friendly(ex.message); qs('#f-email').classList.add('is-error'); const eh = qs('#e-hint'); eh.hidden = false; eh.innerHTML = H.esc(t) + (/already/.test(t) ? ' <a class="link" href="/signin">Sign in</a>' : '. ' + H.esc(b)); btn.disabled = false; btn.textContent = 'Create account'; }
  });
  qs('#google').addEventListener('click', async e => { e.preventDefault(); try { await API.auth.google('/welcome?via=google'); } catch (ex) { H.toast(Auth.friendly(ex.message)[0], 'error'); } });
})();
</script>
</body>
</html>
