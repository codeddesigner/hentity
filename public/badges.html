<script>
H.mount({ active: '', tab: 'you' });
(async function () {
  const { qs, qsa, esc, icon, toast } = H;
  const root = qs('#main');
  await API.ready;
  if (!API.uid) { location.href = '/signin?next=/badges'; return; }
  let M;
  try { M = await API.badgeMe(); } catch (e) { root.innerHTML = `<p class="t-body-sm c-2" style="padding:48px 0;text-align:center">Couldn’t load your badges. ${esc(e.message || '')}</p>`; H.contentShown(); return; }
  const me = API.profile || {};
  const E = M.eval || {}, earned = M.earned || {};
  let featured = (M.featured || []).slice(), hidden = !!M.hidden;
  const has = k => !!earned[k];
  const total = B.KEYS.length, got = B.KEYS.filter(has).length;

  // How far along a locked badge is (0..1), and the line under it
  const ratio = k => { const v = E[k] || {}, d = B.D[k]; if (has(k)) return 1; if (d.levels) return Math.min(1, (v.n || 0) / d.levels[0]); if (k === 'room_ready') return v.target ? v.n / v.target : 0; return v.target > 1 ? Math.min(1, (v.n || 0) / v.target) : 0; };
  const nameOf = key => (DR_NAMES[key] || key);
  const DR_NAMES = { deck: 'pitch deck', onepager: 'one-pager', problem: 'proof of the problem', usefunds: 'use of funds', agreement: 'agreement for the money', demo: 'demo video', traction: 'traction', beta: 'beta results', model: 'financial model', burn: 'burn and runway', cap: 'cap table', cac: 'company registration', founders: 'founder agreement', safes: 'earlier SAFEs' };
  function almostText(k) {
    const v = E[k] || {};
    if (k === 'room_ready') return `${v.n} of ${v.target} required documents for ${B.STAGE[v.stage] || 'your round'}.${(v.missing || []).length ? ' Missing: ' + v.missing.slice(0, 3).map(nameOf).join(', ') + (v.missing.length > 3 ? ` and ${v.missing.length - 3} more` : '') + '.' : ''}`;
    if (k === 'good_listener') return `${v.n} of 20 replies to reviews and beta notes.${v.waiting ? ` ${v.waiting} review${v.waiting === 1 ? ' is' : 's are'} waiting for a reply.` : ''}`;
    if (k === 'reviewer') return `${v.n} of 5 reviews of other founders’ products.`;
    if (k === 'beta_host') return `${v.n} of 10 testers finished ${v.ref ? esc(v.ref) : 'your beta'}.`;
    if (k === 'shipper') return `${v.n} of 3 product updates shipped.`;
    if (k === 'helpful') return `${v.n} of 25 upvotes from verified members on your answers.`;
    return B.D[k].line + '.';
  }
  function meta(k) {
    const v = E[k] || {}, e = earned[k], d = B.D[k];
    if (e) {
      if (d.levels) { const nx = d.levels[e.level]; return `Level ${B.ROMAN[e.level]} · ${Number(v.n || e.stat || 0).toLocaleString('en-GB')} ${d.unit}s${nx ? ` · ${nx - (v.n || 0)} more for ${B.ROMAN[e.level + 1]}` : ''}`; }
      if (k === 'early_builder') return 'Joined ' + B.month(e.earned_at);
      if (k === 'beta_host') return `Earned ${B.day(e.earned_at)} · ${e.stat} testers`;
      return `Earned ${B.day(e.earned_at)}${e.ref && ['first_launch', 'top_day'].includes(k) ? ' · ' + esc(e.ref) : ''}`;
    }
    if (k === 'room_ready') return v.stage ? `${v.n} of ${v.target} required (${B.STAGE[v.stage]})` : 'Not started';
    if (d.levels) return v.n ? `${v.n} of ${d.levels[0]} ${d.unit}s` : 'Not started';
    if ((v.target || 1) > 1) return v.n ? `${v.n} of ${v.target}` : 'Not started';
    return 'Not started';
  }
  const card = k => { const e = earned[k], d = B.D[k];
    return `<button class="bd-card${e ? '' : ' bd-card--locked'}" type="button" data-b="${k}">${B.tile(k, { level: e && e.level, locked: !e })}<span class="t"><span class="n">${esc(d.name)}${e && d.levels ? `<span class="bd-pill">Level ${B.ROMAN[e.level]}</span>` : ''}</span><span class="l">${esc(d.line)}</span><span class="m">${meta(k)}</span></span></button>`; };
  const almost = B.KEYS.filter(k => !has(k) && ratio(k) > 0 && k !== 'resource_giver').sort((a, b) => ratio(b) - ratio(a)).slice(0, 3);
  const bar = (k, segs) => { const v = E[k] || {}, tgt = B.D[k].levels ? B.D[k].levels[0] : v.target || 1, cnt = Math.min(segs, tgt), on = Math.round(ratio(k) * cnt); return `<div class="bd-bar">${Array.from({ length: cnt }, (_, i) => `<i${i < on ? ' class="on"' : ''}></i>`).join('')}</div>`; };

  function draw() {
    const slots = [0, 1, 2].map(i => featured[i] && has(featured[i]) ? featured[i] : null);
    root.innerHTML = `<nav class="bd-crumbs"><a href="/makers/${esc(me.username || '')}">${esc(me.name || 'You')}</a><span>/</span><b>Badges</b></nav>
      <div class="bd-head"><div><h1>Badges</h1><p>Earned by using Hentity: launching, testing, helping other founders and getting ready to raise.</p></div>
        <div class="bd-count"><b>${got}</b><span>of ${total} earned</span><div class="bd-ticks">${B.KEYS.map((_, i) => `<i${i < got ? ' class="on"' : ''}></i>`).join('')}</div></div></div>
      ${almost[0] ? `<button class="bd-next bd-m" type="button" data-b="${almost[0]}">${B.tile(almost[0], { size: 56, locked: true })}<span><b>Next up: ${esc(B.D[almost[0]].name)}</b><p>${almostText(almost[0])}</p></span></button>` : ''}
      <section class="bd-feat${hidden ? ' bd-off' : ''}"><div class="bd-feat__h"><div><b>Shown on your profile</b><small>Pick up to 3. The first one also appears next to your name in Discuss.</small></div>
        <label class="bd-feat__tg">Show badges on my profile<span class="toggle"><input type="checkbox" id="show"${hidden ? '' : ' checked'}><span class="toggle__track"></span></span></label></div>
        <div class="bd-slots" id="slots">${slots.map((k, i) => k ? `<div class="bd-slot" draggable="true" data-slot="${i}" data-b="${k}">${B.tile(k, { size: 45, level: earned[k].level })}<span><b>${esc(B.title(k, earned[k].level))}</b><small>${i === 0 ? 'Shown next to your name' : 'On your profile'}</small></span><span class="grip" aria-hidden="true">${icon('grip', 'ic-16')}</span></div>`
          : `<button class="bd-slot bd-slot--empty" type="button" data-pick="${i}">${got ? icon('plus', 'ic-14') + 'Pick a badge' : 'Earn a badge to feature it'}</button>`).join('')}</div></section>
      <div class="bd-d">
        ${almost.length ? `<h2>Almost there</h2><div class="bd-grid">${almost.map(k => { const d = B.D[k]; return `<div class="bd-almost"><div class="h" data-b="${k}">${B.tile(k, { locked: true })}<div><b>${esc(d.name)}</b><span>${B.progText(k, E[k] || {})}</span></div></div>${bar(k, 10)}<p>${almostText(k)}</p>${d.cta ? `<a href="${d.cta[1]}">${esc(d.cta[0])} →</a>` : ''}</div>`; }).join('')}</div>` : ''}
        ${B.AREAS.map(([a, label]) => { const ks = B.KEYS.filter(k => B.D[k].area === a); return `<h2>${label}<small>${ks.filter(has).length} of ${ks.length}</small></h2><div class="bd-grid">${ks.map(card).join('')}</div>`; }).join('')}
      </div>
      <div class="bd-m">
        <h2>Earned<small>${got}</small></h2>${got ? `<div class="bd-tiles">${B.KEYS.filter(has).map(k => `<button class="bd-tile" type="button" data-b="${k}">${B.tile(k, { level: earned[k].level })}<span class="nm">${esc(B.D[k].name)}</span></button>`).join('')}</div>` : '<p class="t-body-sm c-2">Nothing yet. Launch, test an idea or start a discussion to earn your first.</p>'}
        <h2>To earn<small>${total - got}</small></h2><div class="bd-tiles">${B.KEYS.filter(k => !has(k)).map(k => `<button class="bd-tile is-locked" type="button" data-b="${k}">${B.tile(k, { locked: true })}<span class="nm">${esc(B.D[k].name)}</span></button>`).join('')}</div>
      </div>
      <p class="bd-note">${icon('info')}<span>Badges come from things you did on Hentity, checked by us. Upvotes only count from verified members, never your own. A badge is removed if the thing behind it is (for example, a product taken down for breaking the rules).</span></p>`;
    H.contentShown();
    wire();
  }
  async function saveFeatured(next) { featured = next; draw(); try { await API.badgeSet({ featured }); } catch (e) { H.fail(e); } }
  const onFeature = (k, on) => {
    let f = featured.filter(x => x !== k && has(x));
    if (on) { if (f.length >= 3) { toast(`Featured. It replaced ${B.D[f[2]].name}: you can show 3.`); f = f.slice(0, 2); } else toast('Featured on your profile'); f.push(k); }
    else toast('Removed from your profile');
    saveFeatured(f);
  };
  function open(k) { B.detail(k, earned[k], { mine: true, locked: !has(k), eval: E[k], holders: M.holders, featured, username: me.username, onFeature }); }
  function pick(i) {
    const avail = B.KEYS.filter(k => has(k) && !featured.includes(k));
    if (!avail.length) return toast(got ? 'All your badges are already featured' : 'Earn a badge first');

    el.innerHTML = `<div class="modal stack gap-14" role="dialog" aria-modal="true" aria-label="Pick a badge" style="max-width:420px"><h2 class="t-h3">Feature a badge</h2><div class="stack gap-8">${avail.map(k => `<button class="bd-slot" type="button" data-k="${k}">${B.tile(k, { size: 45, level: earned[k].level })}<span><b>${esc(B.title(k, earned[k].level))}</b><small>${esc(B.D[k].line)}</small></span></button>`).join('')}</div><button class="btn btn--ghost" type="button" data-x>Cancel</button></div>`;
    document.body.append(el);
    el.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) { const f = featured.filter(x => has(x)); f.splice(Math.min(i, f.length), 0, b.dataset.k); el.remove(); saveFeatured(f.slice(0, 3)); toast('Featured on your profile'); } else if (e.target === el || e.target.closest('[data-x]')) el.remove(); });
  }
  function wire() {
    root.onclick = e => { const p = e.target.closest('[data-pick]'); if (p) return pick(+p.dataset.pick); const b = e.target.closest('[data-b]'); if (b && !e.target.closest('a')) open(b.dataset.b); };
    qs('#show').onchange = async e => { hidden = !e.target.checked; qs('.bd-feat').classList.toggle('bd-off', hidden); try { await API.badgeSet({ hidden }); toast(hidden ? 'Badges hidden from your profile and Discuss' : 'Badges shown on your profile'); } catch (er) { H.fail(er); } };
    // Drag to reorder: the first slot is the one shown in Discuss
    let from = null;
    qsa('#slots [draggable]').forEach(s => {
      s.addEventListener('dragstart', e => { from = +s.dataset.slot; s.classList.add('is-drag'); e.dataTransfer.effectAllowed = 'move'; });
      s.addEventListener('dragend', () => { s.classList.remove('is-drag'); qsa('#slots .is-over').forEach(x => x.classList.remove('is-over')); });
      s.addEventListener('dragover', e => { e.preventDefault(); s.classList.add('is-over'); });
      s.addEventListener('dragleave', () => s.classList.remove('is-over'));
      s.addEventListener('drop', e => { e.preventDefault(); const to = +s.dataset.slot; if (from == null || from === to) return; const f = featured.filter(has); const [m] = f.splice(from, 1); f.splice(to, 0, m); saveFeatured(f); });
    });
  }
  draw();
  const want = new URLSearchParams(location.search).get('badge'); if (want && B.D[want]) open(want);
})();
</script>
</body>
</html>
