<title>Directory of African startups and products · Hentity</title>
<meta name="description" content="Search products built across Africa. Filter by country, payment method (Paystack, M-Pesa, MTN MoMo, USSD), stage, sector and language.">
<link rel="canonical" href="https://hentity.com/directory">
<style>
.dir{max-width:1136px;margin:0 auto;padding:28px 56px 96px;box-sizing:content-box}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0 28px}
.col-card{overflow:hidden;display:block}
.col-card i{display:block;height:72px}
.col-card div{padding:14px 14px 16px}
.dir-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px}
.drow{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--color-border-default);border-radius:var(--radius-lg);background:var(--color-bg-canvas)}
.drow + .drow{margin-top:10px}
.fpanel{background:var(--color-bg-subtle);border-radius:var(--radius-lg);padding:20px;align-self:start;position:sticky;top:88px}
.fpanel h3{margin:24px 0 12px}
.fpanel .check{display:flex;margin:0 0 10px;font-size:14px}
.sortsel{appearance:none;border:0;background:transparent;font-size:13px;font-weight:500;color:var(--color-text-primary);cursor:pointer;padding-left:20px}
@media (max-width:1024px){.dir-grid{grid-template-columns:minmax(0,1fr)}.fpanel{position:static;order:-1}}
@media (max-width:1180px){.dir{padding:32px 32px 80px}}
@media (max-width:768px){.dir{padding:16px 16px 32px}.cols{grid-template-columns:1fr 1fr 1fr;overflow-x:auto;grid-template-columns:repeat(3,240px);margin:20px -16px;padding:0 16px}.dir h1{font-size:32px!important;line-height:38px!important}.drow{padding:12px;gap:12px}.drow .plogo{width:40px;height:40px;font-size:18px}}
</style>
<meta property="og:title" content="Directory of African startups and products · Hentity">
<meta property="og:description" content="Search products built across Africa. Filter by country, payment method (Paystack, M-Pesa, MTN MoMo, USSD), stage, sector and language.">
<meta property="og:url" content="https://hentity.com/directory">
<meta property="og:type" content="website">
<meta property="og:image" content="https://hentity.com/og.png?v=712e217edc">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Directory of African startups and products · Hentity">
<meta name="twitter:description" content="Search products built across Africa. Filter by country, payment method (Paystack, M-Pesa, MTN MoMo, USSD), stage, sector and language.">
<meta name="twitter:image" content="https://hentity.com/og.png?v=712e217edc">
</head>
<body>
<div data-header></div>
<main class="dir">
  <div id="ptabs"></div>
  <div class="row between wrap gap-16" style="align-items:flex-end">
    <div><p class="t-eyebrow c-3" id="dir-count">Directory</p><h1 class="row gap-16" style="font-size:40px;line-height:46px;font-weight:600;letter-spacing:-0.025em;margin-top:8px" id="title">Built near you <span id="title-flag"></span></h1></div>
    <div class="seg" role="tablist" aria-label="Scope"><button role="tab" aria-selected="false" data-scope="local">Nigeria</button><button role="tab" aria-selected="true" data-scope="all">Pan-African</button></div>
  </div>
  <div class="cols" id="collections">
    <a class="card col-card lift" href="?pay=M-Pesa&scope=all"><i style="background:#16a34a"></i><div><p class="t-label">Tools that accept M-Pesa</p><p class="t-caption c-3" style="font-weight:400;margin-top:4px">Curated by Hentity</p></div></a>
    <a class="card col-card lift" href="?scope=all&country=GH"><i style="background:#2563eb"></i><div><p class="t-label">Built in Ghana</p><p class="t-caption c-3" style="font-weight:400;margin-top:4px">Curated by Hentity</p></div></a>
    <a class="card col-card lift" href="?scope=all&sort=votes"><i style="background:#ff5b14"></i><div><p class="t-label">Most upvoted</p><p class="t-caption c-3" style="font-weight:400;margin-top:4px">Ranked by the community</p></div></a>
  </div>
  <div class="dir-grid">
    <div>
      <div class="row between" style="margin-bottom:14px;gap:12px"><p class="t-label" style="font-size:14px" id="count" aria-live="polite"></p><label class="row" style="position:relative"><span data-icon="chevron-down" data-cls="ic-14"></span><span class="sr-only">Sort</span><select class="sortsel" id="sort" style="margin-left:-18px"><option value="followed">Sort: Most followed</option><option value="votes">Sort: Most upvoted</option><option value="new">Sort: Newest</option><option value="az">Sort: A–Z</option></select></label></div>
      <div id="list"></div>
    </div>
    <aside class="fpanel" aria-label="Filters">
      <div class="row between"><h2 class="t-h4" style="font-size:16px">Filters</h2><button class="link c-2" type="button" id="clear" style="font-weight:400">Clear all</button></div>
      <h3 class="t-eyebrow c-3">Country</h3><div data-group="country"></div>
      <h3 class="t-eyebrow c-3">Pays with</h3><div data-group="pay"></div>
      <h3 class="t-eyebrow c-3">Stage</h3><div data-group="stage"></div>
      <h3 class="t-eyebrow c-3">Sector</h3><div class="chips" id="sector"></div>
      <h3 class="t-eyebrow c-3">Language</h3><div data-group="lang"></div>
    </aside>
  </div>
</main>
<div data-tabbar></div>
<script src="/assets/data.js?v=91b9906d2a"></script>
<script>
H.mount({ active: 'products', tab: 'products' });
H.qs('#ptabs').innerHTML = H.productTabs('directory');
(async function () {
  const { qs, qsa, icon, flag, esc, store, toast, plogo } = H;
  const prm = H.params();
  API.publicStats().then(st => { if (st && st.products) qs('#dir-count').textContent = `Directory · ${st.products.toLocaleString('en-US')} product${st.products === 1 ? '' : 's'}`; }).catch(() => {});
  const G = { country: [['NG', 'Nigeria'], ['GH', 'Ghana'], ['KE', 'Kenya'], ['ZA', 'South Africa'], ['RW', 'Rwanda'], ['MA', 'Morocco']], pay: [['Paystack'], ['M-Pesa'], ['MTN MoMo'], ['USSD'], ['Card']], stage: [['Bootstrapped'], ['Pre-seed'], ['Seed'], ['Series A+']], lang: [['English'], ['Hausa'], ['Yoruba'], ['Swahili'], ['French'], ['Twi']] };
  const state = Object.assign({ country: [], pay: [], stage: [], lang: [], sector: [] }, store.get('dirFilters2', {}));
  let scope = prm.get('scope') || store.get('dirScope', 'all');
  const term = (prm.get('q') || '').replace(/[%,()]/g, '');
  if (prm.get('pay')) Object.assign(state, { pay: [prm.get('pay')], stage: [], sector: [], country: [] });
  if (prm.get('country')) Object.assign(state, { country: [prm.get('country')], pay: [], stage: [], sector: [] });
  if (prm.get('sector')) Object.assign(state, { sector: [prm.get('sector')], pay: [], stage: [], country: [] });
  if (term) { Object.keys(state).forEach(k => state[k] = []); scope = 'all'; }
  if (prm.get('sort')) qs('#sort').value = prm.get('sort');
  Object.entries(G).forEach(([g, opts]) => { qs(`[data-group="${g}"]`).innerHTML = opts.map(([v, l]) => `<label class="check"><input type="checkbox" value="${v}" data-f="${g}" ${state[g].includes(v) ? 'checked' : ''}><span class="check__box">${icon('check')}</span>${l || v}</label>`).join(''); });
  const sectors = ['Fintech', 'Apps', 'Commerce', 'Education', 'Health', 'AI', 'Agriculture', 'Dev Tools', 'Logistics'];
  qs('#sector').innerHTML = sectors.map(s => `<button class="chip" type="button" data-chip data-sector="${s}" aria-pressed="${state.sector.includes(s)}">${icon('check')}${s}</button>`).join('');
  H.bindChips(qs('#sector'), () => { state.sector = qsa('#sector [aria-pressed="true"]').map(c => c.dataset.sector); render(); });
  document.addEventListener('change', e => { const f = e.target.dataset && e.target.dataset.f; if (!f) return; state[f] = qsa(`[data-f="${f}"]:checked`).map(i => i.value); render(); });
  qs('#sort').addEventListener('change', render);
  qs('#clear').addEventListener('click', () => { Object.keys(state).forEach(k => state[k] = []); qsa('[data-f]').forEach(i => i.checked = false); qsa('#sector [data-chip]').forEach(c => c.setAttribute('aria-pressed', 'false')); render(); });
  qsa('[data-scope]').forEach(t => { t.setAttribute('aria-selected', String(t.dataset.scope === scope)); t.addEventListener('click', () => { scope = t.dataset.scope; store.set('dirScope', scope); qsa('[data-scope]').forEach(o => o.setAttribute('aria-selected', String(o === t))); render(); }); });
  let fol = new Set();
  async function render() {
    store.set('dirFilters2', state);
    qs('#list').innerHTML = Array.from({ length: 4 }, () => '<div class="drow"><span class="skel" style="width:48px;height:48px;border-radius:10px"></span><span class="grow stack gap-8"><span class="skel" style="width:30%;height:14px"></span><span class="skel" style="width:60%;height:12px"></span></span></div>').join('');
    try {
      const L = await API.directory({ countries: state.country, pay: state.pay, stages: state.stage, sectors: state.sector, langs: state.lang, term, sort: qs('#sort').value, scope });
      fol = await API.following('product', L.map(p => p.id));
      qs('#title').firstChild.textContent = term ? `Results for “${term}” ` : scope === 'local' ? 'Built near you ' : 'Built across Africa ';
      qs('#title-flag').innerHTML = scope === 'local' && !term ? flag('NG').replace('class="flag"', 'class="flag" style="width:36px;height:24px"') : '';
      qs('#count').textContent = `${L.length} product${L.length === 1 ? '' : 's'} ${scope === 'local' ? 'in Nigeria' : 'across Africa'}`;
      qs('#list').innerHTML = L.length ? L.map(p => `<article class="drow card lift stretch">${plogo(p)}<div class="grow stack gap-4" style="min-width:0"><p class="row gap-8 t-label" style="font-size:14px"><a class="stretch-link" href="/products/${p.slug}">${esc(p.name)}</a>${p.verified ? `<span class="row gap-4 c-success t-caption">${icon('check', 'ic-12')}Verified</span>` : ''}</p><p class="t-body-sm c-2">${esc(p.tagline)}</p><div class="row gap-8 wrap t-caption c-2" style="margin-top:2px"><span class="row gap-6">${flag(p.country)}${esc(p.city)}</span>${(p.categories || []).slice(0, 1).map(c => `<span class="badge">${esc(c)}</span>`).join('')}${p.stage ? `<span class="badge">${esc(p.stage)}</span>` : ''}${(p.pay_methods || []).length ? `<span class="badge badge--outline hide-sm">${esc(p.pay_methods.join(' · '))}</span>` : ''}</div></div><button class="btn btn--sm ${fol.has(p.id) ? 'btn--ghost' : 'btn--secondary'}" data-pf="${p.id}">${fol.has(p.id) ? 'Following' : 'Follow'}</button></article>`).join('')
        : `<div class="card card--pad" style="text-align:center;padding:40px 20px"><p class="t-h4">No products match these filters</p><p class="t-body-sm c-2" style="margin:6px 0 16px">Remove a filter or switch to Pan-African.</p><button class="btn btn--secondary btn--sm" type="button" onclick="document.getElementById('clear').click()">Clear all filters</button></div>`;
      M.stagger(qs('#list'));
    } catch (e) { H.fail(e); }
  }
  qs('#list').addEventListener('click', async e => { const b = e.target.closest('[data-pf]'); if (!b) return; const id = b.dataset.pf; const on = !fol.has(id); try { await API.follow('product', id, on); on ? fol.add(id) : fol.delete(id); b.textContent = on ? 'Following' : 'Follow'; b.className = 'btn btn--sm ' + (on ? 'btn--ghost' : 'btn--secondary'); } catch (err) { H.fail(err); } });
  await API.ready; render();
})();
</script>
</body>
</html>
