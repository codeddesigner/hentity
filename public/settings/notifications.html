<body class="subtle">
<div data-header></div>
<div class="settings">
  <div data-sidenav="notifications"></div>
  <main class="stack gap-24">
    <div class="page-head" style="margin:0"><div><h1>Notifications</h1><p>Choose what reaches you and where. Changes save as you go.</p></div></div>
    <div class="alert alert--accent" style="align-items:center"><span data-icon="bell"></span><p class="alert__body grow">WhatsApp messages go to <span id="wa">+234 803 ••• 4471</span>. Only launch-day events can use WhatsApp.</p><a class="link link--accent alert__action" href="/settings/account">Change number</a></div>
    <section class="card" style="padding:4px 20px 8px"><div class="matrix-wrap"><table class="matrix" id="matrix"></table></div></section>
    <section class="card card--pad">
      <div class="row gap-16 wrap">
        <span class="icon-tile"><span data-icon="clock"></span></span>
        <div class="grow" style="min-width:220px"><p class="list-row__title">Pause all notifications</p><p class="list-row__desc" id="pause-desc">Mute everything except security alerts for a while. Your launch still goes live on schedule.</p></div>
        <div class="row gap-8" data-single id="pause-len"><button class="chip" type="button" data-chip aria-pressed="false" data-len="1 day">1 day</button><button class="chip" type="button" data-chip aria-pressed="true" data-len="1 week">1 week</button></div>
        <label class="toggle"><input type="checkbox" id="pause" aria-label="Pause all notifications"><span class="toggle__track"></span></label>
      </div>
    </section>
  </main>
</div>
<div data-tabbar></div>
<script src="/assets/settings.js?v=ab155f0208"></script>
<script>
H.mount({ active: '', tab: 'you' });
(async function () {
  const { qs, qsa, toast, esc } = H;
  await SettingsReady; if (!API.uid) return;
  if (API.profile.whatsapp) qs('#wa').textContent = API.profile.whatsapp; else qs('#wa').textContent = 'your WhatsApp number (not added yet)';
  const groups = [
    ['Your launches', [
      ['review', 'Review decisions', 'Approved, changes requested or declined', true, true, null],
      ['scheduled', 'Scheduled & live', 'Your launch week is booked, and the morning it goes live', true, true, true],
      ['milestones', 'Upvote milestones', 'Batched hourly, then at 100, 250, 500 and 1,000', true, false, null],
      ['comments', 'Comments on your product', 'Includes voice notes', true, true, null],
      ['featured', 'Featured or awarded', 'Featured by the team, or a Product of the Week medal', true, true, true]]],
    ['Community', [
      ['replies', 'Replies to you', 'Someone answers your comment', true, false, null],
      ['followers', 'New followers', 'A maker or voter follows you', true, false, null],
      ['following', 'People you follow launch', 'A maker you follow goes live', true, false, null]]],
    ['Find', [
      ['find', 'Find activity', 'Applications, interest, matches and role approvals', true, true, null]]],
    ['Digests', [
      ['digest', 'The Launchpad, weekly', 'Last week’s top launches · Mondays 07:00 WAT', null, true, null],
      ['insights', 'Monthly Insights', 'What’s growing across Africa · 1st of the month', null, true, null],
      ['tips', 'Tips to finish your page', 'When your profile or product is missing something', null, true, null]]]
  ];
  const st = () => Object.assign({}, API.profile.settings || {});
  const prefs = Object.assign({}, st().notif || {});
  const ch = ['In-app', 'Email', 'WhatsApp'];
  qs('#matrix').innerHTML = groups.map(([g, rows]) => `<tbody><tr><th scope="col">${esc(g)}</th>${ch.map(c => `<th scope="col">${c}</th>`).join('')}</tr>
    ${rows.map(([k, t, d, ...def], ri) => `<tr${ri === rows.length - 1 ? ' class="group-end"' : ''}><td><p class="ev">${esc(t)}</p><p class="ev-d">${esc(d)}</p></td>
      ${def.map((v, ci) => { const key = k + '.' + ci; const on = key in prefs ? prefs[key] : v; return v === null ? '<td><span class="dash" aria-label="Not available">—</span></td>' : `<td><label class="toggle"><input type="checkbox" data-pref="${key}" ${on ? 'checked' : ''} aria-label="${esc(t)} by ${ch[ci]}"><span class="toggle__track"></span></label></td>`; }).join('')}</tr>`).join('')}</tbody>`).join('');
  qs('#matrix').addEventListener('change', async e => { const i = e.target.closest('[data-pref]'); if (!i) return; prefs[i.dataset.pref] = i.checked; try { await API.updateProfile({ settings: Object.assign(st(), { notif: prefs }) }); toast('Saved'); } catch (err) { i.checked = !i.checked; H.fail(err); } });
  H.bindChips(qs('#pause-len'), () => { if (qs('#pause').checked) setPause(true); });
  async function setPause(on, silent) {
    const len = (qs('#pause-len [aria-pressed="true"]') || {}).dataset?.len || '1 week';
    const until = on ? (silent && st().pause_until ? new Date(st().pause_until) : new Date(Date.now() + (len === '1 day' ? 1 : 7) * 864e5)) : null;
    qs('#pause-desc').textContent = on ? `Paused until ${until.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}. Security alerts still reach you, and your launch still goes live.` : 'Mute everything except security alerts for a while. Your launch still goes live on schedule.';
    qsa('[data-pref]').forEach(i => i.disabled = on);
    if (!silent) await API.updateProfile({ settings: Object.assign(st(), { pause_until: until ? until.toISOString() : null }) });
  }
  qs('#pause').addEventListener('change', async e => { try { await setPause(e.target.checked); toast(e.target.checked ? 'Notifications paused' : 'Notifications resumed'); } catch (err) { H.fail(err); } });
  if (st().pause_until && new Date(st().pause_until) > new Date()) { qs('#pause').checked = true; setPause(true, true); }
})();
</script>
